<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2UI Component Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0E0C0A;
  --card:  #1A1714;
  --card2: #221E1A;
  --bdr:   rgba(255,255,255,0.07);
  --amber: #E8A838;
  --coral: #FF7F5C;
  --green: #4ADE80;
  --blue:  #60A5FA;
  --vio:   #A78BFA;
  --red:   #F87171;
  --text:  #F0EBE4;
  --mut:   #7A7168;
  --faint: rgba(255,255,255,0.03);
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;align-items:center;}

/* ── HEADER ─────────────────────────── */
.hdr{width:100%;max-width:800px;padding:1.2rem 0 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-l{display:flex;align-items:center;gap:.65rem;}
.hdr-ico{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#1A1008;}
.hdr-name{font-family:'Playfair Display',serif;font-size:1rem;font-weight:800;}
.hdr-sub{font-size:.65rem;color:var(--mut);font-family:'JetBrains Mono',monospace;margin-top:.06rem;}
.pill-live{display:flex;align-items:center;gap:.4rem;background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.18);padding:.25rem .65rem;border-radius:100px;font-size:.62rem;color:var(--green);font-family:'JetBrains Mono',monospace;}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
.sep{width:100%;max-width:800px;height:1px;background:var(--bdr);margin:.9rem 0 0;flex-shrink:0;}

/* ── CHAT ───────────────────────────── */
.chat{width:100%;max-width:800px;flex:1;overflow-y:auto;padding:1.5rem 0 1rem;display:flex;flex-direction:column;gap:2rem;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;}

/* ── MESSAGE ────────────────────────── */
.mrow{display:flex;gap:.75rem;align-items:flex-start;opacity:0;transform:translateY(10px);transition:opacity .38s,transform .38s;}
.mrow.show{opacity:1;transform:translateY(0);}
.mav{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--amber),var(--coral));display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:800;color:#1A1008;flex-shrink:0;margin-top:2px;}
.mbody{flex:1;min-width:0;}
.mmeta{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.35rem;}
.mname{font-size:.78rem;font-weight:600;color:var(--amber);}
.mtime{font-size:.6rem;color:var(--mut);font-family:'JetBrains Mono',monospace;}
.mtext{font-size:.91rem;line-height:1.65;color:rgba(240,235,228,.72);max-width:580px;}

/* ── TYPING ─────────────────────────── */
.trow{display:flex;gap:.75rem;align-items:flex-start;opacity:0;transition:opacity .25s;}
.trow.show{opacity:1;}
.tbbl{background:var(--faint);border:1px solid var(--bdr);border-radius:10px;padding:.5rem .75rem;display:flex;gap:4px;align-items:center;margin-top:2px;}
.td{width:5px;height:5px;border-radius:50%;background:var(--mut);animation:bnc 1s infinite;}
.td:nth-child(2){animation-delay:.15s;} .td:nth-child(3){animation-delay:.3s;}

/* ── WIDGET ROW ─────────────────────── */
.wrow{display:flex;gap:.75rem;align-items:flex-start;opacity:0;transform:translateY(8px) scale(.985);transition:opacity .42s,transform .42s cubic-bezier(.34,1.25,.64,1);}
.wrow.show{opacity:1;transform:translateY(0) scale(1);}
.wspc{width:30px;flex-shrink:0;}
.wwrap{flex:1;min-width:0;}

/* ── CHIPS ──────────────────────────── */
.crow{display:flex;gap:.4rem;flex-wrap:wrap;padding-left:1.85rem;opacity:0;transform:translateY(6px);transition:opacity .3s ease .05s,transform .3s ease .05s;}
.crow.show{opacity:1;transform:translateY(0);}
.chip{background:rgba(232,168,56,.07);border:1px solid rgba(232,168,56,.22);color:var(--amber);padding:.3rem .72rem;border-radius:100px;font-size:.74rem;font-weight:500;cursor:pointer;transition:all .18s;font-family:'DM Sans',sans-serif;white-space:nowrap;}
.chip:hover:not(.used){background:rgba(232,168,56,.16);border-color:var(--amber);color:#fff;}
.chip.used{opacity:.25;cursor:default;pointer-events:none;}

/* ── FOOTER ─────────────────────────── */
.ftr{width:100%;max-width:800px;padding:.7rem 0 1.2rem;border-top:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.ftr-l{font-size:.65rem;color:var(--mut);font-family:'JetBrains Mono',monospace;}
.ftr-r{display:flex;align-items:center;gap:.4rem;font-size:.62rem;color:var(--mut);font-family:'JetBrains Mono',monospace;}
.ftag{background:rgba(232,168,56,.09);color:var(--amber);border:1px solid rgba(232,168,56,.18);padding:.1rem .42rem;border-radius:4px;font-size:.6rem;}

/* ═══════════════ SHARED ════════════════ */
.wcard{background:var(--card);border:1px solid var(--bdr);border-radius:16px;overflow:hidden;}
.whdr{padding:1.1rem 1.4rem .9rem;border-bottom:1px solid var(--bdr);}
.wh-t{font-family:'Playfair Display',serif;font-size:1rem;font-weight:800;}
.wh-s{font-size:.76rem;color:var(--mut);margin-top:.22rem;}
.ai-trigger{display:flex;align-items:flex-start;gap:.5rem;font-size:.74rem;color:var(--mut);margin-bottom:.85rem;padding:.55rem .75rem;background:rgba(255,255,255,.025);border-left:2px solid rgba(232,168,56,.3);border-radius:0 7px 7px 0;line-height:1.55;}
.ai-trigger em{font-style:normal;color:rgba(240,235,228,.6);}

/* ═══════════════ W1 HERO ════════════════ */
.w-hero{background:var(--card);border:1px solid rgba(232,168,56,.2);border-radius:16px;overflow:hidden;}
.hero-top{padding:1.5rem 1.75rem 1.25rem;background:linear-gradient(135deg,rgba(232,168,56,.1),rgba(255,127,92,.05));border-bottom:1px solid var(--bdr);position:relative;overflow:hidden;}
.hero-glow{position:absolute;right:-20px;top:-20px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(232,168,56,.18),transparent 70%);}
.hero-eye{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.2em;color:var(--amber);text-transform:uppercase;margin-bottom:.6rem;}
.hero-title{font-family:'Playfair Display',serif;font-size:2.1rem;font-weight:900;line-height:1.08;letter-spacing:-.02em;margin-bottom:.55rem;}
.hero-title em{font-style:normal;color:var(--amber);}
.hero-sub{font-size:.9rem;color:rgba(240,235,228,.5);line-height:1.65;max-width:480px;}
.hero-stats{padding:1rem 1.75rem;display:flex;align-items:center;gap:1.5rem;}
.hs{display:flex;flex-direction:column;gap:.06rem;}
.hs-v{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:800;line-height:1;}
.hs-l{font-size:.61rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;}
.hs-d{width:1px;height:30px;background:var(--bdr);}

/* ═══════════════ W2 PROBLEM ════════════════ */
.prob-cols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr);}
.prob-col{padding:1rem 1.25rem;}
.prob-tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;padding:.18rem .5rem;border-radius:4px;display:inline-flex;align-items:center;gap:.35rem;margin-bottom:.7rem;}
.pt-bad{background:rgba(248,113,113,.1);color:var(--red);}
.pt-bad2{background:rgba(248,113,113,.1);color:var(--red);}
.prob-name{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:800;margin-bottom:.4rem;}
.prob-desc{font-size:.78rem;color:var(--mut);line-height:1.6;margin-bottom:.7rem;}
.prob-mock{background:rgba(255,255,255,.03);border:1px solid var(--bdr);border-radius:8px;padding:.6rem .75rem;}
.pm-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-bottom:.35rem;}
.pm-bar:last-child{margin-bottom:0;}
.pm-bars{display:flex;flex-direction:column;gap:.25rem;}
.pm-iframe{background:rgba(255,127,92,.08);border:1px solid rgba(255,127,92,.2);border-radius:6px;padding:.5rem .6rem;}
.pm-iframe-lbl{font-size:.62rem;color:var(--coral);font-family:'JetBrains Mono',monospace;margin-bottom:.3rem;}
.pm-iframe-inner{background:rgba(255,255,255,.04);border-radius:4px;padding:.4rem .5rem;}
.pm-iframe-txt{font-size:.65rem;color:rgba(255,255,255,.3);font-family:'JetBrains Mono',monospace;}
.prob-bottom{padding:.75rem 1.25rem;border-top:1px solid var(--bdr);font-size:.78rem;color:var(--mut);font-style:italic;text-align:center;}

/* ═══════════════ W3 SOLUTION ════════════════ */
.sol-body{padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:1rem;}
.sol-tagline{font-family:'Playfair Display',serif;font-size:1.25rem;font-weight:800;line-height:1.2;}
.sol-tagline em{font-style:normal;color:var(--amber);}
.sol-flow{display:flex;align-items:stretch;gap:0;background:var(--bdr);border-radius:10px;overflow:hidden;}
.sol-step{flex:1;background:var(--card2);padding:.75rem .85rem;text-align:center;}
.sol-step-ico{font-size:1.2rem;margin-bottom:.3rem;}
.sol-step-lbl{font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:.2rem;}
.sol-step-name{font-size:.8rem;font-weight:600;}
.sol-arrow{display:flex;align-items:center;justify-content:center;width:28px;flex-shrink:0;background:var(--card2);color:var(--mut);font-size:.8rem;}
.sol-principles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.sol-p{background:var(--card2);border:1px solid var(--bdr);border-radius:9px;padding:.7rem .85rem;display:flex;gap:.6rem;align-items:flex-start;}
.sol-p-ico{font-size:1rem;flex-shrink:0;margin-top:.05rem;}
.sol-p-lbl{font-size:.82rem;font-weight:600;margin-bottom:.15rem;}
.sol-p-desc{font-size:.72rem;color:var(--mut);line-height:1.5;}

/* ═══════════════ W4 RECIPE ════════════════ */
.recipe-body{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr);}
.recipe-col{background:var(--card);padding:1rem 1.25rem;}
.recipe-role{font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;margin-bottom:.5rem;}
.recipe-title{font-family:'Playfair Display',serif;font-size:.95rem;font-weight:800;margin-bottom:.35rem;}
.recipe-desc{font-size:.78rem;color:var(--mut);line-height:1.6;margin-bottom:.75rem;}
.recipe-items{display:flex;flex-direction:column;gap:.3rem;}
.recipe-item{background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:7px;padding:.38rem .6rem;font-size:.75rem;display:flex;align-items:center;gap:.5rem;}
.ri-ico{font-size:.85rem;flex-shrink:0;}
.ri-lbl{flex:1;color:rgba(240,235,228,.7);}
.ri-sub{font-size:.65rem;color:var(--mut);}
.curator-tag{display:inline-block;background:rgba(232,168,56,.1);border:1px solid rgba(232,168,56,.25);color:var(--amber);font-family:'JetBrains Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:.15rem .5rem;border-radius:100px;margin-bottom:.5rem;}
.curator-items{display:flex;flex-direction:column;gap:.3rem;}
.ci-item{background:rgba(232,168,56,.05);border:1px solid rgba(232,168,56,.15);border-radius:7px;padding:.38rem .6rem;font-size:.75rem;display:flex;align-items:center;gap:.5rem;}
.ci-item .ri-lbl{color:rgba(240,235,228,.85);}
.recipe-footer{padding:.75rem 1.25rem;border-top:1px solid var(--bdr);background:var(--card);}
.recipe-footer-txt{font-size:.78rem;color:var(--mut);line-height:1.6;font-style:italic;}
.recipe-footer-txt strong{color:var(--text);font-style:normal;}

/* ═══════════════ W5 EXAMPLES ════════════════ */
.gtabs{display:flex;border-bottom:1px solid var(--bdr);padding:0 1.25rem;overflow-x:auto;gap:0;}
.gtab{padding:.65rem .85rem;font-size:.74rem;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;transition:all .18s;font-weight:500;}
.gtab:hover{color:var(--text);}
.gtab.on{color:var(--amber);border-bottom-color:var(--amber);}
.gpanel{display:none;padding:1.25rem 1.4rem;}
.gpanel.on{display:block;}

/* ── EX SHARED ── */
input[type=range]{width:100%;accent-color:var(--amber);cursor:pointer;}

/* ── EX 1: Deal Desk ── */
.deal-wrap{background:var(--card2);border:1px solid rgba(232,168,56,.2);border-radius:14px;overflow:hidden;}
.deal-top{padding:1.25rem 1.25rem 1rem;background:linear-gradient(135deg,rgba(232,168,56,.08),rgba(255,127,92,.04));border-bottom:1px solid var(--bdr);}
.deal-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.7rem;}
.deal-name{font-weight:700;font-size:.92rem;}
.deal-badges{display:flex;gap:.35rem;}
.deal-badge{padding:.14rem .45rem;border-radius:100px;font-size:.6rem;font-weight:600;}
.db-green{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.25);}
.db-amber{background:rgba(232,168,56,.12);color:var(--amber);border:1px solid rgba(232,168,56,.3);}
.deal-price-row{display:flex;align-items:baseline;gap:.55rem;margin-bottom:.2rem;}
.deal-num{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;line-height:1;color:var(--amber);}
.deal-num-sub{font-size:.75rem;color:var(--mut);}
.deal-savings{display:inline-flex;align-items:center;gap:.3rem;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);color:var(--green);font-size:.65rem;font-weight:600;padding:.15rem .5rem;border-radius:100px;margin-bottom:.9rem;}
.deal-terms{display:flex;gap:.35rem;margin-bottom:.9rem;}
.deal-term{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--bdr);border-radius:6px;padding:.42rem .45rem;text-align:center;cursor:pointer;font-size:.7rem;font-weight:500;transition:all .15s;color:var(--mut);}
.deal-term:hover,.deal-term.on{border-color:var(--amber);background:rgba(232,168,56,.07);color:var(--text);}
.sl-row{display:flex;justify-content:space-between;font-size:.68rem;color:var(--mut);margin-bottom:.3rem;}
.deal-bottom{padding:1rem 1.25rem 1.1rem;}
.deal-breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-bottom:.9rem;}
.dbb{background:rgba(255,255,255,.04);border-radius:8px;padding:.6rem .7rem;}
.dbb-l{font-size:.62rem;color:var(--mut);margin-bottom:.2rem;}
.dbb-v{font-size:.8rem;font-weight:600;}
.deal-btns{display:flex;gap:.45rem;}
.db{flex:1;padding:.56rem;border-radius:8px;border:none;font-size:.74rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s;}
.db-p{background:var(--amber);color:#1A1008;} .db-p:hover{opacity:.85;}
.db-s{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);} .db-s:hover{background:rgba(255,255,255,.12);}

/* ── EX 2: Trade-In ── */
.ti-wrap{background:var(--card2);border:1px solid var(--bdr);border-radius:14px;overflow:hidden;}
.ti-vehicle{padding:1rem 1.1rem;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:flex-start;}
.ti-v-name{font-weight:700;font-size:.88rem;}
.ti-v-spec{font-size:.67rem;color:var(--mut);margin-top:.1rem;}
.ti-v-badge{background:rgba(74,222,128,.1);color:var(--green);border:1px solid rgba(74,222,128,.22);padding:.14rem .5rem;border-radius:100px;font-size:.6rem;font-weight:600;white-space:nowrap;margin-top:.15rem;}
.ti-factors{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bdr);border-bottom:1px solid var(--bdr);}
.ti-factor{background:var(--card2);padding:.85rem .75rem;text-align:center;}
.ti-factor-ico{font-size:.95rem;margin-bottom:.3rem;}
.ti-factor-lbl{font-size:.6rem;color:var(--mut);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;}
.ti-factor-val{font-size:.78rem;font-weight:600;margin-top:.15rem;}
.ti-offer-block{padding:1.5rem 1.1rem 1.25rem;text-align:center;border-bottom:1px solid var(--bdr);}
.ti-offer-lbl{font-size:.62rem;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;margin-bottom:.6rem;font-family:'JetBrains Mono',monospace;}
.ti-offer-val{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;color:var(--green);line-height:1;margin-bottom:.5rem;}
.ti-offer-range{font-size:.72rem;color:rgba(74,222,128,.55);line-height:1.6;}
.ti-bar-wrap{padding:1rem 1.1rem 1rem;}
.ti-bar-lbl{display:flex;justify-content:space-between;font-size:.63rem;color:var(--mut);margin-bottom:.4rem;}
.ti-bar-track{height:5px;background:rgba(255,255,255,.07);border-radius:3px;position:relative;}
.ti-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--amber),var(--green));width:73%;}
.ti-bar-marker{position:absolute;top:-3px;left:73%;width:11px;height:11px;border-radius:50%;background:var(--green);border:2px solid var(--card2);transform:translateX(-50%);}
.ti-actions{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--bdr);}
.ti-act{background:var(--card2);padding:.95rem;text-align:center;cursor:pointer;font-size:.8rem;font-weight:600;transition:background .18s;}
.ti-act:hover{background:rgba(255,255,255,.04);}
.ti-act.yes{color:var(--green);}
.ti-act.no{color:var(--mut);}

/* ── EX 3: Finance vs Lease ── */
.fl-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.fl-opt{background:var(--card2);border:2px solid var(--bdr);border-radius:13px;padding:1.1rem;cursor:pointer;transition:all .2s;position:relative;}
.fl-opt:hover{border-color:rgba(232,168,56,.3);}
.fl-opt.s{border-color:var(--amber);background:rgba(232,168,56,.07);}
.fl-rec{position:absolute;top:-.5rem;left:50%;transform:translateX(-50%);background:var(--amber);color:#1A1008;font-size:.55rem;font-weight:800;padding:.1rem .45rem;border-radius:100px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;}
.fl-lbl{font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--mut);text-transform:uppercase;letter-spacing:.14em;margin-bottom:.5rem;}
.fl-opt.s .fl-lbl{color:var(--amber);}
.fl-amt{font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:900;line-height:1;margin-bottom:.2rem;}
.fl-period{font-size:.67rem;color:var(--mut);margin-bottom:.9rem;}
.fl-divider{height:1px;background:var(--bdr);margin-bottom:.75rem;}
.fl-rows{display:flex;flex-direction:column;gap:.4rem;}
.fl-r{display:flex;justify-content:space-between;font-size:.72rem;align-items:center;}
.fl-r-l{color:var(--mut);}
.fl-cost-bar{margin:.75rem 0 .2rem;}
.fl-cost-lbl{display:flex;justify-content:space-between;font-size:.62rem;color:var(--mut);margin-bottom:.35rem;}
.fl-cost-track{height:4px;background:rgba(255,255,255,.07);border-radius:2px;}
.fl-cost-fill{height:100%;border-radius:2px;}
.fl-cta-wrap{grid-column:1/-1;margin-top:.25rem;}
.fl-cta{width:100%;background:var(--amber);border:none;border-radius:9px;color:#1A1008;padding:.6rem;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:opacity .18s;}
.fl-cta:hover{opacity:.85;}

/* ── EX 4: Delivery ── */
.del-progress{margin-bottom:1rem;}
.del-prog-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.75rem;}
.del-car-info{}
.del-name{font-weight:700;font-size:.9rem;}
.del-vin{font-size:.62rem;color:var(--mut);font-family:'JetBrains Mono',monospace;margin-top:.1rem;}
.del-badge{background:rgba(96,165,250,.1);color:var(--blue);border:1px solid rgba(96,165,250,.25);padding:.15rem .5rem;border-radius:100px;font-size:.62rem;font-weight:600;white-space:nowrap;}
.del-prog-bar{height:4px;background:rgba(255,255,255,.07);border-radius:2px;margin-bottom:.4rem;}
.del-prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--amber),var(--blue));width:72%;}
.del-prog-labels{display:flex;justify-content:space-between;font-size:.6rem;color:var(--mut);font-family:'JetBrains Mono',monospace;}
.del-eta-row{display:flex;align-items:center;gap:.6rem;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.15);border-radius:8px;padding:.65rem .85rem;margin-bottom:1rem;}
.del-eta-ico{font-size:.9rem;}

const W2=`<div class="wcard">

const W3=`<div class="wcard">
  <div class="whdr"><div class="wh-t">Enter A2UI: safe like data, expressive like code.</div><div class="wh-s">The protocol that lets agents render UI without breaking your design.</div></div>

        <div style="padding:.5rem .75rem;font-size:.62rem;font-family:'JetBrains Mono',monospace;color:var(--amber);text-transform:uppercase;letter-spacing:.1em;text-align:center;background:rgba(232,168,56,.05);">A2UI / Native-First</div>

// ══════════════ ENGINE ══════════════
async function playStep(idx){
  if(idx<=activeStep)return;
  activeStep=idx;
  document.querySelectorAll('.chip').forEach(c=>c.classList.add('used'));
  const step=STEPS[idx],t=ts();
  for(const msg of step.msgs){
    await wait(msg.d);
    const ty=append(`<div class="trow"><div class="mav">✦</div><div class="tbbl"><div class="td"></div><div class="td"></div><div class="td"></div></div></div>`);
    show(ty);
    await wait(580+msg.t.length*7);
    ty.remove();
    const m=append(msgHTML(msg.t,t));
    show(m);
    await wait(160);
  }
  if(step.w){
    await wait(step.wD);
    const w=append(wHTML(step.w));
    show(w);
    await wait(320);
  }
  if(step.chips&&step.chips.length){
    await wait(Math.max(step.cD-step.wD-320,80));
    const c=append(cHTML(step.chips));
    show(c);
    scroll();
  }
}
function adv(idx,el){el.classList.add('used');playStep(idx);}

// ══════════════ INTERACTIONS ══════════════
let dealTerm=60;
function pickTerm(el,term){
  el.closest('.deal-terms').querySelectorAll('.deal-term').forEach(t=>t.classList.remove('on'));
  el.classList.add('on'); dealTerm=term;
  const rng=document.querySelector('input[type=range]');
  updDeal(rng?rng.value:3000);
}
function gTab(idx,el){
  el.closest('.wcard').querySelectorAll('.gtab').forEach((t,i)=>t.classList.toggle('on',i===idx));
  el.closest('.wcard').querySelectorAll('.gpanel').forEach((p,i)=>p.classList.toggle('on',i===idx));
}
function updDeal(v){
  const d=parseInt(v),p=31420-d,rate=0.059/12,n=dealTerm;
  const mo=Math.round(p*(rate*Math.pow(1+rate,n))/(Math.pow(1+rate,n)-1));
  const totalInt=Math.round((mo*n)-p);
  if(document.getElementById('dpDown')) document.getElementById('dpDown').textContent='$'+d.toLocaleString();
  if(document.getElementById('dpPrice')) document.getElementById('dpPrice').textContent='$'+p.toLocaleString();
  if(document.getElementById('dpNum')) document.getElementById('dpNum').textContent='$'+mo;
  if(document.getElementById('dpInt')) document.getElementById('dpInt').textContent='$'+totalInt.toLocaleString();
  if(document.getElementById('dpSavings')) document.getElementById('dpSavings').textContent='↓ Saving $'+(34200-p).toLocaleString()+' vs MSRP';
}
function pickFL(el,label){
  el.closest('.fl-grid').querySelectorAll('.fl-opt').forEach(o=>o.classList.remove('s'));
  el.classList.add('s');
  const cta=document.getElementById('flCta');
  if(cta)cta.textContent=`Continue with ${label} →`;
}
function pickDay(el){el.closest('.svc-days').querySelectorAll('.svc-day').forEach(d=>d.classList.remove('on'));el.classList.add('on');}
function pickTime(el){el.closest('.svc-times').querySelectorAll('.svc-time').forEach(t=>t.classList.remove('on'));el.classList.add('on');}
function updSvcTotal(){
  const prices=[94,0,55];
  let total=0;
  document.querySelectorAll('.svc-item').forEach((item,i)=>{if(item.classList.contains('on'))total+=prices[i];});
  const el=document.getElementById('svcTotal');
  if(el)el.textContent='$'+total;
}
function toggleCat(el){el.classList.toggle('on');}
function toggleStep(el){
  el.classList.toggle('on');
  const p=document.getElementById('subProg');
  if(p)p.textContent=`${document.querySelectorAll('.sstep.on').length} of ${document.querySelectorAll('.sstep').length} checked`;
}
