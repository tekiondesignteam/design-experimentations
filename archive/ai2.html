<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-Native Dealership Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
  (function(){
    var _w = console.warn;
    console.warn = function(){
      if(arguments[0] && typeof arguments[0]==='string' && arguments[0].indexOf('in-browser Babel')>-1) return;
      return _w.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; }
  button:active { transform: scale(0.97); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.8); opacity: 0; } }

  /* mobile */
  @media (max-width: 767px) {
    .bento-glance { grid-template-columns: 1fr !important; }
    .bento-glance > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
    .alert-act { flex-wrap: wrap; }
    .alert-split {
      grid-template-columns: 1fr !important;
      height: auto !important;
      min-height: 0 !important;
    }
    .alert-split > div { border-right: none !important; }
    .main-wrap { padding: 20px 16px 40px !important; }
  }

  /* tablet */
  @media (min-width: 768px) and (max-width: 1023px) {
    .main-wrap { padding: 28px 20px 44px !important; max-width: 720px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const mono = "'Fragment Mono', monospace";
const sans = "'Manrope', sans-serif";

const NARRATIVE = "Your morning has 3 things that need you. A recall, an absent rep, and a delayed delivery. The good news: 4 carryover deals and 5 appointments give you a real shot at closing the gap on target.";

const ALERTS = [
  { id: 1, sev: "critical", action: "Pull Highlander from inventory and reroute Patel to Venza", why: "Highlander Stop-Sale Recall", context: "VIN 4T1BZ... matched NHTSA recall #24V-891. Jennifer Patel has an active deal on this unit. Venza XLE at comparable pricing is available on lot.", conf: 98, steps: ["Remove VIN 4T1BZ from active inventory", "Flag unit for service department pickup", "Call Jennifer Patel to inform", "Present Venza XLE at $46,200 as alternative"] },
  { id: 2, sev: "high", action: "Reassign Emily Carter's 4 deals to Walker and Lee", why: "Emily Carter absent today", context: "She has 4 active deals. Two in negotiation (Thompson, Rodriguez), two pending finance (Henderson, Patel).", conf: 85, steps: ["Thompson and Henderson to Chris Walker", "Rodriguez to Jason Lee (repeat customer)", "Notify Walker and Lee via CRM task", "Hold Patel deal until Emily returns tomorrow", "Update today's floor schedule"] },
  { id: 3, sev: "medium", action: "Reschedule Lopez delivery to 4 PM and offer loaner", why: "Camry PDI delay, 2 units", context: "Detail shop backed up. ETA pushed from 10 AM to 3 PM. Sarah Lopez has 11 AM delivery appointment.", conf: 92, steps: ["Call Sarah Lopez to reschedule", "Arrange loaner from available pool"] },
];

const AUTO_RESOLVED = [
  { id: 101, time: "7:12 AM", rule: "Staff absence", summary: "Marcus Green called in late (arriving 10 AM). His 9:30 appointment with Michael Davis was reassigned to Chris Walker.",
    steps: [{ text: "Davis appointment reassigned to Walker in CRM", reversible: true }, { text: "Walker notified via SMS at 7:13 AM", reversible: false, channel: "SMS" }, { text: "Davis notified of rep change via SMS at 7:14 AM", reversible: false, channel: "SMS" }] },
  { id: 102, time: "6:45 AM", rule: "Overnight lead response", summary: "3 overnight leads auto-assigned to reps based on availability and pipeline load.",
    steps: [{ text: "Morales (RAV4) assigned to Walker", reversible: true }, { text: "White (Camry) assigned to Lee", reversible: true }, { text: "Kim (Highlander) assigned to Green", reversible: true }, { text: "Auto-reply email sent to Morales at 6:46 AM", reversible: false, channel: "Email" }, { text: "Auto-reply email sent to White at 6:46 AM", reversible: false, channel: "Email" }] },
];

const DEALS = [
  { id: 1, customer: "Daniel Thompson", vehicle: "RAV4 XLE", heat: 62, day: 3, last: "18h ago", rep: "Emily Carter", fin: "pending", gross: 3200, note: "Waiting on trade payoff" },
  { id: 2, customer: "Lisa Rodriguez", vehicle: "Camry SE", heat: 78, day: 1, last: "2h ago", rep: "Jason Lee", fin: "approved", gross: 2800, note: "Returning at noon to sign" },
  { id: 3, customer: "Mark Henderson", vehicle: "Tacoma SR5", heat: 45, day: 4, last: "26h ago", rep: "Chris Walker", fin: "pending", gross: 4100, note: "No response to last 2 calls" },
  { id: 4, customer: "Jennifer Patel", vehicle: "Highlander Ltd", heat: 0, day: 2, last: "4h ago", rep: "Emily Carter", fin: "approved", gross: 5200, note: "RECALL HOLD" },
  { id: 5, customer: "Kevin Brooks", vehicle: "Corolla LE", heat: 88, day: 0, last: "30m ago", rep: "Marcus Green", fin: "approved", gross: 1800, note: "Closing paperwork in progress" },
];

const APPTS = [
  { time: "9:30", p: "AM", customer: "Michael Davis", vehicle: "RAV4 XLE", type: "Internet Lead", rep: "Chris Walker" },
  { time: "11:00", p: "AM", customer: "Sarah Lopez", vehicle: "Corolla LE", type: "Delivery", rep: "Jason Lee" },
  { time: "1:30", p: "PM", customer: "Robert Nguyen", vehicle: "Camry SE", type: "Return Visit", rep: "Marcus Green" },
  { time: "4:00", p: "PM", customer: "Angela Brooks", vehicle: "Highlander XLE", type: "Referral", rep: "Chris Walker" },
  { time: "5:30", p: "PM", customer: "Tom Richards", vehicle: "Tacoma TRD", type: "Phone Lead", rep: "Jason Lee" },
];

const LEADS = [
  { name: "Kevin Morales", vehicle: "RAV4 XLE", src: "Cars.com", time: "2:14 AM", done: false },
  { name: "Amanda White", vehicle: "Camry SE", src: "Website", time: "11:42 PM", done: false },
  { name: "Brian Foster", vehicle: "Tacoma SR5", src: "Autotrader", time: "6:01 AM", done: true },
  { name: "Rachel Kim", vehicle: "Highlander", src: "TrueCar", time: "5:38 AM", done: false },
];

const TEAM = [
  { name: "Chris Walker", ini: "CW", deals: 5, gross: 4200, calls: 18, tasks: "10/12", c: "#059669", on: true },
  { name: "Jason Lee", ini: "JL", deals: 3, gross: 3800, calls: 14, tasks: "8/9", c: "#2563EB", on: true },
  { name: "Emily Carter", ini: "EC", deals: 4, gross: 3100, calls: 0, tasks: "0/11", c: "#D97706", on: false },
  { name: "Marcus Green", ini: "MG", deals: 2, gross: 2900, calls: 8, tasks: "5/7", c: "#7C3AED", on: true },
];

const FINANCE = [
  { id: 1, customer: "Daniel Thompson", vehicle: "RAV4 XLE", status: "pending", stips: "Proof of income" },
  { id: 2, customer: "Mark Henderson", vehicle: "Tacoma SR5", status: "pending", stips: "Proof of residence" },
];

const heatC = h => h >= 75 ? "#15803D" : h >= 50 ? "#A16207" : h >= 25 ? "#DC2626" : "#9CA3AF";
const heatBg = h => h >= 75 ? "#F0FDF4" : h >= 50 ? "#FFFBEB" : h >= 25 ? "#FEF2F2" : "#F3F4F6";
const heatIcon = h => h >= 75 ? "\u{1F525}" : h >= 50 ? "\u25D0" : h >= 25 ? "\u2198" : "\u2014";
const heatLabel = h => h >= 75 ? "Hot" : h >= 50 ? "Warm" : h >= 25 ? "Cooling" : "Cold";

function Tag({ children, bg = "#F3F4F6", c = "#374151", sx = {} }) {
  return <span style={{ display: "inline-block", padding: "2px 7px", borderRadius: 3, fontSize: 11, fontWeight: 600, background: bg, color: c, whiteSpace: "nowrap", lineHeight: "18px", ...sx }}>{children}</span>;
}

function Btn({ children, primary, onClick, sx = {} }) {
  const s = primary
    ? { background: "#18181B", color: "#FFF", border: "none", boxShadow: "0 1px 2px rgba(0,0,0,0.06)" }
    : { background: "#FFF", color: "#374151", border: "none", boxShadow: "inset 0 0 0 1px #E5E7EB" };
  return (
    <button onClick={onClick} style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "5px 12px", borderRadius: 4, fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: sans, transition: "all 0.12s", lineHeight: "18px", whiteSpace: "nowrap", ...s, ...sx }}
      onMouseEnter={e => e.currentTarget.style.opacity = "0.8"} onMouseLeave={e => e.currentTarget.style.opacity = "1"}
    >{children}</button>
  );
}

function Dot({ color, size = 6 }) { return <span style={{ display: "inline-block", width: size, height: size, borderRadius: "50%", background: color, flexShrink: 0 }} />; }
function Row({ children, sx = {}, className = "" }) { return <div className={className} style={{ display: "flex", alignItems: "center", ...sx }}>{children}</div>; }

function Sec({ label, sub }) {
  return (<div style={{ marginBottom: 12, marginTop: 4 }}>
    <div style={{ fontSize: 18, fontWeight: 700, color: "#18181B", letterSpacing: "-0.01em" }}>{label}</div>
    {sub && <div style={{ fontSize: 13, fontWeight: 500, color: "#9CA3AF", marginTop: 2 }}>{sub}</div>}
  </div>);
}

function B({ children, sx = {}, delay = 0 }) {
  const [v, setV] = useState(false);
  useEffect(() => { const t = setTimeout(() => setV(true), delay); return () => clearTimeout(t); }, [delay]);
  return (<div style={{ background: "#FFF", borderRadius: 8, border: "1px solid #EBEBEB", overflow: "hidden", opacity: v ? 1 : 0, transform: v ? "translateY(0)" : "translateY(6px)", transition: "opacity 0.3s ease, transform 0.3s ease", display: "flex", flexDirection: "column", ...sx }}>{children}</div>);
}

function Bp({ children, sx = {} }) { return <div style={{ padding: "16px 18px", flex: 1, ...sx }}>{children}</div>; }
function ListItem({ children, last }) { return <div style={{ padding: "9px 0", borderBottom: last ? "none" : "1px solid #F5F5F5" }}>{children}</div>; }

function App() {
  const [accepted, setAccepted] = useState(new Set());
  const [automated, setAutomated] = useState(new Set());
  const [executing, setExecuting] = useState(null);
  const [completedSteps, setCompletedSteps] = useState([]);
  const [executionDone, setExecutionDone] = useState(false);
  const [expandedAuto, setExpandedAuto] = useState(null);
  const [undoneAuto, setUndoneAuto] = useState(new Set());
  const [promptFocused, setPromptFocused] = useState(false);
  const [promptQuery, setPromptQuery] = useState("");
  const [alertIndex, setAlertIndex] = useState(0);
  const [showAllSteps, setShowAllSteps] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [showModifyModal, setShowModifyModal] = useState(false);
  const [modifyText, setModifyText] = useState("");
  const [modifySteps, setModifySteps] = useState([]);
  const [modifyPrompt, setModifyPrompt] = useState("");
  const [modifyPromptFocused, setModifyPromptFocused] = useState(false);
  const [modifyThinking, setModifyThinking] = useState(false);
  const [modifyApplied, setModifyApplied] = useState(false);
  const [newStepText, setNewStepText] = useState("");
  const [addingStep, setAddingStep] = useState(false);
  const promptRef = useRef(null);

  useEffect(() => { setTimeout(() => setLoaded(true), 30); }, []);
  useEffect(() => { if (promptRef.current) { promptRef.current.style.height = "auto"; promptRef.current.style.height = promptRef.current.scrollHeight + "px"; } }, [promptQuery]);

  const runExecution = (alert) => {
    setExecuting(alert.id); setCompletedSteps([]); setExecutionDone(false); setShowAllSteps(null);
    alert.steps.forEach((_, i) => { setTimeout(() => setCompletedSteps(prev => [...prev, i]), 800 + i * 1500); });
    setTimeout(() => setExecutionDone(true), 800 + alert.steps.length * 1500 + 600);
  };
  const dismissExecution = (id) => { setAccepted(p => new Set([...p, id])); setExecuting(null); setCompletedSteps([]); setExecutionDone(false); setAlertIndex(0); setShowAllSteps(null); };

  const carryover = DEALS.filter(d => d.day >= 1 && d.heat > 0).sort((a, b) => a.heat - b.heat);
  const unresponded = LEADS.filter(l => !l.done).length;
  const chips = [
    { label: "Deals closing today", icon: "\u{1F525}", q: "Which deals have the best chance of closing today and what do I need to do?" },
    { label: "Finance blockers", icon: "\u231B", q: "What deals are stuck waiting on finance approval and what are the stips?" },
    { label: "Team performance", icon: "\u{1F465}", q: "How is each rep performing this month and who needs coaching?" },
    { label: "Aged inventory", icon: "\u{1F4E6}", q: "Show me units sitting over 45 days and recommend pricing adjustments" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#F0F0F0", fontFamily: sans, color: "#18181B", opacity: loaded ? 1 : 0, transition: "opacity 0.4s" }}>
      <main className="main-wrap" style={{ maxWidth: 860, margin: "0 auto", padding: "32px 24px 48px" }}>

        {/* greeting */}
        <h1 style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.02em", color: "#18181B" }}>Good morning, Mike.</h1>
        <p style={{ fontSize: 14, fontWeight: 500, color: "#6B7280", lineHeight: 1.65, margin: "6px 0 20px", maxWidth: 720 }}>{NARRATIVE}</p>

        {/* prompt bar */}
        <div style={{ marginBottom: 20 }}>
          <style>{`
            @keyframes glowPulse {
              0%, 100% { box-shadow: 0 0 20px rgba(99,102,241,0.08), 0 0 40px rgba(139,92,246,0.04); }
              50% { box-shadow: 0 0 28px rgba(99,102,241,0.15), 0 0 56px rgba(139,92,246,0.08); }
            }
          `}</style>
          <div style={{
            borderRadius: 8, overflow: "hidden",
            background: "#FFF",
            border: promptFocused ? "1.5px solid #C7D2FE" : "1.5px solid #EBEBEB",
            boxShadow: promptFocused ? "0 0 24px rgba(99,102,241,0.12), 0 0 48px rgba(139,92,246,0.06)" : "0 1px 2px rgba(0,0,0,0.03)",
            animation: promptFocused ? "glowPulse 3s ease-in-out infinite" : "none",
            transition: "border-color 0.6s ease, box-shadow 0.6s ease",
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px" }}>
              <div style={{
                width: 30, height: 30, borderRadius: 6, flexShrink: 0,
                background: promptFocused ? "linear-gradient(135deg, #6366F1, #8B5CF6)" : "#F3F4F6",
                display: "flex", alignItems: "center", justifyContent: "center",
                transition: "all 0.6s ease",
                boxShadow: promptFocused ? "0 2px 12px rgba(99,102,241,0.25)" : "none",
              }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={promptFocused ? "#FFF" : "#9CA3AF"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ transition: "stroke 0.4s ease" }}><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
              </div>
              <textarea ref={promptRef} value={promptQuery} rows={1}
                onChange={e => setPromptQuery(e.target.value)}
                onFocus={() => setPromptFocused(true)}
                onBlur={() => setTimeout(() => setPromptFocused(false), 800)}
                onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) e.preventDefault(); }}
                placeholder={"Ask \u2022 Find \u2022 Summarize"}
                style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans, resize: "none", overflow: "hidden", lineHeight: "20px", height: 20, minHeight: 20, maxHeight: 120, padding: 0, margin: 0, display: "block" }}
              />
              {promptQuery.length > 0 ? <Btn primary sx={{ padding: "5px 14px", fontSize: 12, flexShrink: 0 }}>Ask</Btn> : <div style={{ padding: "3px 8px", borderRadius: 4, background: "#F3F4F6", display: "flex", alignItems: "center", gap: 3, flexShrink: 0 }}><span style={{ fontSize: 10, fontWeight: 600, color: "#9CA3AF", fontFamily: mono }}>{"\u2318"}K</span></div>}
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
            {chips.map((ch, ci) => (
              <button key={ci} onClick={() => { setPromptQuery(ch.q); setPromptFocused(true); promptRef.current?.focus(); }} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 4, background: "#FFF", border: "1px solid #EBEBEB", fontSize: 11, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans, whiteSpace: "nowrap", transition: "all 0.15s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "#C0C0C0"; e.currentTarget.style.color = "#18181B"; e.currentTarget.style.boxShadow = "0 1px 4px rgba(0,0,0,0.06)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#EBEBEB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.boxShadow = "none"; }}
              ><span style={{ fontSize: 12 }}>{ch.icon}</span>{ch.label}</button>
            ))}
          </div>
        </div>

        {/* alerts */}
        <Sec label="Needs Attention" sub={`${ALERTS.filter(a => !accepted.has(a.id)).length} of ${ALERTS.length} remaining`} />
        {(() => {
          const pending = ALERTS.filter(a => !accepted.has(a.id));
          if (pending.length === 0) return <B delay={60} sx={{ marginBottom: 28, textAlign: "center" }}><Bp sx={{ padding: "28px 24px" }}><div style={{ fontSize: 24, marginBottom: 6 }}>{"\u2713"}</div><div style={{ fontSize: 15, fontWeight: 700, color: "#15803D" }}>All clear</div><div style={{ fontSize: 13, fontWeight: 500, color: "#9CA3AF", marginTop: 4 }}>All {ALERTS.length} actions handled.</div></Bp></B>;
          const si = Math.min(alertIndex, pending.length - 1);
          const cur = pending[si];
          const total = pending.length;
          return (
            <div style={{ position: "relative", marginBottom: 48 }}>
              {total >= 3 && <div style={{ position: "absolute", bottom: -8, left: 16, right: 16, height: 20, background: "#F5F5F5", borderRadius: 8, border: "1px solid #E5E5E5", zIndex: 0 }} />}
              {total >= 2 && <div style={{ position: "absolute", bottom: -4, left: 8, right: 8, height: 20, background: "#FAFAFA", borderRadius: 8, border: "1px solid #EBEBEB", zIndex: 1 }} />}
              <B delay={80} sx={{ position: "relative", zIndex: 2, overflow: "visible" }}>
                <div className="alert-split" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, minHeight: 180 }}>
                  <div style={{ padding: "16px 20px", borderRight: "1px solid #F0F0F0", opacity: executing === cur.id ? 0.4 : 1, transition: "opacity 0.4s" }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "#18181B", lineHeight: 1.4, marginBottom: 6 }}>{cur.why}</div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: "#6B7280", lineHeight: 1.55 }}>{cur.context}</div>
                  </div>
                  <div style={{ padding: "16px 20px", background: executing === cur.id ? (executionDone ? "#F0FDF9" : "#F8FAFC") : "#F8FAFC", transition: "background 0.4s" }}>
                    <Row sx={{ justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", color: executing === cur.id ? (executionDone ? "#15803D" : "#2563EB") : "#2563EB" }}>{executing === cur.id ? (executionDone ? "Actions Completed" : "Running Actions...") : "Recommendation"}</div>
                      {!executing && <span onClick={() => { setModifyText(cur.action); setModifySteps([...cur.steps]); setShowModifyModal(true); }} style={{ fontSize: 11, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", display: "flex", alignItems: "center", gap: 3 }}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>Modify</span>}
                    </Row>
                    <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.4, marginBottom: 10, color: executing === cur.id && executionDone ? "#15803D" : "#18181B" }}>{cur.action}</div>

                    {cur.steps.slice(0, 5).map((step, sti) => {
                      const done = completedSteps.includes(sti);
                      const active = executing === cur.id && !done && (sti === 0 || completedSteps.includes(sti - 1));
                      return (<Row key={sti} sx={{ gap: 8, padding: "5px 0", borderBottom: sti < Math.min(cur.steps.length, 5) - 1 ? "1px solid #EDF0F3" : "none" }}>
                        <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, fontFamily: mono, transition: "all 0.4s", ...(done ? { background: "#10B981", color: "#FFF" } : active ? { background: "#3B82F6", color: "#FFF", animation: "pulse 1.5s ease-in-out infinite" } : { background: "#EFF6FF", color: "#2563EB" }) }}>
                          {done ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg> : sti + 1}
                        </div>
                        <span style={{ fontSize: 13, fontWeight: done ? 600 : 500, lineHeight: 1.45, color: done ? "#15803D" : "#374151", textDecoration: done ? "line-through" : "none", transition: "all 0.3s" }}>{step}</span>
                        {done && <span style={{ fontSize: 10, fontWeight: 600, color: "#15803D", marginLeft: "auto" }}>Done</span>}
                      </Row>);
                    })}

                    {cur.steps.length > 5 && !executing && (
                      <span onClick={() => setShowAllSteps(s => s === cur.id ? null : cur.id)} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "6px 0", cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#2563EB" }}>
                        +{cur.steps.length - 5} more
                      </span>
                    )}
                  </div>
                </div>
                <div style={{ padding: "8px 20px 12px", borderTop: "1px solid #F0F0F0", background: "#FAFAFA", borderRadius: "0 0 8px 8px" }}>
                  {executing === cur.id ? (<div>
                    <Row sx={{ justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: executionDone ? "#15803D" : "#2563EB" }}>{executionDone ? "All actions completed" : `Executing step ${Math.min(completedSteps.length+1, cur.steps.length)} of ${cur.steps.length}...`}</span>
                      <span style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF", fontFamily: mono }}>{completedSteps.length}/{cur.steps.length}</span>
                    </Row>
                    <div style={{ height: 3, borderRadius: 2, background: "#E5E7EB", overflow: "hidden" }}><div style={{ height: "100%", borderRadius: 2, width: `${(completedSteps.length/cur.steps.length)*100}%`, background: executionDone ? "#10B981" : "linear-gradient(90deg, #3B82F6, #8B5CF6)", transition: "width 0.5s, background 0.4s" }} /></div>
                    {executionDone && <div style={{ marginTop: 12 }}>
                      {automated.has(cur.sev+cur.why) ? (
                        <div style={{ padding: "14px 16px", borderRadius: 8, background: "linear-gradient(135deg, #F0FDF4 0%, #ECFDF5 100%)", border: "1px solid #BBF7D0" }}>
                          <Row sx={{ gap: 10, marginBottom: 6 }}>
                            <div style={{ width: 28, height: 28, borderRadius: 6, flexShrink: 0, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
                            <div style={{ fontSize: 14, fontWeight: 700, color: "#15803D" }}>{cur.why.toLowerCase().includes("recall") ? "Recall responses are now on autopilot" : cur.why.toLowerCase().includes("absent") ? "Staff absences are now on autopilot" : "PDI delays are now on autopilot"}</div>
                          </Row>
                          <div style={{ fontSize: 12, fontWeight: 500, color: "#374151", lineHeight: 1.55, marginBottom: 8 }}>{cur.why.toLowerCase().includes("recall") ? "Next time a recall hits, AI pulls the unit, contacts the customer, and lines up an alternative before you even open the dashboard." : cur.why.toLowerCase().includes("absent") ? "Next time someone calls in, AI reassigns their deals by pipeline fit and notifies the team. You'll see a summary in AI Handled." : "Next time detail runs late, AI reschedules the customer, arranges a loaner, and flags the team. You'll see a summary in AI Handled."}</div>
                          <span style={{ fontSize: 12, fontWeight: 600, color: "#059669", cursor: "pointer" }}>Edit or manage this automation in Tasks {"\u2192"}</span>
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderRadius: 6, background: "#FFF", border: "1px dashed #D4D4D4" }}>
                          <div style={{ width: 24, height: 24, borderRadius: 5, flexShrink: 0, background: "#F3F0FF", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg></div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: "#7C3AED" }}>{cur.why.toLowerCase().includes("recall") ? "Let AI handle recalls like this going forward" : cur.why.toLowerCase().includes("absent") ? "Let AI reassign deals when someone calls in absent" : "Let AI reschedule deliveries when PDI runs late"}</div>
                            <div style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF" }}>Same steps you just approved, runs automatically. You just get notified.</div>
                          </div>
                          <Btn onClick={() => setAutomated(p => new Set([...p, cur.sev+cur.why]))} sx={{ flexShrink: 0, background: "#7C3AED", color: "#FFF", padding: "6px 16px", fontSize: 12, boxShadow: "0 1px 2px rgba(124,58,237,0.2)" }}>Enable</Btn>
                        </div>
                      )}
                      <Btn primary onClick={() => dismissExecution(cur.id)} sx={{ marginTop: 10, width: "100%", justifyContent: "center", padding: "9px 16px", fontSize: 13 }}>{total > 1 ? `Next (${total-1} remaining)` : "Done"}</Btn>
                    </div>}
                  </div>) : (<>
                    <Row sx={{ justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                      <Row className="alert-act" sx={{ gap: 4 }}>
                        <Btn primary onClick={() => runExecution(cur)}>Approve &amp; Run</Btn>
                        <span onClick={() => { setAccepted(p => new Set([...p, cur.id])); setAlertIndex(0); setShowAllSteps(null); }} style={{ fontSize: 13, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", padding: "5px 4px", textDecoration: "underline", textUnderlineOffset: 2 }}>Skip</span>
                      </Row>
                      {total > 1 && <Row sx={{ gap: 4 }}>
                        <button onClick={() => { setAlertIndex(i => Math.max(i-1,0)); setShowAllSteps(null); }} disabled={si===0} style={{ width: 28, height: 28, borderRadius: 4, border: "1px solid #EBEBEB", background: si===0 ? "transparent" : "#FFF", color: si===0 ? "#D4D4D4" : "#374151", cursor: si===0 ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontFamily: sans }}>{"\u2039"}</button>
                        <span style={{ fontSize: 12, fontWeight: 600, color: "#6B7280", fontFamily: mono, minWidth: 36, textAlign: "center" }}>{si+1}/{total}</span>
                        <button onClick={() => { setAlertIndex(i => Math.min(i+1,total-1)); setShowAllSteps(null); }} disabled={si===total-1} style={{ width: 28, height: 28, borderRadius: 4, border: "1px solid #EBEBEB", background: si===total-1 ? "transparent" : "#FFF", color: si===total-1 ? "#D4D4D4" : "#374151", cursor: si===total-1 ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontFamily: sans }}>{"\u203A"}</button>
                      </Row>}
                    </Row>
                  </>)}
                </div>
              </B>

              {/* tooltip for 6+ steps - overlay */}
              {showAllSteps === cur.id && !executing && cur.steps.length > 5 && (<>
                <div onClick={() => setShowAllSteps(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.1)", zIndex: 29 }} />
                <div style={{
                  position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
                  background: "#FFF", border: "1px solid #E5E7EB", borderRadius: 10,
                  boxShadow: "0 12px 32px rgba(0,0,0,0.14), 0 4px 12px rgba(0,0,0,0.06)",
                  padding: "16px 18px", width: 320, maxWidth: "90vw", zIndex: 30,
                }}>
                  <Row sx={{ justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: "#2563EB", textTransform: "uppercase", letterSpacing: "0.05em" }}>All {cur.steps.length} steps</span>
                    <span onClick={() => setShowAllSteps(null)} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer" }}>{"\u2715"}</span>
                  </Row>
                  {cur.steps.map((s, si) => (
                    <Row key={si} sx={{ gap: 8, padding: "5px 0", borderBottom: si < cur.steps.length - 1 ? "1px solid #F3F4F6" : "none" }}>
                      <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB", fontFamily: mono }}>{si + 1}</div>
                      <span style={{ fontSize: 13, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{s}</span>
                    </Row>
                  ))}
                </div>
              </>)}
            </div>
          );
        })()}

        {/* AI Handled */}
        {(() => {
          const visible = AUTO_RESOLVED.filter(a => !undoneAuto.has(a.id));
          if (visible.length === 0) return null;
          return (<div style={{ marginBottom: 48 }}>
            <Row sx={{ gap: 8, marginBottom: 8 }}>
              <div style={{ width: 18, height: 18, borderRadius: 4, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
              <span style={{ fontSize: 13, fontWeight: 700, color: "#15803D" }}>AI handled {visible.length} {visible.length === 1 ? "item" : "items"} for you this morning</span>
            </Row>
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {visible.map(ar => {
                const isOpen = expandedAuto === ar.id;
                const revSteps = ar.steps.filter(s => s.reversible);
                const sentSteps = ar.steps.filter(s => !s.reversible);
                return (<B key={ar.id} delay={40} sx={{ background: "#FAFDF9", border: "1px solid #E5EDE2" }}>
                  <div onClick={() => setExpandedAuto(isOpen ? null : ar.id)} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "10px 14px", cursor: "pointer" }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#374151" }}>{ar.summary}</span>
                      <Row sx={{ gap: 8, marginTop: 3 }}>
                        <span style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", fontFamily: mono }}>{ar.time}</span>
                        <span style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF" }}>Rule: {ar.rule}</span>
                      </Row>
                    </div>
                    <Btn onClick={e => { e.stopPropagation(); setExpandedAuto(isOpen ? null : ar.id); }} sx={{ flexShrink: 0, fontSize: 11, padding: "4px 10px", color: isOpen ? "#9CA3AF" : "#15803D" }}>{isOpen ? "Close" : "Review"}</Btn>
                  </div>
                  {isOpen && (<div style={{ padding: "0 14px 12px 14px", borderTop: "1px solid #E5EDE2" }}>
                    <div style={{ marginTop: 8 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, color: "#15803D", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 6 }}>What AI did</div>
                      {ar.steps.map((step,sti) => (<Row key={sti} sx={{ gap: 8, padding: "4px 0", borderBottom: sti < ar.steps.length-1 ? "1px solid #F0EDE8" : "none" }}>
                        <div style={{ width: 16, height: 16, borderRadius: 3, flexShrink: 0, background: step.reversible ? "#D1FAE5" : "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center" }}>
                          {step.reversible ? <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg> : <svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg>}
                        </div>
                        <span style={{ fontSize: 11, fontWeight: 500, color: "#374151", flex: 1 }}>{step.text}</span>
                        {!step.reversible && <Tag bg="#F3F4F6" c="#9CA3AF" sx={{ fontSize: 9 }}>{step.channel} sent</Tag>}
                      </Row>))}
                    </div>
                    <div style={{ marginTop: 10, padding: "10px 12px", borderRadius: 4, background: "#FFFBEB", border: "1px solid #FDE68A" }}>
                      {sentSteps.length > 0 && <div style={{ fontSize: 11, fontWeight: 500, color: "#92400E", lineHeight: 1.5, marginBottom: revSteps.length > 0 ? 8 : 0 }}>{sentSteps.length} {sentSteps.length === 1 ? "action" : "actions"} already sent ({sentSteps.map(s => s.channel).filter((v,i,a) => a.indexOf(v) === i).join(", ")}) and cannot be reversed.{revSteps.length > 0 && ` ${revSteps.length} system ${revSteps.length === 1 ? "change" : "changes"} can still be undone.`}</div>}
                      <Row sx={{ gap: 6 }}>
                        {revSteps.length > 0 && <Btn sx={{ fontSize: 11, padding: "4px 10px", color: "#92400E" }} onClick={e => { e.stopPropagation(); setUndoneAuto(p => new Set([...p, ar.id])); }}>Undo {revSteps.length} reversible {revSteps.length === 1 ? "action" : "actions"}</Btn>}
                        <Btn sx={{ fontSize: 11, padding: "4px 10px" }} onClick={e => e.stopPropagation()}>Stop Automation</Btn>
                      </Row>
                    </div>
                  </div>)}
                </B>);
              })}
            </div>
          </div>);
        })()}

        {/* glance */}
        <div style={{ marginTop: 48 }}>
          <Sec label="Today at a Glance" />
        </div>
        <div className="bento-glance" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
          <B delay={120}><Bp sx={{ paddingBottom: 8 }}>
            <Row sx={{ justifyContent: "space-between", marginBottom: 8 }}><div style={{ fontSize: 12, fontWeight: 700, color: "#374151" }}>Carryover Deals</div><Tag bg="#7C3AED12" c="#7C3AED">{carryover.length}</Tag></Row>
            {carryover.map((d,i) => <ListItem key={d.id} last={i===carryover.length-1}><Row sx={{ gap: 8 }}><div style={{ width: 28, height: 28, borderRadius: 4, flexShrink: 0, background: heatBg(d.heat), display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14 }}>{heatIcon(d.heat)}</div><div style={{ flex: 1, minWidth: 0 }}><Row sx={{ gap: 6 }}><span style={{ fontSize: 13, fontWeight: 600 }}>{d.customer}</span><Tag bg={heatBg(d.heat)} c={heatC(d.heat)} sx={{ fontSize: 9 }}>{heatLabel(d.heat)}</Tag></Row><div style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>{d.vehicle} &middot; Day {d.day} &middot; {d.last}</div></div><Btn sx={{ padding: "3px 8px", fontSize: 10 }}>Call</Btn></Row></ListItem>)}
          </Bp></B>
          <B delay={150}><Bp sx={{ paddingBottom: 8 }}>
            <Row sx={{ justifyContent: "space-between", marginBottom: 8 }}><div style={{ fontSize: 12, fontWeight: 700, color: "#374151" }}>Appointments</div><Tag bg="#05966912" c="#059669">{APPTS.length} today</Tag></Row>
            {APPTS.slice(0,4).map((a,i) => <ListItem key={i} last={i===Math.min(APPTS.length,4)-1}><Row sx={{ gap: 8 }}><span style={{ fontSize: 13, fontWeight: 800, fontFamily: mono, color: "#18181B", minWidth: 36 }}>{a.time}</span><div style={{ flex: 1, minWidth: 0 }}><span style={{ fontSize: 13, fontWeight: 600 }}>{a.customer}</span><div style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>{a.vehicle} &middot; {a.type}</div></div><span style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF" }}>{a.rep}</span></Row></ListItem>)}
            {APPTS.length > 4 && <div style={{ fontSize: 11, fontWeight: 500, color: "#2563EB", marginTop: 8, cursor: "pointer" }}>+{APPTS.length-4} more</div>}
          </Bp></B>
          <B delay={180}><Bp sx={{ paddingBottom: 8 }}>
            <Row sx={{ justifyContent: "space-between", marginBottom: 8 }}><div style={{ fontSize: 12, fontWeight: 700, color: "#374151" }}>Overnight Leads</div>{unresponded > 0 && <Tag bg="#FEF2F2" c="#DC2626">{unresponded} pending</Tag>}</Row>
            {LEADS.map((l,i) => <ListItem key={i} last={i===LEADS.length-1}><Row sx={{ gap: 8 }}><Dot color={l.done ? "#10B981" : "#EF4444"} /><div style={{ flex: 1, minWidth: 0 }}><span style={{ fontSize: 13, fontWeight: 600 }}>{l.name}</span><div style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>{l.vehicle} &middot; {l.src} &middot; {l.time}</div></div>{l.done ? <Tag bg="#F0FDF4" c="#15803D">Done</Tag> : <Btn primary sx={{ padding: "3px 8px", fontSize: 10 }}>Assign</Btn>}</Row></ListItem>)}
          </Bp></B>
          <B delay={210}><Bp sx={{ paddingBottom: 8 }}>
            <Row sx={{ justifyContent: "space-between", marginBottom: 8 }}><div style={{ fontSize: 12, fontWeight: 700, color: "#374151" }}>Team</div><Tag>{TEAM.filter(t => t.on).length} of {TEAM.length} active</Tag></Row>
            {TEAM.map((r,i) => <ListItem key={i} last={i===TEAM.length-1}><Row sx={{ gap: 8, opacity: r.on ? 1 : 0.4 }}><div style={{ width: 26, height: 26, borderRadius: 4, flexShrink: 0, background: `${r.c}12`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 700, color: r.c }}>{r.ini}</div><div style={{ flex: 1, minWidth: 0 }}><Row sx={{ gap: 4 }}><span style={{ fontSize: 12, fontWeight: 600 }}>{r.name}</span>{!r.on && <Tag bg="#FEF3C7" c="#A16207" sx={{ fontSize: 9 }}>Absent</Tag>}</Row><div style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF" }}>{r.deals} deals &middot; {r.calls} calls &middot; {r.tasks} tasks</div></div><Dot color={r.on ? "#10B981" : "#D97706"} size={6} /></Row></ListItem>)}
          </Bp></B>
        </div>

      </main>

      {/* Modify modal */}
      {showModifyModal && (
        <>
          <div onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", zIndex: 49, backdropFilter: "blur(2px)" }} />
          <div style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%, -50%)", width: 520, maxWidth: "92vw", maxHeight: "88vh", background: "#FFF", borderRadius: 12, boxShadow: "0 20px 48px rgba(0,0,0,0.18), 0 6px 16px rgba(0,0,0,0.08)", zIndex: 50, overflow: "hidden", display: "flex", flexDirection: "column" }}>

            {/* header */}
            <div style={{ padding: "16px 20px 14px", borderBottom: "1px solid #F0F0F0", flexShrink: 0 }}>
              <Row sx={{ justifyContent: "space-between", alignItems: "center" }}>
                <Row sx={{ gap: 8 }}>
                  <div style={{ width: 28, height: 28, borderRadius: 6, background: "linear-gradient(135deg, #6366F1, #8B5CF6)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                  </div>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 700, color: "#18181B" }}>Modify with AI</div>
                    <div style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>Describe what to change — AI will update the steps</div>
                  </div>
                </Row>
                <span onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, background: "#F3F4F6", cursor: "pointer", fontSize: 14, color: "#6B7280", fontWeight: 600 }}>{"\u2715"}</span>
              </Row>
            </div>

            {/* AI prompt area */}
            <div style={{ padding: "14px 20px 12px", borderBottom: "1px solid #F5F5F5", flexShrink: 0, background: modifyPromptFocused ? "#FAFBFF" : "#FFF", transition: "background 0.3s" }}>
              <div style={{
                borderRadius: 8, border: modifyPromptFocused ? "1.5px solid #C7D2FE" : "1.5px solid #E5E7EB",
                boxShadow: modifyPromptFocused ? "0 0 0 3px rgba(99,102,241,0.08)" : "none",
                transition: "all 0.25s", background: "#FFF", padding: "10px 12px", display: "flex", alignItems: "flex-start", gap: 10
              }}>
                <textarea
                  value={modifyPrompt}
                  onChange={e => { setModifyPrompt(e.target.value); setModifyApplied(false); }}
                  onFocus={() => setModifyPromptFocused(true)}
                  onBlur={() => setModifyPromptFocused(false)}
                  rows={2}
                  placeholder="e.g. Skip notifying the customer, add a manager approval step first..."
                  style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 13, fontWeight: 500, color: "#18181B", fontFamily: sans, resize: "none", lineHeight: 1.55, padding: 0 }}
                />
                <button
                  onClick={() => { if (!modifyPrompt.trim()) return; setModifyThinking(true); setTimeout(() => { setModifyThinking(false); setModifyApplied(true); }, 1600); }}
                  disabled={!modifyPrompt.trim() || modifyThinking}
                  style={{ flexShrink: 0, padding: "5px 12px", borderRadius: 5, border: "none", background: modifyPrompt.trim() ? "linear-gradient(135deg, #6366F1, #8B5CF6)" : "#F3F4F6", color: modifyPrompt.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: modifyPrompt.trim() ? "pointer" : "default", fontFamily: sans, display: "flex", alignItems: "center", gap: 5, transition: "all 0.2s", marginTop: 1 }}
                >
                  {modifyThinking ? (
                    <><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ animation: "spin 1s linear infinite" }}><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>Thinking</>
                  ) : "Apply"}
                </button>
              </div>
              <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>

              {/* Quick suggestion chips */}
              {!modifyApplied && <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                {["Remove customer notification", "Add manager approval first", "Simplify to 2 steps", "Add a loaner car step"].map((s, i) => (
                  <button key={i} onClick={() => { setModifyPrompt(s); setModifyApplied(false); }}
                    style={{ padding: "4px 10px", borderRadius: 20, border: "1px solid #E5E7EB", background: "#F9FAFB", fontSize: 11, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans, transition: "all 0.15s" }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = "#A5B4FC"; e.currentTarget.style.color = "#4F46E5"; e.currentTarget.style.background = "#EEF2FF"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = "#E5E7EB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.background = "#F9FAFB"; }}
                  >{s}</button>
                ))}
              </div>}

              {/* Applied confirmation */}
              {modifyApplied && (
                <Row sx={{ gap: 6, marginTop: 8 }}>
                  <div style={{ width: 16, height: 16, borderRadius: 3, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
                  <span style={{ fontSize: 12, fontWeight: 600, color: "#15803D" }}>Steps updated based on your instruction</span>
                  <span onClick={() => { setModifyPrompt(""); setModifyApplied(false); }} style={{ fontSize: 11, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", marginLeft: 4, textDecoration: "underline", textUnderlineOffset: 2 }}>Undo</span>
                </Row>
              )}
            </div>

            {/* Steps — scrollable */}
            <div style={{ padding: "14px 20px", overflowY: "auto", flex: 1 }}>
              <Row sx={{ justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.05em" }}>Steps</div>
                <span style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF" }}>{modifySteps.length} steps</span>
              </Row>
              <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                {modifySteps.map((step, i) => (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 7, border: "1px solid #F0F0F0", background: "#FAFAFA" }}>
                    {/* drag handle / reorder */}
                    <div style={{ display: "flex", flexDirection: "column", gap: 2, cursor: "grab", flexShrink: 0, padding: "2px 0" }}>
                      <button onClick={() => { if (i === 0) return; const s = [...modifySteps]; [s[i-1], s[i]] = [s[i], s[i-1]]; setModifySteps(s); }} disabled={i === 0} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 16, height: 14, border: "none", background: "none", cursor: i === 0 ? "default" : "pointer", padding: 0, color: i === 0 ? "#E5E7EB" : "#9CA3AF" }}>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
                      </button>
                      <button onClick={() => { if (i === modifySteps.length - 1) return; const s = [...modifySteps]; [s[i], s[i+1]] = [s[i+1], s[i]]; setModifySteps(s); }} disabled={i === modifySteps.length - 1} style={{ display: "flex", alignItems: "center", justifyContent: "center", width: 16, height: 14, border: "none", background: "none", cursor: i === modifySteps.length - 1 ? "default" : "pointer", padding: 0, color: i === modifySteps.length - 1 ? "#E5E7EB" : "#9CA3AF" }}>
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                      </button>
                    </div>
                    {/* step number */}
                    <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB", fontFamily: mono }}>{i + 1}</div>
                    {/* step text — read only */}
                    <span style={{ flex: 1, fontSize: 13, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{step}</span>
                    {/* delete */}
                    <button
                      onClick={() => setModifySteps(modifySteps.filter((_, j) => j !== i))}
                      style={{ width: 24, height: 24, borderRadius: 5, border: "1px solid #FECACA", background: "#FFF5F5", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }}
                      onMouseEnter={e => e.currentTarget.style.background = "#FEE2E2"}
                      onMouseLeave={e => e.currentTarget.style.background = "#FFF5F5"}
                    >
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#EF4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                  </div>
                ))}
              </div>

              {/* Add step */}
              {addingStep ? (
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, padding: "8px 10px", borderRadius: 7, border: "1.5px solid #C7D2FE", background: "#FAFBFF" }}>
                  <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB", fontFamily: mono }}>{modifySteps.length + 1}</div>
                  <input
                    autoFocus
                    value={newStepText}
                    onChange={e => setNewStepText(e.target.value)}
                    onKeyDown={e => {
                      if (e.key === "Enter" && newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); setAddingStep(false); }
                      if (e.key === "Escape") { setNewStepText(""); setAddingStep(false); }
                    }}
                    placeholder="Describe the step..."
                    style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 13, fontWeight: 500, color: "#18181B", fontFamily: sans }}
                  />
                  <button onClick={() => { if (newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); } setAddingStep(false); }} style={{ padding: "3px 10px", borderRadius: 5, border: "none", background: newStepText.trim() ? "#18181B" : "#F3F4F6", color: newStepText.trim() ? "#FFF" : "#9CA3AF", fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: sans }}>Add</button>
                  <button onClick={() => { setNewStepText(""); setAddingStep(false); }} style={{ width: 22, height: 22, borderRadius: 4, border: "none", background: "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 12, color: "#9CA3AF" }}>{"\u2715"}</button>
                </div>
              ) : (
                <button
                  onClick={() => setAddingStep(true)}
                  style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, padding: "7px 12px", borderRadius: 6, border: "1.5px dashed #D1D5DB", background: "transparent", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", width: "100%", fontFamily: sans }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = "#9CA3AF"; e.currentTarget.style.color = "#374151"; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = "#D1D5DB"; e.currentTarget.style.color = "#6B7280"; }}
                >
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                  Add step
                </button>
              )}
            </div>

            {/* footer */}
            <div style={{ padding: "12px 20px 16px", borderTop: "1px solid #F5F5F5", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
              <Btn onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }}>Cancel</Btn>
              <Btn primary onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} sx={{ padding: "6px 16px" }}>Save</Btn>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
