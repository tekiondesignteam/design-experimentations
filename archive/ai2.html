function Row({ children, sx = {}, className = "" }) { return <div className={className} style={{ display: "flex", alignItems: "center", ...sx }}>{children}</div>; }

        {/* prompt bar */}
        <div style={{ marginBottom: 20 }}>
          <style>{`
            @keyframes glowPulse {
              0%, 100% { box-shadow: 0 0 16px rgba(74,124,247,0.06), 0 0 32px rgba(168,85,247,0.03); }
              50% { box-shadow: 0 0 24px rgba(74,124,247,0.1), 0 0 48px rgba(168,85,247,0.06); }
            }
          `}</style>
          <div style={{
            borderRadius: 8,
            background: "#FFF",
            border: (promptFocused || promptQuery.length > 0) ? "1.5px solid rgba(74,124,247,0.25)" : "1.5px solid #EBEBEB",
            boxShadow: (promptFocused || promptQuery.length > 0) ? "0 0 20px rgba(74,124,247,0.08), 0 0 40px rgba(168,85,247,0.04)" : "0 1px 2px rgba(0,0,0,0.03)",
            animation: (promptFocused || promptQuery.length > 0) ? "glowPulse 3s ease-in-out infinite" : "none",
            transition: "border-color 0.6s ease, box-shadow 0.6s ease",

            <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 16px" }}>
              <textarea ref={promptRef} value={promptQuery} rows={1}
                onChange={e => setPromptQuery(e.target.value)}
                onFocus={() => setPromptFocused(true)}
                onBlur={() => setTimeout(() => setPromptFocused(false), 800)}
                onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) e.preventDefault(); }}
                placeholder="Ask · Execute · Decide"
                style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans, resize: "none", overflow: "hidden", lineHeight: "20px", height: 20, minHeight: 20, maxHeight: 120, padding: 0, margin: 0, display: "block", verticalAlign: "middle" }}
              />
              <button disabled={promptQuery.length === 0} style={{
                width: 28, height: 28, borderRadius: 6, border: "none", flexShrink: 0,
                background: promptQuery.length > 0 ? aiGrad : "#F3F4F6",
                display: "flex", alignItems: "center", justifyContent: "center",
                cursor: promptQuery.length > 0 ? "pointer" : "default",
                transition: "all 0.2s",
              }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={promptQuery.length > 0 ? "#FFF" : "#C0C0C0"} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
              </button>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
            {chips.map((ch, ci) => (
              <button key={ci} onClick={() => { setPromptQuery(ch.q); setPromptFocused(true); promptRef.current?.focus(); }} style={{ display: "flex", alignItems: "center", gap: 5, padding: "5px 11px", borderRadius: 4, background: "#FFF", border: "1px solid #EBEBEB", fontSize: 11, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans, whiteSpace: "nowrap", transition: "all 0.15s" }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = "#C0C0C0"; e.currentTarget.style.color = "#18181B"; e.currentTarget.style.boxShadow = "0 1px 4px rgba(0,0,0,0.06)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#EBEBEB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.boxShadow = "none"; }}
              ><span style={{ fontSize: 12 }}>{ch.icon}</span>{ch.label}</button>
            ))}
          </div>
        </div>

        {/* separator before alerts */}
        <div style={{ margin: "40px 0 36px", height: 1, background: "#E5E7EB" }} />

        {/* alerts */}
        <Sec label="Needs Attention" sub={`${ALERTS.filter(a => !accepted.has(a.id)).length} of ${ALERTS.length} remaining`} />
        {(() => {
          const pending = ALERTS.filter(a => !accepted.has(a.id));
          if (pending.length === 0) return <B delay={60} sx={{ marginBottom: 28, textAlign: "center" }}><Bp sx={{ padding: "28px 24px" }}><div style={{ fontSize: 24, marginBottom: 6 }}>{"\u2713"}</div><div style={{ fontSize: 15, fontWeight: 700, color: "#15803D" }}>All clear</div><div style={{ fontSize: 13, fontWeight: 500, color: "#9CA3AF", marginTop: 4 }}>All {ALERTS.length} actions handled.</div></Bp></B>;
          const si = Math.min(alertIndex, pending.length - 1);
          const cur = pending[si];
          const total = pending.length;
          return (
            <div style={{ position: "relative", marginBottom: 28 }}>
              {total >= 3 && <div style={{ position: "absolute", bottom: -8, left: 16, right: 16, height: 20, background: "#F5F5F5", borderRadius: 8, border: "1px solid #E5E5E5", zIndex: 0 }} />}
              {total >= 2 && <div style={{ position: "absolute", bottom: -4, left: 8, right: 8, height: 20, background: "#FAFAFA", borderRadius: 8, border: "1px solid #EBEBEB", zIndex: 1 }} />}
              <B delay={80} sx={{ position: "relative", zIndex: 2, overflow: "visible" }}>
                <div className="alert-split" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, height: 240 }}>
                  <div style={{ padding: 16, borderRight: "1px solid #F0F0F0", opacity: executing === cur.id ? 0.4 : 1, transition: "opacity 0.4s" }}>
                    <div style={{ fontSize: 15, fontWeight: 700, color: "#18181B", lineHeight: 1.4, marginBottom: 6 }}>{cur.why}</div>
                    <div style={{ fontSize: 13, fontWeight: 500, color: "#6B7280", lineHeight: 1.55 }}>{cur.context}</div>
                  </div>
                  <div style={{ padding: 16, background: executing === cur.id ? (executionDone ? "#F0FDF9" : "#F8FAFC") : "#F8FAFC", transition: "background 0.4s" }}>
                    <div style={{ fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 6, color: executing === cur.id ? (executionDone ? "#15803D" : "#2563EB") : "#2563EB" }}>{executing === cur.id ? (executionDone ? "Actions Completed" : "Running Actions...") : "Recommendation"}</div>
                    <div style={{ fontSize: 14, fontWeight: 700, lineHeight: 1.4, marginBottom: 10, color: executing === cur.id && executionDone ? "#15803D" : "#18181B" }}>{cur.action}</div>

                    {cur.steps.slice(0, 5).map((step, sti) => {
                      const done = completedSteps.includes(sti);
                      const active = executing === cur.id && !done && (sti === 0 || completedSteps.includes(sti - 1));
                      return (<Row key={sti} sx={{ gap: 8, padding: "5px 0", borderBottom: sti < Math.min(cur.steps.length, 5) - 1 ? "1px solid #EDF0F3" : "none" }}>
                        <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, fontFamily: mono, transition: "all 0.4s", ...(done ? { background: "#10B981", color: "#FFF" } : active ? { background: "#3B82F6", color: "#FFF", animation: "pulse 1.5s ease-in-out infinite" } : { background: "#EFF6FF", color: "#2563EB" }) }}>
                          {done ? <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg> : sti + 1}
                        </div>
                        <span style={{ fontSize: 13, fontWeight: done ? 600 : 500, lineHeight: 1.45, color: done ? "#15803D" : "#374151", textDecoration: done ? "line-through" : "none", transition: "all 0.3s" }}>{step}</span>
                        {done && <span style={{ fontSize: 10, fontWeight: 600, color: "#15803D", marginLeft: "auto" }}>Done</span>}
                      </Row>);
                    })}

                    {cur.steps.length > 5 && !executing && (
                      <span onClick={() => setShowAllSteps(s => s === cur.id ? null : cur.id)} style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "6px 0", cursor: "pointer", fontSize: 12, fontWeight: 600, color: "#2563EB" }}>
                        +{cur.steps.length - 5} more
                      </span>
                    )}
                  </div>
                </div>
                <div style={{ padding: "10px 16px 12px", borderTop: "1px solid #F0F0F0", background: "#FAFAFA", borderRadius: "0 0 8px 8px" }}>
                  {executing === cur.id ? (<div>
                    <Row sx={{ justifyContent: "space-between", marginBottom: 6 }}>
                      <span style={{ fontSize: 12, fontWeight: 600, color: executionDone ? "#15803D" : "#2563EB" }}>{executionDone ? "All actions completed" : `Executing step ${Math.min(completedSteps.length+1, cur.steps.length)} of ${cur.steps.length}...`}</span>
                      <span style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF", fontFamily: mono }}>{completedSteps.length}/{cur.steps.length}</span>
                    </Row>
                    <div style={{ height: 3, borderRadius: 2, background: "#E5E7EB", overflow: "hidden" }}><div style={{ height: "100%", borderRadius: 2, width: `${(completedSteps.length/cur.steps.length)*100}%`, background: executionDone ? "#10B981" : "linear-gradient(90deg, #3B82F6, #8B5CF6)", transition: "width 0.5s, background 0.4s" }} /></div>
                    {executionDone && <div style={{ marginTop: 12 }}>
                      {automated.has(cur.sev+cur.why) ? (
                        <div style={{ display: "flex", gap: 10, padding: "12px 14px", borderRadius: 6, background: "#F0FDF4", border: "1px solid #D1FAE5" }}>
                          <div style={{ width: 3, borderRadius: 2, background: "#15803D", flexShrink: 0, opacity: 0.4 }} />
                          <div style={{ flex: 1 }}>
                            <Row sx={{ gap: 6, marginBottom: 4 }}>
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                              <span style={{ fontSize: 13, fontWeight: 700, color: "#15803D" }}>{cur.why.toLowerCase().includes("recall") ? "Recall responses on autopilot" : cur.why.toLowerCase().includes("absent") ? "Staff absences on autopilot" : "PDI delays on autopilot"}</span>
                            </Row>
                            <div style={{ fontSize: 12, fontWeight: 500, color: "#6B7280", lineHeight: 1.5 }}>{cur.why.toLowerCase().includes("recall") ? "Next recall: AI pulls the unit, contacts the customer, and lines up an alternative." : cur.why.toLowerCase().includes("absent") ? "Next absence: AI reassigns deals by pipeline fit and notifies the team." : "Next delay: AI reschedules the customer and arranges a loaner."}</div>
                            <span style={{ fontSize: 11, fontWeight: 600, color: "#059669", cursor: "pointer", display: "inline-block", marginTop: 6 }}>Manage in Tasks {"\u2192"}</span>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px 14px", borderRadius: 6, background: "#FFF", border: "1px dashed #D4D4D4" }}>
                          <div style={{ width: 24, height: 24, borderRadius: 5, flexShrink: 0, background: "#F3F0FF", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg></div>
                          <div style={{ flex: 1 }}>
                            <div style={{ fontSize: 13, fontWeight: 600, color: "#7C3AED" }}>{cur.why.toLowerCase().includes("recall") ? "Let AI handle recalls like this going forward" : cur.why.toLowerCase().includes("absent") ? "Let AI reassign deals when someone calls in absent" : "Let AI reschedule deliveries when PDI runs late"}</div>
                            <div style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF" }}>Same steps you just approved, runs automatically. You just get notified.</div>
                          </div>
                          <Btn onClick={() => setAutomated(p => new Set([...p, cur.sev+cur.why]))} sx={{ flexShrink: 0, background: aiGrad, color: "#FFF", padding: "6px 16px", fontSize: 12, boxShadow: "0 2px 4px rgba(0,0,0,0.08)" }}>Enable</Btn>
                        </div>
                      )}
                      <Btn primary onClick={() => dismissExecution(cur.id)} sx={{ marginTop: 10, width: "100%", justifyContent: "center", padding: "9px 16px", fontSize: 13 }}>{total > 1 ? `Next (${total-1} remaining)` : "Done"}</Btn>
                    </div>}
                  </div>) : (<>
                    <Row sx={{ justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
                      <Row className="alert-act" sx={{ gap: 6 }}>
                        <Btn primary onClick={() => runExecution(cur)}>Go ahead</Btn>
                        <Btn>Modify</Btn>
                        <span onClick={() => { setAccepted(p => new Set([...p, cur.id])); setAlertIndex(0); setShowAllSteps(null); }} style={{ fontSize: 13, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", padding: "5px 4px", textDecoration: "underline", textUnderlineOffset: 2 }}>Skip</span>
                      </Row>
                      {total > 1 && <Row sx={{ gap: 4 }}>
                        <button onClick={() => { setAlertIndex(i => Math.max(i-1,0)); setShowAllSteps(null); }} disabled={si===0} style={{ width: 28, height: 28, borderRadius: 4, border: "1px solid #EBEBEB", background: si===0 ? "transparent" : "#FFF", color: si===0 ? "#D4D4D4" : "#374151", cursor: si===0 ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontFamily: sans }}>{"\u2039"}</button>
                        <span style={{ fontSize: 12, fontWeight: 600, color: "#6B7280", fontFamily: mono, minWidth: 36, textAlign: "center" }}>{si+1}/{total}</span>
                        <button onClick={() => { setAlertIndex(i => Math.min(i+1,total-1)); setShowAllSteps(null); }} disabled={si===total-1} style={{ width: 28, height: 28, borderRadius: 4, border: "1px solid #EBEBEB", background: si===total-1 ? "transparent" : "#FFF", color: si===total-1 ? "#D4D4D4" : "#374151", cursor: si===total-1 ? "default" : "pointer", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontFamily: sans }}>{"\u203A"}</button>
                      </Row>}
                    </Row>
                  </>)}
                </div>
              </B>

              {/* tooltip for 6+ steps - overlay */}
              {showAllSteps === cur.id && !executing && cur.steps.length > 5 && (<>
                <div onClick={() => setShowAllSteps(null)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.1)", zIndex: 29 }} />
                <div style={{
                  position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)",
                  background: "#FFF", border: "1px solid #E5E7EB", borderRadius: 10,
                  boxShadow: "0 12px 32px rgba(0,0,0,0.14), 0 4px 12px rgba(0,0,0,0.06)",
                  padding: 16, width: 320, maxWidth: "90vw", zIndex: 30,
                }}>
                  <Row sx={{ justifyContent: "space-between", marginBottom: 10 }}>
                    <span style={{ fontSize: 11, fontWeight: 700, color: "#2563EB", textTransform: "uppercase", letterSpacing: "0.05em" }}>All {cur.steps.length} steps</span>
                    <span onClick={() => setShowAllSteps(null)} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer" }}>{"\u2715"}</span>
                  </Row>
                  {cur.steps.map((s, si) => (
                    <Row key={si} sx={{ gap: 8, padding: "5px 0", borderBottom: si < cur.steps.length - 1 ? "1px solid #F3F4F6" : "none" }}>
                      <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB", fontFamily: mono }}>{si + 1}</div>
                      <span style={{ fontSize: 13, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{s}</span>
                    </Row>
                  ))}
                </div>
              </>)}
            </div>
          );
        })()}

        {/* AI Handled */}
        {(() => {
          const visible = AUTO_RESOLVED.filter(a => !undoneAuto.has(a.id));
          if (visible.length === 0) return null;
          return (<div style={{ marginBottom: 28 }}>
            <div style={{
              fontSize: 18, fontWeight: 700, letterSpacing: "-0.01em", marginBottom: 4,
              background: "linear-gradient(135deg, var(--primitive-color-ai-primary-start), var(--primitive-color-ai-primary-end), var(--primitive-color-ai-primary-start))",
              backgroundSize: "200% 200%",
              animation: "gradientShift 4s ease infinite",
              WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
              backgroundClip: "text",
            }}>AI handled {visible.length} {visible.length === 1 ? "item" : "items"} for you this morning</div>
            <div style={{ fontSize: 13, fontWeight: 500, color: "#9CA3AF", marginBottom: 12 }}>Automated actions completed before you opened the dashboard</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {visible.map((ar, ai) => {
                const isOpen = expandedAuto === ar.id;
                return (
                <div key={ar.id} style={{
                  background: "#FFF", borderRadius: 8, border: "1px solid #EBEBEB",
                  boxShadow: "0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.02)",
                  opacity: 0, animation: `fadeSlideIn 0.3s ease ${ai * 0.1}s forwards`,
                }}>
                  <div style={{ padding: 16, display: "flex", alignItems: "center", gap: 16 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      {/* title */}
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#18181B" }}>{ar.rule}</div>

                      {/* description with accent bar */}
                      <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
                        <div style={{ width: 3, borderRadius: 2, background: aiGrad, flexShrink: 0, opacity: 0.6 }} />
                        <div style={{ fontSize: 12, fontWeight: 500, color: "#6B7280", lineHeight: 1.55 }}>{ar.summary}</div>
                      </div>

                      {/* meta row */}
                      <Row sx={{ gap: 10, marginTop: 10 }}>
                        <span style={{ fontSize: 11, fontWeight: 600, color: "#9CA3AF", fontFamily: mono }}>{ar.time}</span>
                        <span style={{ fontSize: 11, fontWeight: 500, color: "#D4D4D4" }}>{"\u2022"}</span>
                        <span style={{ fontSize: 11, fontWeight: 600, color: "#9CA3AF" }}>{ar.actions}</span>
                      </Row>
                    </div>

                    <Btn onClick={() => setExpandedAuto(isOpen ? null : ar.id)} sx={{ flexShrink: 0, padding: "5px 12px", fontSize: 12 }}>{isOpen ? "Hide" : "View"}</Btn>
                  </div>

                  {/* expanded steps */}
                  {isOpen && (
                    <div style={{ padding: "0 16px 16px", borderTop: "1px solid #F3F4F6" }}>
                      <div style={{ marginTop: 12 }}>
                        {ar.steps.map((step, si) => (
                          <Row key={si} sx={{ gap: 8, padding: "5px 0", borderBottom: si < ar.steps.length - 1 ? "1px solid #F5F5F5" : "none" }}>
                            <div style={{ width: 18, height: 18, borderRadius: 4, flexShrink: 0, background: `${ar.accentColor}10`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 9, fontWeight: 800, color: ar.accentColor, fontFamily: mono }}>{si + 1}</div>
                            <span style={{ fontSize: 12, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{step}</span>
                          </Row>
                        ))}
                      </div>

                      {/* reversibility + actions */}
                      <div style={{ marginTop: 12, padding: "10px 12px", borderRadius: 6, background: "#FFFBEB", border: "1px solid #FDE68A" }}>
                        <div style={{ fontSize: 11, fontWeight: 500, color: "#92400E", lineHeight: 1.5 }}>
                          {ar.sent} {ar.sent === 1 ? "action" : "actions"} already sent ({ar.sentChannels}) and cannot be reversed.
                          {ar.reversible > 0 && ` ${ar.reversible} system ${ar.reversible === 1 ? "change" : "changes"} can still be undone.`}
                        </div>
                      </div>

                      <Row sx={{ gap: 8, marginTop: 10 }}>
                        {ar.reversible > 0 && (
                          <Btn sx={{ fontSize: 11, padding: "5px 12px", color: "#92400E" }} onClick={() => setUndoneAuto(p => new Set([...p, ar.id]))}>
                            Undo {ar.reversible} reversible {ar.reversible === 1 ? "action" : "actions"}
                          </Btn>
                        )}
                        <Btn sx={{ fontSize: 11, padding: "5px 12px" }}>Stop Automation</Btn>
                      </Row>
                    </div>
                  )}
                </div>
              );})}
            </div>
          </div>);
        })()}

        {/* ── TODAY AT A GLANCE ── */}
        <Sec label="Today at a Glance" sub="Your operational reference for the day" />
        <div className="bento-glance" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 8 }}>

          {/* Huddle Script */}
          <div style={{ gridColumn: "1 / -1" }}>
            <B delay={170}>
              {/* persistent header */}
              <div style={{ padding: 16, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                <Row sx={{ gap: 10 }}>
                  <div style={{ width: 32, height: 32, borderRadius: 6, background: "#F3F0FF", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
                  </div>
                  <div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: "#18181B" }}>Morning Huddle</div>
                    <div style={{ fontSize: 11, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>Wins, coverage, priorities, and coaching in one script you can read to the team</div>
                  </div>
                </Row>
                {showHuddleScript === "idle" && (
                  <Btn onClick={() => { setShowHuddleScript("generating"); setTimeout(() => { setShowHuddleScript("ready"); setHuddleExpanded(true); }, 3000); }} sx={{ background: aiGrad, color: "#FFF", padding: "6px 16px", fontSize: 12, boxShadow: "0 2px 4px rgba(0,0,0,0.08)", flexShrink: 0 }}>Generate</Btn>
                )}
                {showHuddleScript === "generating" && (
                  <span style={{ fontSize: 11, fontWeight: 600, color: "#7C3AED", flexShrink: 0 }}>Generating...</span>
                )}
                {showHuddleScript === "ready" && (
                  <span onClick={() => setHuddleExpanded(e => !e)} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", flexShrink: 0, transition: "color 0.15s" }}
                    onMouseEnter={e => e.currentTarget.style.color = "#374151"}
                    onMouseLeave={e => e.currentTarget.style.color = "#9CA3AF"}
                  >{huddleExpanded ? "Hide" : "Show"}</span>
                )}
              </div>

              {/* generating skeleton */}
              {showHuddleScript === "generating" && (() => {
                const bar = (w, h = 10, mb = 0) => ({
                  width: w, height: h, borderRadius: 4, marginBottom: mb,
                  background: "linear-gradient(90deg, #F3F4F6 0%, #E5E7EB 40%, #F3F4F6 80%)",
                  backgroundSize: "800px 100%",
                  animation: "shimmer 1.8s ease-in-out infinite",
                });
                const sections = [
                  { titleW: "38%", lines: ["92%", "70%"] },
                  { titleW: "48%", lines: ["95%", "60%"] },
                  { titleW: "32%", lines: ["90%", "88%", "45%"] },
                  { titleW: "42%", lines: ["94%", "55%"] },
                  { titleW: "36%", lines: ["88%", "50%"] },
                ];
                return (
                  <div style={{ padding: "0 16px 16px", borderTop: "1px solid #F3F4F6" }}>

                onMouseEnter={e => { e.currentTarget.style.borderColor = "#C0C0C0"; e.currentTarget.style.boxShadow = "0 1px 4px rgba(0,0,0,0.06)"; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = "#E5E7EB"; e.currentTarget.style.boxShadow = "none"; }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6B7280" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
              </button>
            </Row>
            {TEAM.map((r,i) => <ListItem key={i} last={i===TEAM.length-1}><Row sx={{ gap: 10, opacity: r.on ? 1 : 0.45 }}>
              <div style={{ width: 32, height: 32, borderRadius: "50%", flexShrink: 0, background: `${r.c}15`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: r.c }}>{r.ini}</div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <Row sx={{ gap: 6 }}><span style={{ fontSize: 13, fontWeight: 600 }}>{r.name}</span>{!r.on && <Tag bg="#FEF3C7" c="#A16207" sx={{ fontSize: 10 }}>Absent</Tag>}<Dot color={r.on ? "#10B981" : "#D97706"} size={6} /></Row>
                <Row sx={{ gap: 12, marginTop: 4 }}>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#18181B", fontFamily: mono }}>{r.calls}<span style={{ fontWeight: 500, color: "#9CA3AF", fontFamily: sans, fontSize: 10, marginLeft: 3 }}>calls</span></span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#18181B", fontFamily: mono }}>{r.tasks}<span style={{ fontWeight: 500, color: "#9CA3AF", fontFamily: sans, fontSize: 10, marginLeft: 3 }}>tasks</span></span>
                  <span style={{ fontSize: 12, fontWeight: 700, color: "#18181B", fontFamily: mono }}>{r.deals}<span style={{ fontWeight: 500, color: "#9CA3AF", fontFamily: sans, fontSize: 10, marginLeft: 3 }}>deals</span></span>
                </Row>
              </div>
            </Row></ListItem>)}
          </Bp></B>

        </div>

      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
