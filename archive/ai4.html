function Tag({ children, bg="#F3F4F6", c="#374151", sx={} }) {

function Btn({ children, primary, small, onClick, sx={} }) {
  const s = primary
    ? { background:aiGrad, color:"#FFF", border:"none", boxShadow:"0 2px 4px rgba(0,0,0,.08)" }
    : { background:"#FFF", color:"#374151", border:"none", boxShadow:"inset 0 0 0 1px #E5E7EB" };
  const sz = small ? { padding:"4px 10px", fontSize:11 } : { padding:"5px 12px", fontSize:12 };
  return (
    <button onClick={onClick} style={{ display:"inline-flex", alignItems:"center", gap:5, borderRadius:4, fontWeight:700, cursor:"pointer", fontFamily:sans, lineHeight:"18px", whiteSpace:"nowrap", transition:"all .12s", ...s, ...sz, ...sx }}
      onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}
    >{children}</button>
  );
}

function Row({ children, sx={}, className="", ...props }) {

      </div>
      {right}
    </div>
  );
}

function Card({ children, delay=0, sx={}, className="" }) {
  const [v, setV] = useState(false);
  useEffect(()=>{ const t=setTimeout(()=>setV(true),delay); return()=>clearTimeout(t); },[delay]);
  return (
    <div className={`card ${className}`} style={{ background:"#FFF", borderRadius:8, border:"1px solid #EBEBEB", overflow:"hidden", boxShadow:"0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.02)", opacity:v?1:0, transform:v?"translateY(0)":"translateY(6px)", transition:"opacity .3s ease,transform .3s ease", display:"flex", flexDirection:"column", ...sx }}>{children}</div>
  );
}

/* ── MTD STRIP ─────────────────────────────────────────────── */
function MtdStrip() {
  const { unitsTarget, unitsSold, grossTarget, grossSold, daysInMonth, daysElapsed, pace } = MONTHLY_TARGETS;
  const unitsPct = Math.round(unitsSold/unitsTarget*100);
  const grossPct = Math.round(grossSold/grossTarget*100);
  const daysLeft = daysInMonth - daysElapsed;
  const paceColor = pace === "ahead" ? "#15803D" : pace === "behind" ? "#DC2626" : "#D97706";
  const paceLabel = pace === "ahead" ? "Ahead" : pace === "behind" ? "Behind" : "On track";

  const Bar = ({ pct, color }) => (
    <div style={{ height:3, borderRadius:2, background:"#F0F0F0", width:64, flexShrink:0 }}>
      <div style={{ height:"100%", borderRadius:2, width:`${Math.min(pct,100)}%`, background:color, transition:"width .6s ease" }} />
    </div>
  );

  return (
    <div className="mtd-strip" style={{ borderBottom:"1px solid #F0F0F0", background:"#FAFAFA", padding:"0 24px", height:38, display:"flex", alignItems:"center", gap:20 }}>
      <span style={{ fontSize:11, fontWeight:700, color:"#9CA3AF", letterSpacing:".04em", textTransform:"uppercase" }}>Mar</span>
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <span style={{ fontSize:11, fontWeight:600, color:"#374151" }}>Units</span>
        <Bar pct={unitsPct} color="#2563EB" />
        <span style={{ fontSize:11, fontWeight:700, color:"#18181B" }}>{unitsSold}<span style={{ fontWeight:500, color:"#9CA3AF" }}>/{unitsTarget}</span></span>
        <span style={{ fontSize:11, fontWeight:700, color:unitsPct>=50?"#15803D":"#D97706" }}>{unitsPct}%</span>
      </div>
      <div style={{ width:1, height:16, background:"#E5E7EB" }} />
      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
        <span style={{ fontSize:11, fontWeight:600, color:"#374151" }}>Gross</span>
        <Bar pct={grossPct} color="#7C3AED" />
        <span style={{ fontSize:11, fontWeight:700, color:"#18181B" }}>${Math.round(grossSold/1000)}K<span style={{ fontWeight:500, color:"#9CA3AF" }}>/${Math.round(grossTarget/1000)}K</span></span>
        <span style={{ fontSize:11, fontWeight:700, color:grossPct>=50?"#15803D":"#D97706" }}>{grossPct}%</span>
      </div>
      <div style={{ width:1, height:16, background:"#E5E7EB" }} />
      <span style={{ fontSize:11, fontWeight:600, color:paceColor }}>{paceLabel} · {daysLeft}d left</span>
    </div>
  );
}

        <div style={{ width:6, height:6, borderRadius:"50%", background:"#DC2626", flexShrink:0 }} />

/* ── ALERT CARD ────────────────────────────────────────────── */
const URGENCY_META = {
  before_11am: { label:"By 11 AM", bg:"#FEF2F2", c:"#DC2626", dot:"#DC2626" },
  today:       { label:"Today",    bg:"#FFFBEB", c:"#A16207", dot:"#F59E0B" },
  flexible:    { label:"Flexible", bg:"#F0FDF4", c:"#15803D", dot:"#10B981" },
};

function AlertCard({ alert, onExecute, onSkip, executing, completedSteps, executionDone, onDismiss, onAutomate, automated }) {
  const [showDefer, setShowDefer] = useState(false);
  const [suggestionsOpen, setSuggestionsOpen] = useState(false);
  const urg = URGENCY_META[alert.urgency];
  const isRunning = executing === alert.id;
  const stepCount = alert.steps.length;
  const deferOptions = ["In 1 hour", "This afternoon", "Tomorrow morning"];

  return (
    <div style={{ background:"#FFF", borderRadius:10, border:"1px solid #EBEBEB", boxShadow:"0 1px 3px rgba(0,0,0,.04),0 4px 12px rgba(0,0,0,.02)", overflow:"hidden", display:"flex", flexDirection:"column" }}>

      {/* urgency header bar */}
      <div style={{ padding:"7px 12px", background:urg.bg, display:"flex", alignItems:"center", gap:8, borderBottom:"1px solid #F0F0F0", flexShrink:0 }}>
        <div style={{ width:6, height:6, borderRadius:"50%", background:urg.dot, flexShrink:0 }} />
        <span style={{ fontSize:11, fontWeight:700, color:urg.c }}>{urg.label}</span>
        <span style={{ fontSize:11, color:"#D4D4D4" }}>·</span>
        <span style={{ fontSize:11, fontWeight:600, color:urg.c, opacity:.8 }}>{alert.why}</span>
        {alert.grossAtRisk > 0 && (
          <span style={{ marginLeft:"auto", fontSize:11, fontWeight:700, color:"#6B7280" }}>
            ${alert.grossAtRisk.toLocaleString()} gross at risk
          </span>
        )}
      </div>

      {/* body */}
      <div style={{ padding:"14px 14px 12px", flex:1, display:"flex", flexDirection:"column" }}>

        {/* description */}
        <div style={{ fontSize:13, fontWeight:500, color:"#374151", lineHeight:1.65, marginBottom:14, flex:1 }}>
          {alert.context}
        </div>

        {/* inline suggestions (revealed on demand) */}
        {suggestionsOpen && !isRunning && (
          <div style={{ marginBottom:12, padding:"10px 12px", background:"#F8FAFC", borderRadius:7, border:"1px solid #EEF2F7" }}>
            <div style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:".06em", color:"#9CA3AF", marginBottom:8 }}>AI Suggestions</div>
            <div style={{ display:"flex", flexDirection:"column", gap:1 }}>
              {alert.steps.map((step, i) => (
                <Row key={i} sx={{ gap:8, padding:"4px 0", borderBottom:i<alert.steps.length-1?"1px solid #EEF2F7":"none" }}>
                  <div style={{ width:16, height:16, borderRadius:3, flexShrink:0, display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800, background:"#EFF6FF", color:"#2563EB" }}>{i+1}</div>
                  <span style={{ fontSize:12, fontWeight:500, color:"#374151", lineHeight:1.4 }}>{step}</span>
                </Row>
              ))}
            </div>
          </div>
        )}

        {/* execution in-progress */}
        {isRunning && (
          <div style={{ marginBottom:12 }}>
            <Row sx={{ justifyContent:"space-between", marginBottom:6 }}>
              <span style={{ fontSize:12, fontWeight:600, color:executionDone?"#15803D":"#2563EB" }}>
                {executionDone?"All steps done":"Running…"}
              </span>
              <span style={{ fontSize:11, fontWeight:600, color:"#9CA3AF" }}>{completedSteps.length}/{stepCount}</span>
            </Row>
            <div style={{ height:3, borderRadius:2, background:"#E5E7EB", overflow:"hidden" }}>
              <div style={{ height:"100%", borderRadius:2, width:`${(completedSteps.length/stepCount)*100}%`, background:executionDone?"#10B981":"linear-gradient(90deg,#3B82F6,#8B5CF6)", transition:"width .5s,background .4s" }} />
            </div>
            {executionDone && (
              <div style={{ marginTop:10 }}>
                {automated ? (
                  <div style={{ padding:"10px 12px", borderRadius:6, background:"#F0FDF4", border:"1px solid #D1FAE5", marginBottom:8 }}>
                    <span style={{ fontSize:12, fontWeight:600, color:"#15803D" }}>✓ This rule runs automatically going forward.</span>
                  </div>
                ) : (
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"10px 12px", borderRadius:6, background:"#FFF", border:"1px dashed #D4D4D4", marginBottom:8 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:"#7C3AED" }}>Let AI handle this automatically next time</div>
                      <div style={{ fontSize:11, fontWeight:500, color:"#9CA3AF" }}>Same steps you approved, runs without interruption.</div>
                    </div>
                    <Btn onClick={onAutomate} sx={{ background:aiGrad, color:"#FFF", flexShrink:0 }}>Enable</Btn>
                  </div>
                )}
                <Btn primary onClick={onDismiss} sx={{ width:"100%", justifyContent:"center", padding:"8px 16px", fontSize:13 }}>Done — next item</Btn>
              </div>
            )}
          </div>
        )}

        {/* 3 CTAs */}
        {!isRunning && (
          <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
            {/* Primary: Generate suggestions → Execute all */}
            <button
              onClick={()=>{ if(suggestionsOpen){ onExecute(alert); } else { setSuggestionsOpen(true); } }}
              style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"7px 13px", borderRadius:6, border:"none", background:aiGrad, color:"#FFF", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:sans, boxShadow:"0 2px 6px rgba(74,124,247,.22)", flexShrink:0 }}
              onMouseEnter={e=>e.currentTarget.style.opacity=".88"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}
            >
              {suggestionsOpen ? (
                <>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  Execute all
                </>
              ) : (
                <>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 6v6l4 2"/><path d="M18 2v4h4"/></svg>
                  Generate suggestions
                </>
              )}
            </button>

            {/* Secondary: Handle myself */}
            <button
              onClick={()=>onSkip()}
              style={{ display:"inline-flex", alignItems:"center", padding:"7px 13px", borderRadius:6, border:"1px solid #E5E7EB", background:"#FFF", fontSize:12, fontWeight:600, color:"#374151", cursor:"pointer", fontFamily:sans, flexShrink:0 }}
              onMouseEnter={e=>e.currentTarget.style.background="#F9FAFB"} onMouseLeave={e=>e.currentTarget.style.background="#FFF"}
            >
              Handle myself
            </button>

            {/* Ghost: Later dropdown — pushed to right */}
            <div style={{ position:"relative", marginLeft:"auto" }}>
              <button
                onClick={()=>setShowDefer(s=>!s)}
                style={{ display:"inline-flex", alignItems:"center", gap:4, padding:"7px 10px", borderRadius:6, border:"1px solid transparent", background:"transparent", fontSize:12, fontWeight:500, color:"#9CA3AF", cursor:"pointer", fontFamily:sans }}
                onMouseEnter={e=>{ e.currentTarget.style.color="#6B7280"; e.currentTarget.style.borderColor="#E5E7EB"; }}
                onMouseLeave={e=>{ e.currentTarget.style.color="#9CA3AF"; e.currentTarget.style.borderColor="transparent"; }}
              >
                Later
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              {showDefer && (
                <>
                  <div onClick={()=>setShowDefer(false)} style={{ position:"fixed", inset:0, zIndex:30 }} />
                  <div style={{ position:"absolute", top:"calc(100% + 4px)", right:0, background:"#FFF", borderRadius:6, border:"1px solid #E5E7EB", boxShadow:"0 8px 24px rgba(0,0,0,.12)", zIndex:31, minWidth:160, overflow:"hidden" }}>
                    {deferOptions.map((opt,i)=>(
                      <div key={i} onClick={()=>{ setShowDefer(false); onSkip(); }}
                        style={{ padding:"9px 14px", fontSize:12, fontWeight:600, color:"#374151", cursor:"pointer", borderBottom:i<deferOptions.length-1?"1px solid #F5F5F5":"none" }}
                        onMouseEnter={e=>e.currentTarget.style.background="#F9FAFB"} onMouseLeave={e=>e.currentTarget.style.background="#FFF"}
                      >
                        {opt}
                      </div>
                    ))}
                    <div onClick={()=>{ setShowDefer(false); onSkip(); }}
                      style={{ padding:"9px 14px", fontSize:12, fontWeight:600, color:"#9CA3AF", cursor:"pointer" }}
                      onMouseEnter={e=>e.currentTarget.style.background="#F9FAFB"} onMouseLeave={e=>e.currentTarget.style.background="#FFF"}
                    >
                      Skip entirely
                    </div>
                  </div>
                </>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── ACTIVITY LOG ──────────────────────────────────────────── */
function ActivityLog({ items, undoneSet, onUndo, onExpand, expandedId }) {
  const [showAll, setShowAll] = useState(false);
  const [logTab, setLogTab] = useState('today');
  const visible = items.filter(a=>!undoneSet.has(a.id));
  const shown = showAll ? visible : visible.slice(0, 3);
  const hiddenCount = visible.length - shown.length;

  const PAST_BRIEFS = [
    { date:"Mon Mar 9",  count:3, summary:"Stop-sale recall resolved · 2 financing follow-ups sent · 1 lead reassigned" },
    { date:"Fri Mar 7",  count:5, summary:"4 overnight leads assigned · Emily's deals redistributed · 1 recall flagged" },
    { date:"Thu Mar 6",  count:2, summary:"Trade-in appraisal flagged · Delivery delay notification sent" },
    { date:"Wed Mar 5",  count:4, summary:"Leads contacted · Finance queue cleared · 2 appts rescheduled" },
  ];

  const LogTab = ({ id, label }) => {
    const active = logTab === id;
    return (
      <button onClick={()=>setLogTab(id)} style={{
        padding:"4px 10px", borderRadius:5, border:"none", fontFamily:"inherit",
        fontSize:11, fontWeight:active?700:600, cursor:"pointer",
        background:active?"#18181B":"transparent", color:active?"#FFF":"#9CA3AF",
      }}>{label}</button>
    );
  };

  if (!visible.length) return null;
  return (
    <div style={{ marginBottom:28 }}>
      <Row sx={{ justifyContent:"space-between", marginBottom:10 }}>
        <div>
          <p style={{ fontSize:15, fontWeight:500, color:"#9CA3AF", lineHeight:1.65, margin:0 }}>
            <span style={{ color:"#18181B", fontWeight:700 }}>AI already handled 2 items</span>{" before you opened this."}
          </p>
          <p style={{ fontSize:13, fontWeight:400, color:"#B0B8C4", lineHeight:1.6, margin:"4px 0 0" }}>
            <span style={{ color:"#6B7280", fontWeight:500 }}>8 carryover deals</span>{" and "}
            <span style={{ color:"#6B7280", fontWeight:500 }}>12 appointments</span>{" today."}
          </p>
        </div>
        <div style={{ display:"flex", gap:2, background:"#F3F4F6", borderRadius:7, padding:3 }}>
          <LogTab id="today" label="While you were away" />
          <LogTab id="past"  label="Past briefs" />
        </div>
      </Row>
      {logTab === 'past' && (
        <div style={{ background:"#FFF", borderRadius:8, border:"1px solid #EBEBEB", overflow:"hidden" }}>
          {PAST_BRIEFS.map((b, i) => (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 12px", borderBottom:i<PAST_BRIEFS.length-1?"1px solid #F5F5F5":"none" }}>
              <div style={{ flex:"0 0 72px" }}>
                <div style={{ fontSize:11, fontWeight:700, color:"#374151" }}>{b.date}</div>
              </div>
              <div style={{ flex:"0 0 28px", height:20, borderRadius:10, background:"#F0FDF4", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <span style={{ fontSize:10, fontWeight:700, color:"#15803D" }}>{b.count}</span>
              </div>
              <div style={{ flex:1, fontSize:12, fontWeight:500, color:"#6B7280", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{b.summary}</div>
              <button style={{ flexShrink:0, fontSize:11, fontWeight:600, color:"#6B7280", background:"transparent", border:"1px solid #E5E7EB", borderRadius:5, padding:"3px 10px", cursor:"pointer", fontFamily:"inherit" }}>View</button>
            </div>
          ))}
        </div>
      )}

      {logTab === 'today' && <div style={{ background:"#FFF", borderRadius:8, border:"1px solid #EBEBEB", overflow:"hidden" }}>
        {/* table header */}
        <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr auto", gap:0, padding:"8px 12px", borderBottom:"1px solid #F0F0F0", background:"#FAFAFA" }}>
          {["Time","Rule triggered","What happened",""].map((h,i)=>(
            <div key={i} style={{ fontSize:10, fontWeight:700, textTransform:"uppercase", letterSpacing:".05em", color:"#9CA3AF" }}>{h}</div>
          ))}
        </div>
        {shown.map((ar, ai) => {
          const isOpen = expandedId === ar.id;
          return (
            <div key={ar.id} style={{ borderBottom:"1px solid #F5F5F5" }}>
              <div style={{ display:"grid", gridTemplateColumns:"72px 1fr 1fr auto", gap:0, padding:"10px 12px", alignItems:"center" }}>
                <span style={{ fontSize:11, fontWeight:600, color:"#9CA3AF" }}>{ar.time}</span>
                <div>
                  <span style={{ fontSize:12, fontWeight:700, color:"#374151" }}>{ar.rule}</span>
                </div>
                <div style={{ fontSize:12, fontWeight:500, color:"#6B7280" }}>{ar.summary.slice(0,60)}{ar.summary.length>60?"…":""}</div>
                <Btn small onClick={()=>onExpand(isOpen?null:ar.id)} sx={{ flexShrink:0 }}>{isOpen?"Collapse":"Review"}</Btn>
              </div>
              {isOpen && (
                <div style={{ padding:"0 12px 12px 12px", borderTop:"1px solid #F5F5F5" }}>
                  <div style={{ display:"flex", flexDirection:"column", gap:3, marginBottom:10, paddingTop:10 }}>
                    {ar.steps.map((s,si)=>(
                      <Row key={si} sx={{ gap:8, padding:"4px 0" }}>
                        <div style={{ width:18, height:18, borderRadius:4, flexShrink:0, background:"#EFF6FF", display:"flex", alignItems:"center", justifyContent:"center", fontSize:9, fontWeight:800, color:"#2563EB" }}>{si+1}</div>
                        <span style={{ fontSize:12, fontWeight:500, color:"#374151", lineHeight:1.4 }}>{s}</span>
                        <span style={{ marginLeft:"auto", fontSize:10, fontWeight:600, color:"#15803D", background:"#F0FDF4", padding:"1px 6px", borderRadius:3 }}>Done</span>
                      </Row>
                    ))}
                  </div>
                  <div style={{ padding:"8px 10px", borderRadius:6, background:"#FFFBEB", border:"1px solid #FDE68A", marginBottom:8 }}>
                    <span style={{ fontSize:11, fontWeight:500, color:"#92400E" }}>{ar.sent} {ar.sent===1?"action":"actions"} sent ({ar.sentChannel}) — cannot be reversed. {ar.reversible>0?`${ar.reversible} system change${ar.reversible>1?"s":""} can still be undone.`:""}</span>
                  </div>
                  <Row sx={{ gap:8 }}>
                    {ar.reversible>0 && <Btn small onClick={()=>onUndo(ar.id)} sx={{ color:"#92400E" }}>Undo {ar.reversible} reversible {ar.reversible===1?"action":"actions"}</Btn>}
                    <Btn small>Stop this automation</Btn>
                  </Row>
                </div>
              )}
            </div>
          );
        })}
        {/* show more / less */}
        {(hiddenCount > 0 || showAll) && (
          <div
            onClick={()=>setShowAll(s=>!s)}
            style={{ padding:"10px 12px", textAlign:"center", cursor:"pointer", fontSize:12, fontWeight:600, color:"#6B7280", borderTop:"1px solid #F0F0F0", background:"#FAFAFA" }}
            onMouseEnter={e=>e.currentTarget.style.color="#374151"} onMouseLeave={e=>e.currentTarget.style.color="#6B7280"}
          >
            {showAll ? "Show less ↑" : `Show ${hiddenCount} more ↓`}
          </div>
        )}
      </div>}
    </div>
  );
}

/* ── SALES FLOOR WIDGET ────────────────────────────────────── */
function SalesFloorWidget({ expandedWidgets, toggleWidget }) {
  const [expandedRep, setExpandedRep] = useState(null);
  const open = expandedWidgets.has('sales-floor');

  const totalGrossAtRisk = TEAM_FLOOR.filter(r=>r.status==="absent"||r.status==="high")
    .flatMap(r=>r.deals).reduce((s,d)=>s+d.gross,0);

  const statusMeta = {
    normal: { label:"Balanced",       bg:"#F0FDF4", c:"#15803D", barColor:"#10B981" },
    high:   { label:"Overloaded",     bg:"#FEF2F2", c:"#DC2626", barColor:"#EF4444" },
    absent: { label:"Absent",         bg:"#FFF9E6", c:"#A16207", barColor:"#F59E0B" },
    low:    { label:"Spare capacity", bg:"#EFF6FF", c:"#2563EB", barColor:"#60A5FA" },
  };

  return (
    <Card delay={250}>
      <Pad>
        <Row sx={{ justifyContent:"space-between", marginBottom: open ? 14 : 0, cursor:"pointer" }} onClick={()=>toggleWidget('sales-floor')}>
          <div>
            <div style={{ fontSize:13, fontWeight:700, color:"#374151" }}>Sales Floor</div>
            {!open && <div style={{ fontSize:11, fontWeight:500, color:"#9CA3AF", marginTop:2 }}>Jason overloaded · Emily absent · ${totalGrossAtRisk.toLocaleString()} at risk</div>}
          </div>
          <Row sx={{ gap:8 }}>
            {open && totalGrossAtRisk > 0 && (
              <span style={{ fontSize:11, fontWeight:700, color:"#DC2626", background:"#FEF2F2", padding:"2px 8px", borderRadius:4 }}>
                ${totalGrossAtRisk.toLocaleString()} at risk
              </span>
            )}
            <ChevronIcon open={open} />
          </Row>
        </Row>

        {open && (<>
          {TEAM_FLOOR.filter(r=>r.status==="high"||r.status==="absent").map((r, i, arr) => {
            const sm = statusMeta[r.status];
            const isExp = expandedRep === r.ini;
            return (
              <div key={i} style={{ borderBottom:i<arr.length-1?"1px solid #F5F5F5":"none" }}>
                <div onClick={()=>setExpandedRep(isExp?null:r.ini)} style={{ cursor:"pointer", padding:"8px 0", display:"flex", gap:10, alignItems:"center" }}
                  onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}
                >
                  <div style={{ width:28, height:28, borderRadius:"50%", background:`${r.color}15`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:10, fontWeight:700, color:r.color, flexShrink:0 }}>{r.ini}</div>
                  <div style={{ flex:"0 0 64px" }}>
                    <div style={{ fontSize:12, fontWeight:700, color:"#18181B" }}>{r.name.split(" ")[0]}</div>
                    <div style={{ fontSize:10, fontWeight:500, color:"#9CA3AF" }}>{r.active} active</div>
                  </div>
                  <div style={{ flex:1 }}>
                    <Row sx={{ justifyContent:"space-between", marginBottom:3 }}>
                      <span style={{ fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:".04em", color:sm.c }}>{sm.label}</span>
                      {r.status!=="absent" && <span style={{ fontSize:10, fontWeight:600, color:"#9CA3AF" }}>{r.load}%</span>}
                    </Row>
                    <div style={{ height:4, borderRadius:3, background:"#F0F0F0" }}>
                      {r.status!=="absent" && <div style={{ height:"100%", borderRadius:3, width:`${Math.min(r.load,100)}%`, background:sm.barColor }} />}
                    </div>
                  </div>
                  <div style={{ fontSize:11, fontWeight:500, color:sm.c, flex:"0 0 110px", textAlign:"right" }}>{r.note}</div>
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink:0, transform:isExp?"rotate(180deg)":"rotate(0)", transition:"transform .2s" }}><path d="M6 9l6 6 6-6"/></svg>
                </div>
                {isExp && (

/* ── HOME 2 DOT-GRID BACKGROUND ────────────────────────────── */
function DotGrid({ animKey }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const SQ = 3, STEP = 6;
    const COLS = Math.ceil(W / STEP) + 1;
    const ROWS = Math.ceil(H / STEP) + 1;
    const WAVE_SPD = 4;   // ms delay per diagonal step
    const WAVE_DUR = 380; // ms for one dot's wave
    const REST_A   = 0.055;
    const PEAK_A   = 0.22;
    const TOTAL    = (COLS + ROWS) * WAVE_SPD + WAVE_DUR;

    let start = null, raf;

    function draw(ts) {
      if (!start) start = ts;
      const t = ts - start;

      if (t >= TOTAL) {
        // Final resting frame — draw once, stop loop
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = `rgba(0,0,0,${REST_A})`;
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++)
            ctx.fillRect(c*STEP+(STEP-SQ)*.5, r*STEP+(STEP-SQ)*.5, SQ, SQ);
        return;
      }

      ctx.clearRect(0, 0, W, H);
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const lt = t - (c + r) * WAVE_SPD;
          let a, rv, gv, bv;
          if (lt <= 0 || lt >= WAVE_DUR) {
            a = REST_A; rv = 0; gv = 0; bv = 0;
          } else {
            const wave = Math.sin((lt / WAVE_DUR) * Math.PI); // 0→1→0
            a  = REST_A + (PEAK_A - REST_A) * wave;
            rv = Math.round(59  * wave);
            gv = Math.round(130 * wave);
            bv = Math.round(246 * wave);
          }
          ctx.fillStyle = `rgba(${rv},${gv},${bv},${a})`;
          ctx.fillRect(c*STEP+(STEP-SQ)*.5, r*STEP+(STEP-SQ)*.5, SQ, SQ);
        }
      }
      raf = requestAnimationFrame(draw);
    }

    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [animKey]);

  return <canvas ref={canvasRef} style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0 }} />;
}

/* ── HOME 2 WIND STREAK BACKGROUND ─────────────────────────── */
function WindLayer({ animKey }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const W = window.innerWidth, H = window.innerHeight;
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    const DEG = 22, rad = DEG * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    const streaks = Array.from({ length: 14 }, (_, i) => ({
      startX: -220 + (Math.random() - 0.5) * 280,
      startY: -80 + (i / 13) * (H * 1.3),
      len:    100 + Math.random() * 140,
      width:  0.4 + Math.random() * 1.6,
      alpha:  0.038 + Math.random() * 0.07,
      dist:   Math.hypot(W, H) * 0.95 + Math.random() * 180,
      speed:  480 + Math.random() * 280,
      delay:  i * 48 + (Math.random() - 0.5) * 36,
    }));

    const TOTAL = 900;
    let start = null, raf;

    function draw(ts) {
      if (!start) start = ts;
      const elapsed = ts - start;
      if (elapsed > TOTAL) { ctx.clearRect(0, 0, W, H); return; }

      ctx.clearRect(0, 0, W, H);

      streaks.forEach(s => {
        const t = elapsed - s.delay;
        if (t < 0) return;

        const p = Math.min(t / s.speed, 1);
        const eased = 1 - Math.pow(1 - p, 2.4); // ease-out: fast start, natural decel

        const x1 = s.startX + eased * s.dist * cos;
        const y1 = s.startY + eased * s.dist * sin;
        const x2 = x1 + s.len * cos;
        const y2 = y1 + s.len * sin;

        const fade = p < 0.12 ? p / 0.12 : p > 0.68 ? (1 - (p - 0.68) / 0.32) : 1;
        if (fade <= 0) return;

        const g = ctx.createLinearGradient(x1, y1, x2, y2);
        const c = `rgba(195,210,240,${s.alpha * fade})`;
        g.addColorStop(0,    'rgba(195,210,240,0)');
        g.addColorStop(0.18, c);
        g.addColorStop(0.82, c);
        g.addColorStop(1,    'rgba(195,210,240,0)');

        ctx.strokeStyle = g;
        ctx.lineWidth = s.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
      });

      raf = requestAnimationFrame(draw);
    }

    raf = requestAnimationFrame(draw);
    return () => cancelAnimationFrame(raf);
  }, [animKey]);

  return <canvas ref={canvasRef} style={{ position:"fixed", inset:0, pointerEvents:"none", zIndex:0 }} />;
}

    { id:'gross', label:'MTD Gross',     value:`$${(mt.grossSold/1000).toFixed(0)}K`, sub:`of $${(mt.grossTarget/1000).toFixed(0)}K · ${grossPct}% to goal`, icon:ICONS.dollar, color:'#059669', bg:'#ECFDF5' },
    { id:'leads', label:'Not Contacted', value:`${notCont}`,                  sub:`of ${HOT_LEADS.length} hot leads`,                                    icon:ICONS.userX,     color:'#DC2626', bg:'#FEF2F2' },
    { id:'floor', label:'Floor Active',  value:`${activeR}/${TEAM_FLOOR.length}`, sub:absentR?`${absentR.name.split(' ')[0]} absent · ${absentR.active} deals`:'All reps on floor', icon:ICONS.users, color:'#D97706', bg:'#FFFBEB' },
    { id:'aged',  label:'Aged Units',    value:`${INVENTORY_AGED.length}`,    sub:`60+ days on lot`,                                                     icon:ICONS.pkg,       color:'#EA580C', bg:'#FFF7ED' },
  ];

  const Tile = ({ t, isBottom }) => (
    <div style={{ paddingTop: isBottom ? 4 : 0, borderTop: isBottom ? "1px solid #E5E7EB" : "none" }}>
      {/* Tiny category label — darker for readability */}
      <div style={{ fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:".06em", color:"#6B7280", marginBottom:9 }}>
        {t.label}
      </div>
      {/* Icon circle + big value */}
      <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:6 }}>
        <div style={{ width:30, height:30, borderRadius:"50%", background:t.bg, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={t.color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            {t.icon}
          </svg>
        </div>
        <div style={{ fontSize:22, fontWeight:600, color:"#111827", lineHeight:1, letterSpacing:"-.02em" }}>
          {t.value}
        </div>
      </div>
      {/* Context sub-text */}
      <div style={{ fontSize:10, fontWeight:500, color:"#9CA3AF", lineHeight:1.4 }}>
        {t.sub}
      </div>
    </div>
  );

  return (
    <div style={{ width:580, margin:"40px auto 0" }}>
      {/* Section header */}
      <div style={{ fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:".1em", color:"#6B7280", marginBottom:20 }}>
        Your Pins
      </div>
      {/* 4×2 KPI tile grid — flat on bg, no cards, vertical + horizontal dividers */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", columnGap:0, rowGap:28 }}>
        {tiles.map((t, i) => {
          const col = i % 4;
          return (
            <div key={t.id} style={{
              borderRight:  col < 3 ? "1px solid #E5E7EB" : "none",
              paddingRight: col < 3 ? 20 : 0,
              paddingLeft:  col > 0 ? 20 : 0,
            }}>
              <Tile t={t} isBottom={i >= 4} />
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ── HOME 3 ACTION CARD ── */
function H3ActionCard({ item, urgMeta }) {
  const [suggestionsOpen, setSuggestionsOpen] = React.useState(false);
  const [contextOpen,     setContextOpen]     = React.useState(false);
  const [isRunning,       setIsRunning]       = React.useState(false);
  const [completedSteps,  setCompletedSteps]  = React.useState([]);
  const [executionDone,   setExecutionDone]   = React.useState(false);
  const [automated,       setAutomated]       = React.useState(false);
  const [editableSteps,   setEditableSteps]   = React.useState(item.steps || []);
  const [addingStep,      setAddingStep]      = React.useState(false);
  const [newStepText,     setNewStepText]     = React.useState('');
  const [dragIdx,         setDragIdx]         = React.useState(null);
  const [dragOverIdx,     setDragOverIdx]     = React.useState(null);
  const [askT1Open,       setAskT1Open]       = React.useState(false);
  const [askT1Text,       setAskT1Text]       = React.useState('');

  const u = urgMeta[item.urgency];
  const stepCount = editableSteps.length;

  /* Step helpers */
  const deleteStep = idx => setEditableSteps(s => s.filter((_, i) => i !== idx));
  const commitStep = () => {
    if (newStepText.trim()) setEditableSteps(s => [...s, newStepText.trim()]);
    setNewStepText(''); setAddingStep(false);
  };

  /* Drag-and-drop reorder */
  const onDragStart = (e, idx) => { setDragIdx(idx); e.dataTransfer.effectAllowed = 'move'; };
  const onDragOver  = (e, idx) => { e.preventDefault(); if (dragOverIdx !== idx) setDragOverIdx(idx); };
  const onDrop      = (e, idx) => {
    e.preventDefault();
    if (dragIdx === null || dragIdx === idx) { setDragIdx(null); setDragOverIdx(null); return; }
    const s = [...editableSteps]; const [r] = s.splice(dragIdx, 1); s.splice(idx, 0, r);
    setEditableSteps(s); setDragIdx(null); setDragOverIdx(null);
  };
  const onDragEnd = () => { setDragIdx(null); setDragOverIdx(null); };

  /* Execution ticker — uses editableSteps so reordering affects the run */
  React.useEffect(() => {
    if (!isRunning || executionDone) return;
    if (completedSteps.length >= stepCount) { setExecutionDone(true); return; }
    const t = setTimeout(() => setCompletedSteps(p => [...p, p.length]), 850);
    return () => clearTimeout(t);
  }, [isRunning, completedSteps.length, executionDone, stepCount]);

  const handleExecuteAll = () => { setCompletedSteps([]); setExecutionDone(false); setIsRunning(true); };
  const handleReset = () => {
    setSuggestionsOpen(false); setContextOpen(false); setIsRunning(false);
    setCompletedSteps([]); setExecutionDone(false); setAutomated(false);
    setAddingStep(false); setNewStepText('');
  };

  const btnBase = { display:'inline-flex', alignItems:'center', gap:5, padding:'6px 11px',
    borderRadius:6, fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans, whiteSpace:'nowrap', border:'1px solid' };

  return (
    <div style={{ padding:'13px 16px', borderRadius:10, background:'#FFF', border:'1px solid #E5E7EB', display:'flex', flexDirection:'column' }}>

      {/* ── Top row ── */}
      <div style={{ display:'flex', alignItems:'center', gap:12 }}>
        <div style={{ width:8, height:8, borderRadius:'50%', background:u.dot, flexShrink:0 }} />
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:13, fontWeight:600, color:'#18181B', marginBottom:2 }}>{item.title}</div>
          <div style={{ fontSize:11, fontWeight:500, color:'#9CA3AF' }}>{item.detail}</div>
        </div>
        {!isRunning && !executionDone && (
          <div style={{ display:'flex', gap:6, flexShrink:0 }}>
            <button onClick={() => setSuggestionsOpen(p => !p)}
              style={{ ...btnBase, borderColor:'#DBEAFE', background: suggestionsOpen ? '#DBEAFE' : '#EFF6FF', color:'#1D4ED8' }}
              onMouseEnter={e=>e.currentTarget.style.background='#DBEAFE'} onMouseLeave={e=>e.currentTarget.style.background=suggestionsOpen?'#DBEAFE':'#EFF6FF'}>
              <svg width="9" height="9" viewBox="0 0 10 10" fill="#2563EB"><path d="M5 0L10 5L5 10L0 5Z"/></svg>
              AI Suggests
            </button>
            <button onClick={() => setContextOpen(p => !p)}
              style={{ ...btnBase, borderColor:'#E5E7EB', background: contextOpen ? '#F3F4F6' : '#FFF', color:'#374151' }}
              onMouseEnter={e=>e.currentTarget.style.background='#F3F4F6'} onMouseLeave={e=>e.currentTarget.style.background=contextOpen?'#F3F4F6':'#FFF'}>
              Get context
            </button>
          </div>
        )}
      </div>

      {/* ── Side-by-side panels (context left, AI suggestions right) ── */}
      {(contextOpen || suggestionsOpen) && !isRunning && !executionDone && (
        <div style={{ display:'flex', gap:8, marginTop:10, alignItems:'flex-start' }}>

          {/* ── Context panel ── */}
          {contextOpen && (
            <div style={{ flex:1, padding:'10px 12px', background:'#FAFAFA', borderRadius:7, border:'1px solid #F0F0F0', minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'#9CA3AF', marginBottom:8 }}>Context</div>
              <p style={{ fontSize:12, fontWeight:500, color:'#374151', lineHeight:1.6, margin:'0 0 12px 0' }}>
                {item.context || 'No additional context available.'}
              </p>
              {askT1Open ? (
                <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                  <input value={askT1Text} onChange={e=>setAskT1Text(e.target.value)} autoFocus
                    placeholder="Ask T1 anything about this…"
                    onKeyDown={e=>{ if(e.key==='Escape'){ setAskT1Open(false); setAskT1Text(''); } }}
                    style={{ flex:1, fontSize:12, padding:'5px 8px', borderRadius:5, border:'1px solid #DBEAFE', outline:'none', fontFamily:sans, color:'#18181B', background:'#FFF' }} />
                  <button style={{ padding:'5px 10px', borderRadius:5, border:'none', background:'#2563EB', color:'#FFF', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Ask</button>
                  <button onClick={()=>{ setAskT1Open(false); setAskT1Text(''); }}
                    style={{ padding:'5px 8px', borderRadius:5, border:'1px solid #E5E7EB', background:'#FFF', color:'#6B7280', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>✕</button>
                </div>
              ) : (
                <button onClick={() => setAskT1Open(true)}
                  style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'5px 10px', borderRadius:6, border:'1px solid #E5E7EB', background:'#FFF', color:'#374151', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}
                  onMouseEnter={e=>e.currentTarget.style.background='#F3F4F6'} onMouseLeave={e=>e.currentTarget.style.background='#FFF'}>
                  <svg width="10" height="10" viewBox="0 0 10 10" fill="#2563EB"><path d="M5 0L10 5L5 10L0 5Z"/></svg>
                  Ask T1
                </button>
              )}
            </div>
          )}

          {/* ── AI Suggestions panel ── */}
          {suggestionsOpen && (
            <div style={{ flex:1, padding:'10px 12px', background:'#F8FAFC', borderRadius:7, border:'1px solid #EEF2F7', minWidth:0 }}>
              <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'#9CA3AF', marginBottom:8 }}>AI Suggestions</div>

              {/* Editable step list with drag handles */}
              <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
                {editableSteps.map((step, i) => (
                  <div key={i} draggable
                    onDragStart={e => onDragStart(e, i)}
                    onDragOver={e => onDragOver(e, i)}
                    onDrop={e => onDrop(e, i)}
                    onDragEnd={onDragEnd}
                    style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 0',
                      borderBottom: i < editableSteps.length-1 ? '1px solid #EEF2F7' : 'none',
                      opacity: dragIdx === i ? 0.4 : 1,
                      background: dragOverIdx === i ? '#EFF6FF' : 'transparent',
                      borderRadius: dragOverIdx === i ? 4 : 0,
                      transition:'background .1s' }}>
                    <svg width="8" height="12" viewBox="0 0 8 12" fill="#C4C9D4" style={{ flexShrink:0, cursor:'grab' }}>
                      <circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/>
                      <circle cx="2" cy="6" r="1.2"/><circle cx="6" cy="6" r="1.2"/>
                      <circle cx="2" cy="10" r="1.2"/><circle cx="6" cy="10" r="1.2"/>
                    </svg>
                    <div style={{ width:16, height:16, borderRadius:3, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:800, background:'#EFF6FF', color:'#2563EB' }}>{i+1}</div>
                    <span style={{ flex:1, fontSize:12, fontWeight:500, color:'#374151', lineHeight:1.4 }}>{step}</span>
                    <button onClick={() => deleteStep(i)}
                      style={{ width:18, height:18, border:'none', background:'transparent', padding:0, flexShrink:0, cursor:'pointer', color:'#D1D5DB', fontSize:12, display:'flex', alignItems:'center', justifyContent:'center' }}
                      onMouseEnter={e=>e.currentTarget.style.color='#EF4444'} onMouseLeave={e=>e.currentTarget.style.color='#D1D5DB'}>✕</button>
                  </div>
                ))}
              </div>

              {/* Add step */}
              {addingStep ? (
                <div style={{ display:'flex', gap:6, marginTop:8, alignItems:'center' }}>
                  <input value={newStepText} onChange={e=>setNewStepText(e.target.value)} autoFocus
                    onKeyDown={e=>{ if(e.key==='Enter') commitStep(); if(e.key==='Escape'){ setAddingStep(false); setNewStepText(''); } }}
                    placeholder="Describe the new step…"
                    style={{ flex:1, fontSize:12, padding:'5px 8px', borderRadius:5, border:'1px solid #DBEAFE', outline:'none', fontFamily:sans, color:'#18181B', background:'#FFF' }} />
                  <button onClick={commitStep} style={{ padding:'5px 10px', borderRadius:5, border:'none', background:'#2563EB', color:'#FFF', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Add</button>
                  <button onClick={()=>{setAddingStep(false);setNewStepText('');}}
                    style={{ padding:'5px 8px', borderRadius:5, border:'1px solid #E5E7EB', background:'#FFF', color:'#6B7280', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Cancel</button>

      {/* ── Execution progress ── */}
      {(isRunning || executionDone) && (

          </div>
          {executionDone && (
            <div style={{ marginTop:10 }}>
              {automated ? (
                <div style={{ padding:'10px 12px', borderRadius:6, background:'#F0FDF4', border:'1px solid #D1FAE5', marginBottom:8 }}>
                  <span style={{ fontSize:12, fontWeight:600, color:'#15803D' }}>✓ This rule runs automatically going forward.</span>
                </div>
              ) : (
                <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:6, background:'#FFF', border:'1px dashed #D4D4D4', marginBottom:8 }}>
                  <div style={{ flex:1 }}>

                    <div style={{ fontSize:11, fontWeight:500, color:'#9CA3AF' }}>Same steps you approved, runs without interruption.</div>
                  </div>
                  <button onClick={()=>setAutomated(true)} style={{ display:'inline-flex', alignItems:'center', padding:'7px 13px', borderRadius:6, border:'none', background:aiGrad, color:'#FFF', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:sans, flexShrink:0 }}>Enable</button>

                Done — next item
              </button>
            </div>
          )}
        </div>
      )}

    </div>
  );
}

/* ── HOME 4 ACTION CARD ── */
function H4ActionCard({ item, urgMeta, delay }) {
  const [suggestionsOpen, setSuggestionsOpen] = React.useState(false);
  const [contextOpen,     setContextOpen]     = React.useState(false);
  const [isRunning,       setIsRunning]       = React.useState(false);
  const [completedSteps,  setCompletedSteps]  = React.useState([]);
  const [executionDone,   setExecutionDone]   = React.useState(false);
  const [automated,       setAutomated]       = React.useState(false);
  const [editableSteps,   setEditableSteps]   = React.useState(item.steps || []);
  const [addingStep,      setAddingStep]      = React.useState(false);
  const [newStepText,     setNewStepText]     = React.useState('');
  const [dragIdx,         setDragIdx]         = React.useState(null);
  const [dragOverIdx,     setDragOverIdx]     = React.useState(null);
  const [askT1Open,       setAskT1Open]       = React.useState(false);
  const [askT1Text,       setAskT1Text]       = React.useState('');

  const u = urgMeta[item.urgency];
  const stepCount = editableSteps.length;

  const deleteStep = idx => setEditableSteps(s => s.filter((_,i) => i !== idx));
  const commitStep = () => { if (newStepText.trim()) setEditableSteps(s=>[...s,newStepText.trim()]); setNewStepText(''); setAddingStep(false); };
  const onDragStart = (e,idx) => { setDragIdx(idx); e.dataTransfer.effectAllowed='move'; };
  const onDragOver  = (e,idx) => { e.preventDefault(); if(dragOverIdx!==idx) setDragOverIdx(idx); };
  const onDrop      = (e,idx) => { e.preventDefault(); if(dragIdx===null||dragIdx===idx){setDragIdx(null);setDragOverIdx(null);return;} const s=[...editableSteps];const[r]=s.splice(dragIdx,1);s.splice(idx,0,r);setEditableSteps(s);setDragIdx(null);setDragOverIdx(null); };
  const onDragEnd   = () => { setDragIdx(null); setDragOverIdx(null); };

  React.useEffect(() => {
    if (!isRunning || executionDone) return;
    if (completedSteps.length >= stepCount) { setExecutionDone(true); return; }
    const t = setTimeout(() => setCompletedSteps(p=>[...p,p.length]), 850);
    return () => clearTimeout(t);
  }, [isRunning, completedSteps.length, executionDone, stepCount]);

  const handleExecuteAll = () => { setCompletedSteps([]); setExecutionDone(false); setIsRunning(true); };
  const handleReset = () => { setSuggestionsOpen(false); setContextOpen(false); setIsRunning(false); setCompletedSteps([]); setExecutionDone(false); setAutomated(false); setAddingStep(false); setNewStepText(''); };

  const CAT_META = { deals:{c:'#2563EB',l:'Deals'}, customer:{c:'#7C3AED',l:'Customer'}, leads:{c:'#DC2626',l:'Leads'}, inventory:{c:'#059669',l:'Inventory'}, communication:{c:'#B45309',l:'Comms'} };
  const cm = CAT_META[item.cat] || { c:'#6B7280', l:item.cat };
  const btnBase = { display:'inline-flex', alignItems:'center', gap:5, padding:'6px 11px', borderRadius:6, fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans, whiteSpace:'nowrap', border:'1px solid' };

  return (
    <div style={{ borderRadius:12, background:'#FFF', boxShadow:'0 2px 16px rgba(0,0,0,0.07)', borderLeft:`3px solid ${u.dot}`, overflow:'hidden', animation:`h4FadeUp .4s ease ${delay||0}s both` }}>
      <div style={{ padding:'16px 20px' }}>

        {/* Top row */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:10 }}>
          <div style={{ flex:1, minWidth:0 }}>
            <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:5 }}>
              <span style={{ padding:'2px 7px', borderRadius:4, background:`${cm.c}14`, color:cm.c, fontSize:9, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em' }}>{cm.l}</span>
              <span style={{ fontSize:10, fontWeight:600, color:u.dot }}>{u.label}</span>
            </div>
            <div style={{ fontSize:14, fontWeight:600, color:'#18181B', marginBottom:3, lineHeight:1.3 }}>{item.title}</div>
            <div style={{ fontSize:11, fontWeight:500, color:'#9CA3AF' }}>{item.detail}</div>
          </div>
          {!isRunning && !executionDone && (
            <div style={{ display:'flex', gap:6, flexShrink:0, marginTop:2 }}>
              <button onClick={()=>setSuggestionsOpen(p=>!p)} style={{ ...btnBase, borderColor:'#DBEAFE', background:suggestionsOpen?'#DBEAFE':'#EFF6FF', color:'#1D4ED8' }} onMouseEnter={e=>e.currentTarget.style.background='#DBEAFE'} onMouseLeave={e=>e.currentTarget.style.background=suggestionsOpen?'#DBEAFE':'#EFF6FF'}>
                <svg width="9" height="9" viewBox="0 0 10 10" fill="#2563EB"><path d="M5 0L10 5L5 10L0 5Z"/></svg>AI Suggests
              </button>
              <button onClick={()=>setContextOpen(p=>!p)} style={{ ...btnBase, borderColor:'#E5E7EB', background:contextOpen?'#F3F4F6':'#FFF', color:'#374151' }} onMouseEnter={e=>e.currentTarget.style.background='#F3F4F6'} onMouseLeave={e=>e.currentTarget.style.background=contextOpen?'#F3F4F6':'#FFF'}>
                Get context
              </button>
            </div>
          )}
        </div>

        {/* Side-by-side panels */}
        {(contextOpen || suggestionsOpen) && !isRunning && !executionDone && (
          <div style={{ display:'flex', gap:8, marginTop:12, alignItems:'flex-start' }}>
            {contextOpen && (
              <div style={{ flex:1, padding:'10px 12px', background:'#FAFAFA', borderRadius:7, border:'1px solid #F0F0F0', minWidth:0 }}>
                <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'#9CA3AF', marginBottom:8 }}>Context</div>
                <p style={{ fontSize:12, fontWeight:500, color:'#374151', lineHeight:1.6, margin:'0 0 12px 0' }}>{item.context||'No additional context available.'}</p>
                {askT1Open ? (
                  <div style={{ display:'flex', gap:6, alignItems:'center' }}>
                    <input value={askT1Text} onChange={e=>setAskT1Text(e.target.value)} autoFocus placeholder="Ask T1 anything about this…" onKeyDown={e=>{ if(e.key==='Escape'){setAskT1Open(false);setAskT1Text('');} }} style={{ flex:1, fontSize:12, padding:'5px 8px', borderRadius:5, border:'1px solid #DBEAFE', outline:'none', fontFamily:sans, color:'#18181B', background:'#FFF' }} />
                    <button style={{ padding:'5px 10px', borderRadius:5, border:'none', background:'#2563EB', color:'#FFF', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Ask</button>
                    <button onClick={()=>{setAskT1Open(false);setAskT1Text('');}} style={{ padding:'5px 8px', borderRadius:5, border:'1px solid #E5E7EB', background:'#FFF', color:'#6B7280', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>✕</button>
                  </div>
                ) : (
                  <button onClick={()=>setAskT1Open(true)} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'5px 10px', borderRadius:6, border:'1px solid #E5E7EB', background:'#FFF', color:'#374151', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }} onMouseEnter={e=>e.currentTarget.style.background='#F3F4F6'} onMouseLeave={e=>e.currentTarget.style.background='#FFF'}>
                    <svg width="10" height="10" viewBox="0 0 10 10" fill="#2563EB"><path d="M5 0L10 5L5 10L0 5Z"/></svg>Ask T1
                  </button>
                )}
              </div>
            )}
            {suggestionsOpen && (
              <div style={{ flex:1, padding:'10px 12px', background:'#F8FAFC', borderRadius:7, border:'1px solid #EEF2F7', minWidth:0 }}>
                <div style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'#9CA3AF', marginBottom:8 }}>AI Suggestions</div>
                <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
                  {editableSteps.map((step,i) => (
                    <div key={i} draggable onDragStart={e=>onDragStart(e,i)} onDragOver={e=>onDragOver(e,i)} onDrop={e=>onDrop(e,i)} onDragEnd={onDragEnd}
                      style={{ display:'flex', alignItems:'center', gap:6, padding:'5px 0', borderBottom:i<editableSteps.length-1?'1px solid #EEF2F7':'none', opacity:dragIdx===i?0.4:1, background:dragOverIdx===i?'#EFF6FF':'transparent', borderRadius:dragOverIdx===i?4:0, transition:'background .1s' }}>
                      <svg width="8" height="12" viewBox="0 0 8 12" fill="#C4C9D4" style={{ flexShrink:0, cursor:'grab' }}><circle cx="2" cy="2" r="1.2"/><circle cx="6" cy="2" r="1.2"/><circle cx="2" cy="6" r="1.2"/><circle cx="6" cy="6" r="1.2"/><circle cx="2" cy="10" r="1.2"/><circle cx="6" cy="10" r="1.2"/></svg>
                      <div style={{ width:16, height:16, borderRadius:3, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:800, background:'#EFF6FF', color:'#2563EB' }}>{i+1}</div>
                      <span style={{ flex:1, fontSize:12, fontWeight:500, color:'#374151', lineHeight:1.4 }}>{step}</span>
                      <button onClick={()=>deleteStep(i)} style={{ width:18, height:18, border:'none', background:'transparent', padding:0, flexShrink:0, cursor:'pointer', color:'#D1D5DB', fontSize:12, display:'flex', alignItems:'center', justifyContent:'center' }} onMouseEnter={e=>e.currentTarget.style.color='#EF4444'} onMouseLeave={e=>e.currentTarget.style.color='#D1D5DB'}>✕</button>
                    </div>
                  ))}
                </div>
                {addingStep ? (
                  <div style={{ display:'flex', gap:6, marginTop:8, alignItems:'center' }}>
                    <input value={newStepText} onChange={e=>setNewStepText(e.target.value)} autoFocus onKeyDown={e=>{if(e.key==='Enter')commitStep();if(e.key==='Escape'){setAddingStep(false);setNewStepText('');}}} placeholder="Describe the new step…" style={{ flex:1, fontSize:12, padding:'5px 8px', borderRadius:5, border:'1px solid #DBEAFE', outline:'none', fontFamily:sans, color:'#18181B', background:'#FFF' }} />
                    <button onClick={commitStep} style={{ padding:'5px 10px', borderRadius:5, border:'none', background:'#2563EB', color:'#FFF', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Add</button>
                    <button onClick={()=>{setAddingStep(false);setNewStepText('');}} style={{ padding:'5px 8px', borderRadius:5, border:'1px solid #E5E7EB', background:'#FFF', color:'#6B7280', fontSize:11, fontWeight:600, cursor:'pointer', fontFamily:sans }}>Cancel</button>
                  </div>
                ) : (
                  <button onClick={()=>setAddingStep(true)} style={{ marginTop:8, display:'inline-flex', alignItems:'center', gap:4, fontSize:11, fontWeight:600, color:'#9CA3AF', background:'transparent', border:'none', cursor:'pointer', fontFamily:sans, padding:'2px 0' }} onMouseEnter={e=>e.currentTarget.style.color='#2563EB'} onMouseLeave={e=>e.currentTarget.style.color='#9CA3AF'}>+ Add step</button>
                )}
                <div style={{ display:'flex', gap:8, marginTop:12, paddingTop:10, borderTop:'1px solid #EEF2F7' }}>
                  <button onClick={handleExecuteAll} style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:6, padding:'8px 0', borderRadius:6, border:'none', background:'#18181B', color:'#FFF', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:sans }}>
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFF"><polygon points="5 3 19 12 5 21 5 3"/></svg>Execute all
                  </button>
                  <button onClick={handleReset} style={{ padding:'8px 14px', borderRadius:6, border:'1px solid #E5E7EB', background:'#FFF', color:'#374151', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:sans }} onMouseEnter={e=>e.currentTarget.style.background='#F9FAFB'} onMouseLeave={e=>e.currentTarget.style.background='#FFF'}>Do manually</button>

              <span style={{ fontSize:11, fontWeight:600, color:'#9CA3AF' }}>{completedSteps.length}/{stepCount}</span>
            </div>
            <div style={{ height:3, borderRadius:2, background:'#E5E7EB', overflow:'hidden' }}>
              <div style={{ height:'100%', borderRadius:2, width:`${(completedSteps.length/stepCount)*100}%`, background:executionDone?'#10B981':'linear-gradient(90deg,#3B82F6,#8B5CF6)', transition:'width .5s,background .4s' }} />
            </div>
            {executionDone && (
              <div style={{ marginTop:10 }}>
                {automated ? (
                  <div style={{ padding:'10px 12px', borderRadius:6, background:'#F0FDF4', border:'1px solid #D1FAE5', marginBottom:8 }}>
                    <span style={{ fontSize:12, fontWeight:600, color:'#15803D' }}>✓ This rule runs automatically going forward.</span>
                  </div>
                ) : (
                  <div style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', borderRadius:6, background:'#FFF', border:'1px dashed #D4D4D4', marginBottom:8 }}>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:12, fontWeight:600, color:'#7C3AED' }}>Let AI handle this automatically next time</div>
                      <div style={{ fontSize:11, fontWeight:500, color:'#9CA3AF' }}>Same steps you approved, runs without interruption.</div>
                    </div>
                    <button onClick={()=>setAutomated(true)} style={{ display:'inline-flex', alignItems:'center', padding:'7px 13px', borderRadius:6, border:'none', background:aiGrad, color:'#FFF', fontSize:12, fontWeight:700, cursor:'pointer', fontFamily:sans, flexShrink:0 }}>Enable</button>
                  </div>
                )}
                <button onClick={handleReset} style={{ width:'100%', display:'flex', justifyContent:'center', padding:'8px 16px', borderRadius:6, border:'none', background:'#18181B', color:'#FFF', fontSize:13, fontWeight:700, cursor:'pointer', fontFamily:sans }}>Done — next item</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

                              <span style={{ fontSize:11, fontWeight:700, color:'#9CA3AF', background:'#F3F4F6', padding:'1px 7px', borderRadius:10 }}>
                                {sec.items.length}
                              </span>
                            </div>

                            {/* Cards */}
                            <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                              {shown.map(item => (
                                <H3ActionCard key={item.id} item={item} urgMeta={urgMeta} />
                              ))}
                            </div>

                            {/* View all / Show less */}
                            {hasMore && (
                              <button onClick={()=>toggleH3Section(sec.id)}
                                style={{ marginTop:12, fontSize:12, fontWeight:600, color:'#6B7280', background:'none', border:'none', cursor:'pointer', fontFamily:sans, padding:0, display:'inline-flex', alignItems:'center', gap:4 }}
                                onMouseEnter={e=>e.currentTarget.style.color='#374151'}
                                onMouseLeave={e=>e.currentTarget.style.color='#6B7280'}>
                                {isExpanded ? (
                                  <>Show less <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 15l-6-6-6 6"/></svg></>
                                ) : (
                                  <>View all ({sec.items.length}) <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9l6 6 6-6"/></svg></>
                                )}
                              </button>
                            )}

                          </div>
                        );
                      })}
                    </div>
                  </>
                );
              })()}

              {/* ── BRIEF TAB ── */}
              {h3Tab === 'brief' && (
                <div style={{ display:'flex', flexDirection:'column', gap:16, paddingBottom:48 }}>
                  <div style={{ padding:'16px 18px', borderRadius:10, background:'#FFF', border:'1px solid #E5E7EB' }}>
                    <div style={{ fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em', color:'#6B7280', marginBottom:10 }}>Department snapshot</div>
                    <p style={{ fontSize:13, fontWeight:500, color:'#374151', lineHeight:1.65, margin:0 }}>
                      On pace at 58% MTD — 38 units, $172K gross through Day 9.
                      Emily absent, 4 deals need coverage. 12 appointments today, next at 9:30 AM.
                      Finance queue has 2 pending stips. 2 hot leads still uncontacted.
                    </p>
                  </div>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }}>
                    {[
                      { label:'Units MTD',    value:'38/65', sub:'58% to target'  },
                      { label:'Gross MTD',    value:'$172K', sub:'of $280K goal'  },
                      { label:'Appts today',  value:'12',    sub:'next at 9:30 AM'},
                      { label:'Active deals', value:'8',     sub:'2 need help'    },
                      { label:'Finance queue',value:'4',     sub:'2 pending stips'},
                      { label:'Floor active', value:'3 / 4', sub:'Emily absent'   },
                    ].map(k => (
                      <div key={k.label} style={{ padding:'12px 14px', borderRadius:9, background:'#FFF', border:'1px solid #E5E7EB' }}>
                        <div style={{ fontSize:9, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:'#9CA3AF', marginBottom:6 }}>{k.label}</div>
                        <div style={{ fontSize:20, fontWeight:700, color:'#18181B', letterSpacing:'-.02em', marginBottom:2 }}>{k.value}</div>
                        <div style={{ fontSize:10, fontWeight:500, color:'#9CA3AF' }}>{k.sub}</div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </div>
            </>
          );
        })()}

        {/* ── HOME 4 ─────────────────────────────────────────── */}
        {homeTab === 4 && (()=>{

          const urgMeta = {
            before_11am: { dot:'#DC2626', label:'Before 11 AM' },
            today:       { dot:'#F59E0B', label:'Today'        },
            flexible:    { dot:'#10B981', label:'Flexible'     },
          };

          /* ── All actionable items — sorted critical first ── */
          const ACTIONS = [
            { id:'a1', urgency:'before_11am', cat:'deals',
              title:'Emily Carter — credit approval stalled',
              detail:'Deal #847 · Rate lock expires at market close today',
              steps:['Pull Deal #847 credit report status from lender portal','Call First National loan officer for updated approval timeline','Message Emily Carter in CRM with expected approval date'],
              context:'Stalled since Tuesday when the co-applicant\'s credit file flagged an unresolved 2022 inquiry requiring manual lender review. The rate lock expires today at market close — if not cleared, the deal restarts from qualification and the customer loses their locked rate.' },
            { id:'a2', urgency:'before_11am', cat:'deals',
              title:'F&I paperwork: Rodriguez co-signer missing',
              detail:'Deal #839 · Package falls back to queue at noon',
              steps:['Locate DocuSign package for Deal #839 in F&I queue','Resend co-signer signature request via DocuSign email','Flag deal as awaiting signature in CRM and notify F&I manager'],
              context:'The co-signer was unreachable last week due to travel and the DocuSign request expired without action. The lender package must carry all required signatures before noon today or it automatically falls back into the approval queue, adding 2–3 business days.' },
            { id:'a3', urgency:'before_11am', cat:'deals',
              title:'Stip missing — Kim Nguyen finance deal',
              detail:'Lender submission window closes today · Conditional approval pending',
              steps:['Open Kim Nguyen\'s deal file and confirm the missing stip','Send Kim a DocuSign request for proof of income document','Alert F&I manager that submission is pending the document'],
              context:'Conditional approval came through three days ago with proof of income flagged as the outstanding stip. The rep believed the document was already on file, but it never arrived. The lender\'s same-day submission window closes today — missing it means resubmitting the entire application.' },
            { id:'a4', urgency:'before_11am', cat:'inventory',
              title:'Stop-sale recall — 2 Highlanders on lot',
              detail:'Recall #24V-891 · Cannot be sold or test-driven',
              steps:['Flag all 2024 Highlander units in DMS inventory as stop-sale','Pause Jennifer Patel\'s active deal and add recall hold note','Notify service department of recall #24V-891 requirements'],
              context:'Recall #24V-891 affects a specific VIN range on all 2024 Highlanders — two units on the lot fall within that batch. Continuing a sale creates significant legal and financial liability. One of these units is mid-deal with Jennifer Patel.' },
            { id:'a5', urgency:'today', cat:'leads',
              title:'Marcus Chen — hot lead, 26 hours no contact',
              detail:'Trade-in submitted yesterday · Conversion drops sharply after 24 h',
              steps:['Pull Marcus Chen\'s vehicle info and run KBB trade-in estimate','Compose personalised text with trade-in range and next steps','Log outreach in CRM and set a 4-hour follow-up alert'],
              context:'Marcus submitted a trade-in inquiry yesterday afternoon. The assigned rep was juggling two other deals and the lead went unactioned before end of day. Conversion probability drops 60% after 24 hours without contact — we are now past that threshold.' },
            { id:'a6', urgency:'today', cat:'deals',
              title:'Sarah Park overloaded — 5 active deals, 3 stalled',
              detail:'Coach or reassign before close of business',
              steps:['Review Sarah Park\'s 3 stalled deals and identify lowest-priority','Reassign that deal to the next available rep with capacity','Schedule a 10-minute coaching check-in with Sarah today'],
              context:'Sarah took on two additional deals last week when a rep called in sick. Her workload exceeded 5 active deals three days ago. Lot data shows close rates drop 40% when reps carry more than 5 open deals simultaneously.' },
            { id:'a7', urgency:'today', cat:'customer',
              title:'Brian Foster — trade appraisal, no appraiser assigned',
              detail:'Appointment at 10:30 AM today',
              steps:['Identify available appraiser for 10:30 AM slot','Assign appraiser to Brian Foster\'s appointment in DMS','Send Brian\'s rep a notification that appraiser is confirmed'],
              context:'The appointment was booked yesterday without pre-assigning an appraiser. The scheduling coordinator assumed it would be handled at walk-in. Without a pre-briefed appraiser, the rep goes in blind on trade-in value.' },
          ];

          const STATS = [
            { value:'18',   label:'Active deals' },
            { value:'3',    label:'Hot leads',  accent:'#F59E0B' },
            { value:'38',   label:'Units MTD'   },
            { value:'$172K',label:'Gross MTD',  accent:'#059669' },
          ];

          const TIMELINE = [
            { time:'9:02 AM',   text:'T1 flagged 4 items needing sign-off this morning',           type:'ai'   },
            { time:'8:15 AM',   text:'2 inbound leads arrived from Google Ads overnight',           type:'good' },
            { time:'7:30 AM',   text:'NHTSA issued stop-sale recall #24V-891 on 2024 Highlanders',  type:'warn' },
            { time:'Yesterday', text:'Sarah Park closed Deal #821 — $34,000 gross',                 type:'good' },
            { time:'Yesterday', text:'Marcus Chen submitted trade-in — still uncontacted',          type:'risk' },
            { time:'Yesterday', text:'Rodriguez: day 12 of silence — window closes in 48 h',       type:'risk' },
          ];

          const tlColors = { ai:'#2563EB', good:'#059669', warn:'#DC2626', risk:'#F59E0B' };

          return (<>

            {/* ═══ GREETING ═══ */}
            <div style={{ marginBottom:24, animation:'h4HeroIn .4s ease both' }}>
              <div style={{ display:'flex', alignItems:'center', gap:7, marginBottom:12 }}>
                <span style={{ width:6, height:6, borderRadius:'50%', background:'#10B981', flexShrink:0, animation:'h4LiveDot 2s ease-in-out infinite' }} />
                <span style={{ fontSize:11, fontWeight:600, color:'#B0A898', letterSpacing:'.07em', textTransform:'uppercase' }}>Tuesday, March 11</span>
              </div>
              <h1 style={{ fontSize:28, fontWeight:700, color:'#111827', letterSpacing:'-.025em', margin:0, lineHeight:1.2 }}>
                Good morning, Mike.
              </h1>
            </div>

            {/* ═══ AI BRIEF + PROMPT ═══ */}
            <div style={{ background:'#FFFFFF', borderRadius:14, padding:'20px 22px', marginBottom:28, border:'1px solid #E9E5DF', animation:'h4HeroIn .4s ease .08s both' }}>
              <p style={{ fontSize:14, lineHeight:1.85, color:'#4B5563', margin:'0 0 18px', fontWeight:400 }}>
                Three deals need your sign-off before 11 AM —{' '}
                <span style={{ fontWeight:600, color:'#111827' }}>Emily Carter's rate lock</span> is the most time-sensitive.
                A stop-sale recall landed overnight on two Highlanders.
                Otherwise today looks solid — the pipeline is healthy and the team is on pace.
              </p>
              <div style={{ display:'flex', alignItems:'center', gap:9, background:'#F7F5F1', borderRadius:10, padding:'10px 14px', border:'1px solid #E5E1DB' }}>
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <defs><linearGradient id="h4pgv2" x1="0" y1="0" x2="14" y2="14"><stop stopColor="#4A7CF7"/><stop offset="1" stopColor="#A855F7"/></linearGradient></defs>
                  <path d="M7 1L8.3 5.7L13 7L8.3 8.3L7 13L5.7 8.3L1 7L5.7 5.7Z" fill="url(#h4pgv2)"/>
                </svg>
                <input value={h4Prompt} onChange={e => setH4Prompt(e.target.value)}
                  placeholder="Ask T1 anything about today…"
                  style={{ flex:1, border:'none', outline:'none', fontSize:13, color:'#374151', background:'transparent', fontFamily:'Manrope, sans-serif' }} />
                {h4Prompt && (
                  <button style={{ background:'linear-gradient(135deg,#4A7CF7,#A855F7)', color:'#fff', border:'none', borderRadius:7, padding:'4px 12px', fontSize:12, fontWeight:600, cursor:'pointer', fontFamily:'Manrope, sans-serif' }}>Ask</button>
                )}
              </div>
            </div>

            {/* ═══ STATS ═══ */}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', background:'#FFFFFF', borderRadius:12, border:'1px solid #E9E5DF', overflow:'hidden', marginBottom:32, animation:'h4FadeUp .4s ease .14s both' }}>
              {STATS.map((s, i) => (
                <div key={i} style={{ padding:'16px 0', textAlign:'center', borderRight: i < STATS.length-1 ? '1px solid #F0EDE8' : 'none' }}>
                  <div style={{ fontSize:22, fontWeight:700, color: s.accent || '#111827', letterSpacing:'-.02em', lineHeight:1 }}>{s.value}</div>
                  <div style={{ fontSize:10, fontWeight:500, color:'#B0A898', marginTop:4, letterSpacing:'.04em' }}>{s.label}</div>
                </div>
              ))}
            </div>

            {/* ═══ NEEDS YOUR ATTENTION — quiet list ═══ */}
            <div style={{ marginBottom:32, animation:'h4FadeUp .4s ease .2s both' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
                <span style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em', color:'#B0A898' }}>Needs your attention</span>
                <span style={{ fontSize:11, fontWeight:500, color:'#C8C2BA' }}>{ACTIONS.length} items</span>
              </div>
              <div style={{ background:'#FFFFFF', borderRadius:12, border:'1px solid #E9E5DF', overflow:'hidden' }}>
                {ACTIONS.map((item, i) => {
                  const u = urgMeta[item.urgency];
                  const isOpen = h4Active === item.id;
                  return (
                    <div key={item.id} style={{ borderBottom: i < ACTIONS.length-1 ? '1px solid #F5F2EE' : 'none' }}>
                      {/* Row */}
                      <div
                        onClick={() => setH4Active(isOpen ? null : item.id)}
                        onMouseEnter={e => { if (!isOpen) e.currentTarget.style.background = '#FDFCFB'; }}
                        onMouseLeave={e => { if (!isOpen) e.currentTarget.style.background = 'transparent'; }}
                        style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 18px', cursor:'pointer', background: isOpen ? '#FDFCFB' : 'transparent', transition:'background .15s' }}>
                        <span style={{ width:7, height:7, borderRadius:'50%', background:u.dot, flexShrink:0 }} />
                        <div style={{ flex:1, minWidth:0 }}>
                          <div style={{ fontSize:13, fontWeight:600, color:'#111827', lineHeight:1.3 }}>{item.title}</div>
                          <div style={{ fontSize:11, fontWeight:500, color:'#B0A898', marginTop:2 }}>{item.detail}</div>
                        </div>
                        <span style={{ fontSize:10, fontWeight:600, color:u.dot, opacity:.75, flexShrink:0, whiteSpace:'nowrap' }}>{u.label}</span>
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{ flexShrink:0, transform: isOpen ? 'rotate(90deg)' : 'none', transition:'transform .2s' }}>
                          <path d="M5 4L9 7L5 10" stroke="#C8C2BA" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                        </svg>
                      </div>
                      {/* Expanded */}
                      {isOpen && (
                        <div style={{ borderTop:'1px solid #F0EDE8', padding:12, background:'#F9F7F4' }}>
                          <H4ActionCard item={item} urgMeta={urgMeta} delay={0} />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* ═══ SINCE YESTERDAY ═══ */}
            <div style={{ marginBottom:24, animation:'h4FadeUp .4s ease .28s both' }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:12 }}>
                <span style={{ fontSize:10, fontWeight:700, textTransform:'uppercase', letterSpacing:'.1em', color:'#B0A898' }}>Since yesterday</span>
                <span style={{ fontSize:10, fontWeight:500, color:'#C8C2BA' }}>— last 14 hours</span>
              </div>
              <div style={{ background:'#FFFFFF', borderRadius:12, border:'1px solid #E9E5DF', overflow:'hidden' }}>
                {TIMELINE.map((ev, i) => (
                  <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:12, padding:'10px 18px', borderBottom: i < TIMELINE.length-1 ? '1px solid #F7F5F2' : 'none' }}>
                    <span style={{ fontSize:10, fontWeight:600, color:'#C8C2BA', minWidth:58, flexShrink:0, paddingTop:3, textAlign:'right' }}>{ev.time}</span>
                    <span style={{ width:5, height:5, borderRadius:'50%', background:tlColors[ev.type], flexShrink:0, marginTop:4 }} />
                    <span style={{ fontSize:12, fontWeight:500, color:'#6B7280', lineHeight:1.5, flex:1 }}>{ev.text}</span>
                  </div>
                ))}
              </div>
            </div>

          </>);
        })()}
      </main>
    </div>
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
