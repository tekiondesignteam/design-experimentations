<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Dashboard Tab</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Cabinet+Grotesk:wght@400;500;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Cabinet Grotesk', sans-serif; 
      -webkit-font-smoothing: antialiased; 
      background: #F3F2EF; 
    }
    button { transition: transform 0.12s ease, opacity 0.12s ease, background 0.15s, border-color 0.15s, box-shadow 0.15s; cursor: pointer; }
    button:active { transform: scale(0.96); }

    /* Layout for Tab 1 */
    .tab1-grid {
      display: grid;
      grid-template-columns: 180px 648px 180px;
      grid-template-rows: repeat(3, 150px);
      gap: 16px;
      width: 1040px;
      margin: 0 auto;
    }
    .grid-pos-0 { grid-column: 1; grid-row: 1; }
    .grid-pos-1 { grid-column: 1; grid-row: 2; }
    .grid-pos-2 { grid-column: 1; grid-row: 3; }
    .grid-pos-3 { grid-column: 2; grid-row: 1 / 4; }
    .grid-pos-4 { grid-column: 3; grid-row: 1; }
    .grid-pos-5 { grid-column: 3; grid-row: 2; }
    .grid-pos-6 { grid-column: 3; grid-row: 3; }

    .t1-card {
      background: #FFF;
      border-radius: 12px;
      border: 1px solid #E5E7EB;
      box-shadow: 0 1px 3px rgba(0,0,0,.04);
      padding: 16px;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s, border-color 0.2s;
    }
    .t1-card.is-center { 
      cursor: default; 
      padding: 28px 32px;
      box-shadow: 0 4px 12px rgba(0,0,0,.03);
    }
    .t1-card.is-side:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,.06);
      border-color: #D1D5DB;
    }
    
    ::view-transition-group(*) { animation-duration: 0.4s; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #D1D5DB; border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const aiGrad = "linear-gradient(135deg, #4A7CF7, #A855F7)";

    const AILogo = () => (
      <svg width="48" height="48" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
         <path d="M3.90234 12.1417C4.35913 11.3507 5.37099 11.0796 6.1621 11.5362C6.95276 11.993 7.22378 13.004 6.76757 13.795C6.31077 14.5862 5.299 14.8573 4.50781 14.4005C3.71688 13.9436 3.44577 12.9327 3.90234 12.1417Z" fill="url(#h6g0)" />
         <path d="M9.85253 11.5362C10.6436 11.0795 11.6554 11.3507 12.1123 12.1417C12.5687 12.9327 12.2976 13.9436 11.5068 14.4005C10.7156 14.8573 9.70386 14.5862 9.24706 13.795C8.79076 13.0039 9.06163 11.9929 9.85253 11.5362Z" fill="url(#h6g1)" />
         <path d="M1.82714 6.87897C2.61816 6.42229 3.62997 6.69366 4.08691 7.48444C4.5437 8.27563 4.27262 9.2874 3.48144 9.74421C2.69025 10.201 1.67846 9.92992 1.22167 9.13874C0.765282 8.34764 1.03617 7.3357 1.82714 6.87897Z" fill="url(#h6g2)" />
         <path d="M9.84667 2.22175C10.6377 1.76509 11.6495 2.03645 12.1064 2.82721C12.2712 3.11258 12.342 3.42711 12.3271 3.73346C12.2949 4.39469 12.144 5.12681 12.4746 5.70026C12.8057 6.27373 13.5156 6.50978 14.1045 6.81257C14.3772 6.95281 14.6145 7.17081 14.7793 7.45612C15.2361 8.24727 14.9649 9.25905 14.1738 9.71589C13.3826 10.1727 12.3709 9.90162 11.9141 9.11042C11.7494 8.82504 11.6794 8.51051 11.6943 8.20417C11.7266 7.54286 11.8768 6.81076 11.5459 6.23737C11.2147 5.66396 10.5049 5.42789 9.91601 5.12507C9.64334 4.98476 9.40593 4.76682 9.2412 4.48151C8.78485 3.69046 9.05581 2.67851 9.84667 2.22175Z" fill="url(#h6g3)" />
         <path d="M4.50781 2.27839C5.2989 1.82171 6.31071 2.0929 6.76757 2.88385C7.22408 3.67496 6.95309 4.68685 6.1621 5.14362C5.37103 5.60035 4.35924 5.32907 3.90234 4.53815C3.44576 3.74699 3.7167 2.73513 4.50781 2.27839Z" fill="url(#h6g4)" />
         <defs>
             {[0,1,2,3,4].map(n => <linearGradient key={n} id={`h6g${n}`} x1="1" y1="2" x2="16.87" y2="5.12" gradientUnits="userSpaceOnUse"><stop stopColor="#4A7CF7" /><stop offset="1" stopColor="#A855F7" /></linearGradient>)}
         </defs>
      </svg>
    );

    // Small Card Renderers
    function SmallCardContent({ id }) {
      const S = { fontSize: 12, color: '#6B7280', lineHeight: 1.5, fontWeight: 500 };
      const H = { display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', fontSize: 13, color: '#374151', marginBottom: 12, fontWeight: 600, letterSpacing: '0.01em' };
      const B = { fontSize: 11, background: '#F9FAFB', border: '1px solid #E5E7EB', padding: '2px 8px', borderRadius: 4, color: '#4B5563', display: 'inline-block', marginTop: 4 };

      const ExpandIcon = () => (
         <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D1D5DB" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{marginTop: 2}}>
           <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
         </svg>
      );

      switch (id) {
        case 'meetings':
          return (
            <div>
              <div style={H}><div>Meetings</div><ExpandIcon /></div>
              <div style={S}>Next: in 10 mins</div>
              <span style={B}>Desk Appointment</span>
            </div>
          );
        case 'communication':
          return (
            <div>
              <div style={H}><div>Missed<br/>Communication</div><ExpandIcon /></div>
              <div style={{ display: 'grid', gridTemplateColumns: '20px 1fr', gap: '6px 4px', ...S, marginTop: 12 }}>
                <span style={{color: '#9CA3AF'}}>02</span><span>Mails</span>
                <span style={{color: '#9CA3AF'}}>04</span><span>Chats</span>
              </div>
            </div>
          );
        case 'opportunities':
          return (
            <div>
              <div style={H}><div>Opportunities</div><ExpandIcon /></div>
              <div style={{...S, paddingLeft: 12, position: 'relative', marginBottom: 6}}>
                <span style={{position:'absolute', left: 0, color: '#D1D5DB'}}>•</span> 2 VIP leads wait
              </div>
              <div style={{...S, paddingLeft: 12, position: 'relative'}}>
                <span style={{position:'absolute', left: 0, color: '#D1D5DB'}}>•</span> 2 Deals near $4k gross
              </div>
            </div>
          );
        case 'actions':
          return (
            <div>
              <div style={H}><div>Actions required</div><ExpandIcon /></div>
              <div style={S}>10 total items</div>
              <div style={{...S, color: '#EF4444', marginTop: 4}}>2 high priority</div>
            </div>
          );
        case 'risk':
          return (
            <div>
              <div style={H}><div>At Risk Items</div><ExpandIcon /></div>
              <div style={{...S, marginTop: 12}}>2 aged units (60+ days)</div>
            </div>
          );
        case 'workload':
          return (
            <div>
              <div style={H}><div>Workload<br/>Distribution</div><ExpandIcon /></div>
              <div style={{ display: 'grid', gridTemplateColumns: '30px 1fr', gap: '6px 4px', ...S, marginTop: 12 }}>
                <span style={{color: '#9CA3AF'}}>30%</span><span>Done</span>
                <span style={{color: '#9CA3AF'}}>40%</span><span>Sarah</span>
                <span style={{color: '#9CA3AF'}}>30%</span><span>Mark</span>
              </div>
            </div>
          );
        case 'metrics':
          return (
            <div>
              <div style={H}><div>Today's estimated<br/>metrics</div><ExpandIcon /></div>
              <div style={{...S, marginTop: 12}}>MTD Gross: $172K</div>
              <div style={{...S, fontSize: 11, color: '#10B981', marginTop: 4}}>Ahead of target</div>
            </div>
          );
        default: return null;
      }
    }

    // Large Card Renderers
    function LargeCardContent({ id }) {
      const H = { fontSize: 18, color: '#18181B', fontWeight: 700 };
      const sub = { fontSize: 13, color: '#6B7280', fontWeight: 500, marginTop: 4 };
      const InnerBox = ({ children }) => (<div style={{ background: '#F9FAFB', border: '1px solid #F0F0F0', borderRadius: 10, padding: 16, display: 'flex', flexDirection: 'column' }}>{children}</div>);
      
      if (id === 'actions') {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 24 }}>
              <div>
                <div style={H}>Actions required</div>
                <div style={sub}>2 critical blocks holding deals right now.</div>
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button style={{ width: 28, height: 28, borderRadius: 6, border: '1px solid #E5E7EB', background: '#FFF', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>&lt;</button>
                <button style={{ width: 28, height: 28, borderRadius: 6, border: '1px solid #E5E7EB', background: '#FFF', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>&gt;</button>
              </div>
            </div>
            
            <div style={{ display: 'flex', gap: 16, flex: 1 }}>
              <InnerBox>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <div style={{ fontSize: 14, color: '#18181B', fontWeight: 600 }}>Stipulation missing</div>
                  <span style={{ fontSize: 10, background: '#FEF2F2', color: '#DC2626', padding: '3px 8px', borderRadius: 12, fontWeight: 700 }}>Priority</span>
                </div>
                <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 16 }}>Deal #839 · Rodriguez · F&I Blocked</div>
                <div style={{ fontSize: 13, color: '#374151', lineHeight: 1.5, marginBottom: 16, flex: 1 }}>
                  Proof of income stip has been missing for 48 hours. Lender approval expires tomorrow at noon.
                  <div style={{ marginTop: 8, padding: 12, background: '#FFF', borderRadius: 6, border: '1px dashed #D1D5DB' }}>
                    <span style={{ fontWeight: 600, color: '#18181B' }}>AI Suggestion:</span> Send an automated SMS reminder with a secure upload link directly to the customer.
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button style={{ background: '#18181B', color: '#FFF', border: 'none', padding: '8px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600, flex: 1 }}>Send SMS Link</button>
                  <button style={{ background: '#FFF', color: '#374151', border: '1px solid #E5E7EB', padding: '8px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600 }}>Review Deal</button>
                </div>
              </InnerBox>

              <InnerBox>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
                  <div style={{ fontSize: 14, color: '#18181B', fontWeight: 600 }}>Trade Appraisal Overdue</div>
                  <span style={{ fontSize: 10, background: '#FFFBEB', color: '#D97706', padding: '3px 8px', borderRadius: 12, fontWeight: 700 }}>Warning</span>
                </div>
                <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 16 }}>2019 F-150 · Walk-in · Waiting since 9 AM</div>
                <div style={{ fontSize: 13, color: '#374151', lineHeight: 1.5, marginBottom: 16, flex: 1 }}>
                  The customer has been waiting for an assigned appraiser for 45 minutes. Conversion risk is high.
                  <div style={{ marginTop: 8, padding: 12, background: '#FFF', borderRadius: 6, border: '1px dashed #D1D5DB' }}>
                    <span style={{ fontWeight: 600, color: '#18181B' }}>AI Suggestion:</span> Assign to Jason, he just closed out his morning delivery and is available on the floor.
                  </div>
                </div>
                <div style={{ display: 'flex', gap: 8 }}>
                  <button style={{ background: '#18181B', color: '#FFF', border: 'none', padding: '8px 16px', borderRadius: 6, fontSize: 12, fontWeight: 600, flex: 1 }}>Assign Jason</button>
                </div>
              </InnerBox>
            </div>
          </div>
        );
      }
      
      if (id === 'meetings') {
        const meetings = [
           { t: '10:30 AM', title: 'Desk Deal Review', rep: 'Sarah & Mark', dot: '#F59E0B' },
           { t: '12:00 PM', title: 'Customer Delivery (RAV4)', rep: 'Jason', dot: '#10B981' },
           { t: '02:30 PM', title: 'F&I Yield Check-in', rep: 'Finance Team', dot: '#6B7280' }
        ];
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={H}>Meetings & Schedule</div>
            <div style={sub}>3 appointments remaining today</div>
            <div style={{ flex: 1, marginTop: 24, overflowY: 'auto', paddingRight: 8 }}>
               {meetings.map((m,i) => (
                 <div key={i} style={{ display: 'flex', gap: 16, marginBottom: 12, alignItems: 'center', background: '#F9FAFB', border: '1px solid #F0F0F0', padding: '12px 16px', borderRadius: 8 }}>
                    <div style={{ width: 8, height: 8, borderRadius: '50%', background: m.dot }}></div>
                    <div style={{ fontSize: 13, color: '#4B5563', width: 64, fontWeight: 500 }}>{m.t}</div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, color: '#18181B', fontWeight: 600 }}>{m.title}</div>
                      <div style={{ fontSize: 12, color: '#6B7280', marginTop: 2 }}>w/ {m.rep}</div>
                    </div>
                 </div>
               ))}
            </div>
          </div>
        );
      }

      if (id === 'opportunities') {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={H}>Revenue Opportunities</div>
            <div style={sub}>2 deals near maximum profit thresholds</div>
            <div style={{ flex: 1, marginTop: 24, display: 'flex', gap: 16 }}>
               {[
                 { rep: "Mark's Deal", car: "Accord Touring", gap: "$210 to target", act: "Pitch wheel protection" },
                 { rep: "Sarah's Deal", car: "CR-V Hybrid", gap: "$400 to target", act: "Hold rate by 0.5%" }
               ].map((opp, i) => (
                 <InnerBox key={i}>
                    <div style={{ fontSize: 11, color: '#059669', marginBottom: 6, fontWeight: 600, background: '#D1FAE5', padding: '2px 8px', borderRadius: 10, alignSelf: 'flex-start' }}>{opp.gap}</div>
                    <div style={{ fontSize: 15, color: '#18181B', fontWeight: 600, marginTop: 8 }}>{opp.car}</div>
                    <div style={{ fontSize: 12, color: '#6B7280', marginTop: 4 }}>{opp.rep}</div>
                    <div style={{ marginTop: 'auto', paddingTop: 16 }}>
                      <div style={{ fontSize: 12, color: '#374151', marginBottom: 12 }}><strong>AI Action:</strong> {opp.act}</div>
                      <button style={{ background: '#18181B', color: '#FFF', border: 'none', padding: '8px', borderRadius: 6, width: '100%', fontSize: 12, fontWeight: 600 }}>Apply Push</button>
                    </div>
                 </InnerBox>
               ))}
            </div>
          </div>
        );
      }
      
      if (id === 'risk') {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={H}>Inventory at Risk</div>
            <div style={sub}>2 units hit the 60-day threshold this morning</div>
            <div style={{ flex: 1, marginTop: 24 }}>
               <InnerBox>
                  <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>2020 Civic EX-L</div>
                    <div style={{ fontSize: 13, color: '#EF4444', fontWeight: 600 }}>62 Days</div>
                  </div>
                  <div style={{ fontSize: 12, color: '#6B7280', marginTop: 8 }}>4 test drives, 0 offers this week. Currently parked in the back lot.</div>
                  <div style={{ display: 'flex', gap: 8, marginTop: 16 }}>
                    <button style={{ flex: 1, background: '#FFF', border: '1px solid #E5E7EB', padding: '8px', borderRadius: 6, fontSize: 12, fontWeight: 600 }}>Move to Front Lot</button>
                    <button style={{ flex: 1, background: '#18181B', color: '#FFF', border: 'none', padding: '8px', borderRadius: 6, fontSize: 12, fontWeight: 600 }}>Drop Price $500</button>
                  </div>
               </InnerBox>
            </div>
          </div>
        );
      }
      
      if (id === 'workload') {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={H}>Floor Workload</div>
            <div style={sub}>Sarah is saturated, Mark has capacity</div>
            <div style={{ flex: 1, marginTop: 24, display: 'flex', flexDirection: 'column', gap: 16 }}>
               {[
                 { n: 'Sarah', w: '85%', text: '4 Active Deals', color: '#EF4444' },
                 { n: 'Mark', w: '25%', text: '1 Info Check', color: '#10B981' },
                 { n: 'Jason', w: '45%', text: '1 Delivery Prep', color: '#F59E0B' }
               ].map((r, i) => (
                 <div key={i}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12, fontWeight: 500, marginBottom: 8 }}>
                       <span style={{color: '#18181B'}}>{r.n}</span>
                       <span style={{color: '#6B7280'}}>{r.text}</span>
                    </div>
                    <div style={{ height: 6, background: '#F0F0F0', borderRadius: 3, overflow: 'hidden' }}>
                       <div style={{ width: r.w, background: r.color, height: '100%', borderRadius: 3 }}></div>
                    </div>
                 </div>
               ))}
               <button style={{ background: '#FFF', border: '1px solid #E5E7EB', color: '#18181B', padding: '8px', borderRadius: 6, fontSize: 12, fontWeight: 600, marginTop: 'auto' }}>Re-route next 2 walk-ins to Mark</button>
            </div>
          </div>
        );
      }
      
      if (id === 'metrics') {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
            <div style={H}>Performance vs Target</div>
            <div style={sub}>You are tracking 12% ahead of last month</div>
            <div style={{ flex: 1, marginTop: 24, display: 'flex', flexDirection: 'column', gap: 16 }}>
               <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, width: '100%' }}>
                 <InnerBox>
                    <div style={{ fontSize: 12, color: '#6B7280', fontWeight: 500 }}>MTD Gross</div>
                    <div style={{ fontSize: 28, color: '#18181B', fontWeight: 700, margin: '4px 0 8px' }}>$172K</div>
                    <div style={{ fontSize: 11, color: '#10B981', fontWeight: 600 }}>+12% vs last month</div>
                 </InnerBox>
                 <InnerBox>
                    <div style={{ fontSize: 12, color: '#6B7280', fontWeight: 500 }}>Units Sold</div>
                    <div style={{ fontSize: 28, color: '#18181B', fontWeight: 700, margin: '4px 0 8px' }}>38</div>
                    <div style={{ fontSize: 11, color: '#10B981', fontWeight: 600 }}>+4 units vs last month</div>
                 </InnerBox>
               </div>
            </div>
          </div>
        );
      }

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100%' }}>
           <div style={H}>Missed Communication</div>
           <div style={sub}>Pending threads needing your input</div>
           <div style={{ flex: 1, marginTop: 24, display: 'flex', flexDirection: 'column', gap: 12 }}>
              <div style={{ padding: 16, background: '#F9FAFB', border: '1px solid #F0F0F0', borderRadius: 8 }}>
                 <div style={{ fontSize: 13, fontWeight: 600, color: '#18181B' }}>Finance Dept (Chat)</div>
                 <div style={{ fontSize: 12, color: '#4B5563', margin: '4px 0 12px' }}>"Need your sign-off on the discount for deal #829 before we submit to lender."</div>
                 <button style={{ background: '#FFF', border: '1px solid #E5E7EB', padding: '6px 12px', fontSize: 11, fontWeight: 600, borderRadius: 4 }}>Reply</button>
              </div>
           </div>
        </div>
      );
    }

    function Tab1() {
      const [slots, setSlots] = useState(['meetings', 'communication', 'opportunities', 'actions', 'risk', 'workload', 'metrics']);
      const [promptVal, setPromptVal] = useState('');
      const [viewTab, setViewTab] = useState('Home');

      const handleSlotClick = (slotIndex) => {
        if (slotIndex === 3) return; // Middle card doesn't swap with itself
        const doSwap = () => {
          setSlots(prev => {
            const next = [...prev];
            const temp = next[3];
            next[3] = next[slotIndex];
            next[slotIndex] = temp;
            return next;
          });
        };
        
        if (document.startViewTransition) {
          document.startViewTransition(doSwap);
        } else {
          doSwap();
        }
      };

      return (
        <div style={{ maxWidth: 1040, margin: '0 auto', paddingBottom: 140 }}>
          {/* TOP GREETING */}
          <div style={{ textAlign: 'center', marginBottom: 44, marginTop: 12 }}>
            <div style={{ margin: '0 auto 16px', display: 'flex', justifyContent: 'center' }}>
               <AILogo />
            </div>
            <h1 style={{ fontSize: 24, fontWeight: 500, color: '#18181B', letterSpacing: '-0.02em', margin: 0 }}>Hey Juniper! It is good to see you</h1>
          </div>
          
          {/* PRE-GRID CONTROLS -- Exact width of grid (1040px) */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24, width: 1040, margin: '0 auto 24px' }}>
            {/* Left: Segmented Control */}
            <div style={{ display: 'flex', background: '#E5E7EB', padding: 4, borderRadius: 8 }}>
              {['Home', 'Feeds'].map(t => (
                <button key={t} onClick={() => setViewTab(t)} style={{ 
                  padding: '6px 16px', 
                  background: viewTab === t ? '#18181B' : 'transparent', 
                  borderRadius: 6, 
                  border: 'none', 
                  boxShadow: viewTab === t ? '0 2px 6px rgba(0,0,0,0.15)' : 'none', 
                  fontSize: 13, 
                  fontWeight: viewTab === t ? 600 : 500, 
                  color: viewTab === t ? '#FFF' : '#6B7280' 
                }}>
                  {t}
                </button>
              ))}
            </div>

                           onMouseEnter={e => e.currentTarget.style.background = '#F9FAFB'} onMouseLeave={e => e.currentTarget.style.background = '#FFF'}>

                 <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 20 }}>
                    <div style={{ padding: 24, background: '#FFF', borderRadius: 20, border: '1px solid #E5E7EB', boxShadow: '0 4px 12px rgba(0,0,0,0.02)' }}>
                       <div style={{ width: 44, height: 44, borderRadius: 12, background: '#EFF6FF', color: '#2563EB', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16 }}>
                         <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                       </div>
                       <div style={{ fontSize: 15, fontWeight: 800, color: '#18181B', marginBottom: 8 }}>Front Gross is up</div>
                       <div style={{ fontSize: 14, color: '#6B7280', lineHeight: 1.5 }}>Averaging $200 higher front gross this week than usual.</div>
                    </div>
                    <div style={{ padding: 24, background: '#FFF', borderRadius: 20, border: '1px solid #E5E7EB', boxShadow: '0 4px 12px rgba(0,0,0,0.02)' }}>
                       <div style={{ width: 44, height: 44, borderRadius: 12, background: '#FEF2F2', color: '#DC2626', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16 }}>
                         <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                       </div>
                       <div style={{ fontSize: 15, fontWeight: 800, color: '#18181B', marginBottom: 8 }}>High Turnaround</div>
                       <div style={{ fontSize: 14, color: '#6B7280', lineHeight: 1.5 }}>Service wait times are exceeding 45 minutes right now.</div>
                    </div>
                    <div style={{ padding: 24, background: '#FFF', borderRadius: 20, border: '1px solid #E5E7EB', boxShadow: '0 4px 12px rgba(0,0,0,0.02)' }}>
                       <div style={{ width: 44, height: 44, borderRadius: 12, background: '#F0FDF4', color: '#16A34A', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 16 }}>
                         <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                       </div>
                       <div style={{ fontSize: 15, fontWeight: 800, color: '#18181B', marginBottom: 8 }}>Contract Rate Peak</div>
                       <div style={{ fontSize: 14, color: '#6B7280', lineHeight: 1.5 }}>Finance contracting is perfectly paced today. No backlog.</div>
                    </div>
                 </div>
              </section>
           </div>
        </div>
      );
    }

    function App() {
      const [homeTab, setHomeTab] = useState(1);
      const [loaded, setLoaded] = useState(false);
      useEffect(() => { setTimeout(() => setLoaded(true), 30); }, []);

      return (
        <div style={{
          minHeight: "100vh", fontFamily: "'Cabinet Grotesk', sans-serif", color: "#18181B", 
          opacity: loaded ? 1 : 0, transition: "opacity .4s"
        }}>
          {/* ── STICKY HEADER ── */}
          <div style={{ position: "sticky", top: 0, zIndex: 50, background: "rgba(243,242,239,.88)", backdropFilter: "blur(14px)", borderBottom: "1px solid #E5E7EB" }}>
            <div style={{ padding: "0 24px", height: 52, display: "flex", alignItems: "center", justifyContent: "space-between", maxWidth: 1040, margin: '0 auto' }}>
              <div style={{ width: 36 }}></div>
              <div style={{ display: "flex", gap: 2, background: "#E5E7EB", borderRadius: 7, padding: 3 }}>
                {[1, 2, 3, 4, 5].map(n => (
                  <button key={n} onClick={() => setHomeTab(n)} style={{
                    padding: "4px 11px", borderRadius: 5, border: "none", fontFamily: "inherit",
                    fontSize: 12, fontWeight: homeTab === n ? 700 : 600, cursor: "pointer",
                    background: homeTab === n ? "#18181B" : "transparent",
                    color: homeTab === n ? "#FFF" : "#6B7280"
                  }}>Home {n}</button>
                ))}
              </div>
              <div style={{ width: 36 }}></div>
            </div>
          </div>

          <main style={{ padding: "40px 24px", margin: "0 auto", display: 'flex', justifyContent: 'center', width: '100%' }}>
            {homeTab === 1 && <Tab1 />}
            {homeTab === 2 && <Tab2 />}
            {homeTab === 3 && <Tab3 />}
            {homeTab > 3 && (
              <div style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#9CA3AF', fontSize: 18, border: '1px dashed #D1D5DB', borderRadius: 12, width: '100%', maxWidth: 1040, background: '#FFF' }}>
                Home {homeTab} Content (Empty)
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
