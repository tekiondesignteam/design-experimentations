  /* ── Base interactions ── */
  button { transition: transform 0.12s ease, opacity 0.12s ease; }
  button:active { transform: scale(0.96) !important; }

  /* ── Page load — clean top-to-bottom cascade ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-header { animation: fadeUp 0.4s ease both; }
  .logo-entrance { animation: fadeUp 0.4s ease 0.1s both; }
  .greeting-entrance { animation: fadeUp 0.4s ease 0.25s both; }
  .narrative-entrance { animation: fadeUp 0.4s ease 0.4s both; }
  .prompt-entrance { animation: fadeUp 0.4s ease 0.55s both; }
  .chip-entrance { animation: fadeUp 0.35s ease both; }

  /* ── Card hover lift ── */
  .card-hover {
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease !important;
  }
  .card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04) !important;
    border-color: #E0E0E0 !important;
  }

  /* ── Chip hover ── */
  .prompt-chip {
    transition: all 0.15s ease !important;
  }
  .prompt-chip:hover {
    border-color: #C0C0C0 !important;
    color: #18181B !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
    transform: translateY(-1px);
  }
  .prompt-chip:active { transform: translateY(0) scale(0.97) !important; }

  /* ── List item hover ── */
  .list-row {
    transition: background 0.15s ease;
    border-radius: 4px;
    margin: 0 -4px;
    padding-left: 4px !important;
    padding-right: 4px !important;
  }
  .list-row:hover { background: #FAFAFA; }

  /* ── Icon button hover ── */
  .icon-btn {
    transition: all 0.15s ease !important;
  }
  .icon-btn:hover {
    border-color: #C0C0C0 !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08) !important;
    transform: translateY(-1px);
  }

  .alert-entrance { animation: fadeUp 0.4s ease 0.9s both; }

  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.8); opacity: 0; } }

  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .bento-glance { grid-template-columns: 1fr !important; }
    .bento-glance > * { grid-column: 1 / -1 !important; grid-row: auto !important; }

    .new-suggestions-btn { margin-left: 0 !important; flex-basis: 100%; }

              if (id === "sources") return <B key="sources" delay={delay}><Bp>
                <Row sx={{ justifyContent: "space-between", marginBottom: 12 }}><Row sx={{ gap: 5, alignItems: "baseline" }}><div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>Lead Sources</div><span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF" }}>MTD</span></Row>{rb}</Row>
                <div style={{ display: "grid", gridTemplateColumns: "36% 18% 22% 24%", gap: 0, padding: "0 0 6px 0", borderBottom: "1px solid #E5E7EB", marginBottom: 2 }}>{["Source","Leads #","Contact %","Close %"].map((h,i) => <div key={i} style={{ fontSize: 11, fontWeight: 700, color: "#374151", textAlign: i > 0 ? "right" : "left", whiteSpace: "nowrap" }}>{h}</div>)}</div>
                {(() => { const mx = Math.max(...LEAD_SOURCES.map(s => s.closeRate)); return LEAD_SOURCES.map((s,i) => (
                  <div key={i} style={{ display: "grid", gridTemplateColumns: "36% 18% 22% 24%", gap: 0, padding: "6px 0", borderBottom: i < LEAD_SOURCES.length-1 ? "1px solid #F5F5F5" : "none", alignItems: "center" }}>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#18181B" }}>{s.src}</div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: "#374151", textAlign: "right" }}>{s.volume}</div>
                    <div style={{ textAlign: "right" }}><span style={{ fontSize: 12, fontWeight: 700, color: s.contactRate >= 75 ? "#15803D" : s.contactRate >= 60 ? "#A16207" : "#DC2626" }}>{s.contactRate}%</span></div>
                    <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 3, minWidth: 0, overflow: "hidden" }}><span style={{ fontSize: 12, fontWeight: 800, color: "#18181B" }}>{s.closeRate}%</span><div style={{ width: 40, height: 3, borderRadius: 2, background: "#F0F0F0", flexShrink: 0 }}><div style={{ height: "100%", borderRadius: 2, width: `${(s.closeRate/mx)*100}%`, background: s.closeRate === mx ? "#15803D" : aiGrad }} /></div></div>
                  </div>
                )); })()}
                <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "flex-start" }}><div style={{ width: 3, borderRadius: 2, background: aiGrad, flexShrink: 0, alignSelf: "stretch" }} /><span style={{ fontSize: 12, fontWeight: 500, color: "#6B7280", lineHeight: 1.55 }}>Walk-ins closing at 2× third-party leads. Autotrader &amp; CarGurus contact rates down 8pts — check rep follow-up cadence.</span></div>
              </Bp></B>;

              if (id === "pipeline") return <B key="pipeline" delay={delay}><Bp>
                <Row sx={{ justifyContent: "space-between", marginBottom: 12 }}><Row sx={{ gap: 5, alignItems: "baseline" }}><div style={{ fontSize: 13, fontWeight: 700, color: "#374151" }}>Leads Pipeline</div><span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF" }}>MTD</span></Row><Row sx={{ gap: 8 }}><span style={{ fontSize: 11, fontWeight: 700, color: "#15803D", background: "#F0FDF4", padding: "2px 8px", borderRadius: 3 }}>{((PIPELINE[4].count/PIPELINE[0].count)*100).toFixed(1)}% lead-to-sale</span>{rb}</Row></Row>
                {(() => { const mc = PIPELINE[0].count; const lh = c => Math.round((Math.log(c)/Math.log(mc))*100); return (
                  <div>
                    <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 160, borderBottom: "1px solid #F0F0F0", marginBottom: 8 }}>
                      {PIPELINE.map((b,i) => { const h = lh(b.count); const prev = i > 0 ? PIPELINE[i-1] : null; const dp = prev ? Math.round((1-b.count/prev.count)*100) : null; const gh = prev ? Math.round((Math.log(prev.count)/Math.log(mc))*100)-h : 0; return (
                        <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "stretch", justifyContent: "flex-end", height: "100%" }}>
                          {dp !== null && <div style={{ textAlign: "center", fontSize: 9, fontWeight: 800, color: dp >= 60 ? "#DC2626" : "#D97706", marginBottom: 2 }}>−{dp}%</div>}
                          {gh > 0 && <div style={{ height: `${gh}%`, background: "#FEF2F2", border: "1px dashed #FECACA", borderRadius: "2px 2px 0 0" }} />}
                          <div style={{ height: `${h}%`, minHeight: 10, background: b.color, borderRadius: "2px 2px 0 0", display: "flex", alignItems: "flex-end", justifyContent: "center", paddingBottom: 2 }}><span style={{ fontSize: 9, fontWeight: 800, color: "#FFF" }}>{b.count}</span></div>
                        </div>
                      ); })}
                    </div>
                    <div style={{ display: "flex", gap: 4 }}>{PIPELINE.map((b,i) => <div key={i} style={{ flex: 1, textAlign: "center", fontSize: 10, fontWeight: 600, color: "#6B7280", lineHeight: 1.3 }}>{b.label}</div>)}</div>
                  </div>
                ); })()}
                <div style={{ display: "flex", gap: 8, marginTop: 12, alignItems: "flex-start" }}><div style={{ width: 3, borderRadius: 2, background: aiGrad, flexShrink: 0, alignSelf: "stretch" }} /><span style={{ fontSize: 12, fontWeight: 500, color: "#6B7280", lineHeight: 1.55 }}>Biggest leak: Contacted → Engaged at 70% drop-off. Top dealers convert 40%+ of contacted leads.</span></div>
              </Bp></B>;

              return null;
            };

            return widgetOrder.filter(id => id !== "huddle").map((id, i) => renderWidget(id, 1500 + i * 200));
          })()}


        </div>

      </main>

      {/* Modify Modal */}
      {showModifyModal && (<>
        <div onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", zIndex: 49, backdropFilter: "blur(2px)" }} />
        <div style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 520, maxWidth: "92vw", maxHeight: "88vh", background: "#FFF", borderRadius: 12, boxShadow: "0 20px 48px rgba(0,0,0,0.18), 0 6px 16px rgba(0,0,0,0.08)", zIndex: 50, overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {/* header */}
          <div style={{ padding: "16px 20px 14px", borderBottom: "1px solid #F0F0F0", flexShrink: 0 }}>
            <Row sx={{ justifyContent: "space-between", alignItems: "center" }}>
              <Row sx={{ gap: 8 }}>
                <div style={{ width: 28, height: 28, borderRadius: 6, background: aiGrad, display: "flex", alignItems: "center", justifyContent: "center" }}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </div>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 700, color: "#18181B" }}>Modify with AI</div>
                  <div style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>Describe what to change — AI will update the steps</div>
                </div>
              </Row>
              <span onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, background: "#F3F4F6", cursor: "pointer", fontSize: 14, color: "#6B7280", fontWeight: 600 }}>{"\u2715"}</span>
            </Row>
          </div>

          {/* AI prompt */}
          <div style={{ padding: "14px 20px 12px", borderBottom: "1px solid #F5F5F5", flexShrink: 0, background: modifyPromptFocused ? "#FAFBFF" : "#FFF", transition: "background 0.3s" }}>
            <div style={{ borderRadius: 8, border: modifyPromptFocused ? "1.5px solid rgba(74,124,247,0.4)" : "1.5px solid #E5E7EB", boxShadow: modifyPromptFocused ? "0 0 0 3px rgba(74,124,247,0.08)" : "none", transition: "all 0.25s", background: "#FFF", padding: "10px 12px", display: "flex", alignItems: "flex-start", gap: 10 }}>
              <textarea
                value={modifyPrompt}
                onChange={e => { setModifyPrompt(e.target.value); setModifyApplied(false); }}
                onFocus={() => setModifyPromptFocused(true)}
                onBlur={() => setModifyPromptFocused(false)}
                rows={2}
                placeholder="e.g. Skip notifying the customer, add a manager approval step first..."
                style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans, resize: "none", lineHeight: 1.55, padding: 0 }}
              />
              <button
                onClick={() => { if (!modifyPrompt.trim()) return; setModifyThinking(true); setTimeout(() => { setModifyThinking(false); setModifyApplied(true); }, 1600); }}
                disabled={!modifyPrompt.trim() || modifyThinking}
                style={{ flexShrink: 0, padding: "5px 12px", borderRadius: 5, border: "none", background: modifyPrompt.trim() ? aiGrad : "#F3F4F6", color: modifyPrompt.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: modifyPrompt.trim() ? "pointer" : "default", fontFamily: sans, display: "flex", alignItems: "center", gap: 5, transition: "all 0.2s", marginTop: 1 }}>
                {modifyThinking ? (<><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ animation: "spin 1s linear infinite" }}><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>Thinking</>) : "Apply"}
              </button>
            </div>
            {!modifyApplied && (
              <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                {["Remove customer notification", "Add manager approval first", "Simplify to 2 steps", "Add a loaner car step"].map((s, i) => (
                  <button key={i} onClick={() => { setModifyPrompt(s); setModifyApplied(false); }}
                    style={{ padding: "4px 10px", borderRadius: 20, border: "1px solid #E5E7EB", background: "#F9FAFB", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = "#A5B4FC"; e.currentTarget.style.color = "#4F46E5"; e.currentTarget.style.background = "#EEF2FF"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = "#E5E7EB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.background = "#F9FAFB"; }}
                  >{s}</button>
                ))}
              </div>
            )}
            {modifyApplied && (
              <Row sx={{ gap: 6, marginTop: 8 }}>
                <div style={{ width: 16, height: 16, borderRadius: 3, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#15803D" }}>Steps updated based on your instruction</span>
                <span onClick={() => { setModifyPrompt(""); setModifyApplied(false); }} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", marginLeft: 4, textDecoration: "underline", textUnderlineOffset: 2 }}>Undo</span>
              </Row>
            )}
          </div>

          {/* Steps */}
          <div style={{ padding: "14px 20px", overflowY: "auto", flex: 1 }}>
            <Row sx={{ justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.05em" }}>Steps</div>
              <span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF" }}>{modifySteps.length} steps</span>
            </Row>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {modifySteps.map((step, i) => {
                const isDragging = dragItem === i;
                const isDragOver = dragOverItem === i && dragItem !== i;
                return (
                  <div key={i}
                    draggable
                    onDragStart={() => setDragItem(i)}
                    onDragEnter={() => setDragOverItem(i)}
                    onDragOver={e => e.preventDefault()}
                    onDrop={() => { if (dragItem === null || dragItem === i) { setDragOverItem(null); return; } const s = [...modifySteps]; const dragged = s.splice(dragItem, 1)[0]; s.splice(i, 0, dragged); setModifySteps(s); setDragItem(null); setDragOverItem(null); }}
                    onDragEnd={() => { setDragItem(null); setDragOverItem(null); }}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 7, border: isDragOver ? "1.5px solid #4A7CF7" : "1px solid #F0F0F0", background: isDragOver ? "#EEF2FF" : isDragging ? "#F3F4F6" : "#FAFAFA", opacity: isDragging ? 0.45 : 1, cursor: "grab", transition: "border-color 0.12s, background 0.12s, opacity 0.12s" }}>
                    <div style={{ flexShrink: 0, color: "#C4C4C4", cursor: "grab", display: "flex", alignItems: "center", padding: "0 1px" }}>
                      <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                        <circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/>
                        <circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>
                        <circle cx="3" cy="12" r="1.2"/><circle cx="7" cy="12" r="1.2"/>
                      </svg>
                    </div>
                    <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB" }}>{i + 1}</div>
                    <span style={{ flex: 1, fontSize: 14, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{step}</span>
                    <button onClick={() => setModifySteps(modifySteps.filter((_, j) => j !== i))} style={{ width: 24, height: 24, borderRadius: 5, border: "1px solid #FECACA", background: "#FFF5F5", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }} onMouseEnter={e => e.currentTarget.style.background = "#FEE2E2"} onMouseLeave={e => e.currentTarget.style.background = "#FFF5F5"}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#EF4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                  </div>
                );
              })}
            </div>
            {addingStep ? (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, padding: "8px 10px", borderRadius: 7, border: "1.5px solid rgba(74,124,247,0.3)", background: "#FAFBFF" }}>
                <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB" }}>{modifySteps.length + 1}</div>
                <input autoFocus value={newStepText} onChange={e => setNewStepText(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); setAddingStep(false); } if (e.key === "Escape") { setNewStepText(""); setAddingStep(false); } }}
                  placeholder="Describe the step..."
                  style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans }} />
                <button onClick={() => { if (newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); } setAddingStep(false); }} style={{ padding: "3px 10px", borderRadius: 5, border: "none", background: newStepText.trim() ? "#18181B" : "#F3F4F6", color: newStepText.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: sans }}>Add</button>
                <button onClick={() => { setNewStepText(""); setAddingStep(false); }} style={{ width: 22, height: 22, borderRadius: 4, border: "none", background: "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 12, color: "#9CA3AF" }}>{"\u2715"}</button>
              </div>
            ) : (
              <button onClick={() => setAddingStep(true)} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, padding: "7px 12px", borderRadius: 6, border: "1.5px dashed #D1D5DB", background: "transparent", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", width: "100%", fontFamily: sans }} onMouseEnter={e => { e.currentTarget.style.borderColor = "#9CA3AF"; e.currentTarget.style.color = "#374151"; }} onMouseLeave={e => { e.currentTarget.style.borderColor = "#D1D5DB"; e.currentTarget.style.color = "#6B7280"; }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                Add step
              </button>
            )}
          </div>

          {/* footer */}
          <div style={{ padding: "12px 20px 16px", borderTop: "1px solid #F5F5F5", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
            <Btn onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }}>Cancel</Btn>
            <Btn primary onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} sx={{ padding: "6px 16px" }}>Save</Btn>
          </div>
        </div>
      </>)}

      {/* Widget Manager Modal */}
      {showWidgetModal && (<>
        <div onClick={() => { setShowWidgetModal(false); document.body.style.overflow = ""; }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", zIndex: 49, backdropFilter: "blur(2px)" }} />
        <div style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 420, maxWidth: "92vw", maxHeight: "88vh", background: "#FFF", borderRadius: 12, boxShadow: "0 20px 48px rgba(0,0,0,0.18)", zIndex: 50, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          {/* header */}
          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0F0F0", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#18181B" }}>Manage Widgets</div>
              <div style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF", marginTop: 2 }}>Select and reorder widgets on your dashboard</div>
            </div>
            <button onClick={() => { setShowWidgetModal(false); document.body.style.overflow = ""; }} style={{ width: 28, height: 28, borderRadius: 6, background: "#F3F4F6", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", color: "#6B7280", fontSize: 14, fontWeight: 600 }}>{"\u2715"}</button>
          </div>

          {/* list */}
          <div style={{ overflowY: "auto", flex: 1, padding: "8px 0" }}>
            {(draftOrder || widgetOrder).map((id, i) => {
              const order = draftOrder || widgetOrder;
              const widget = ALL_WIDGETS.find(w => w.id === id);
              const isSelected = (draftSelected || widgetSelected).has(id);
              const isLocked = widget.locked;
              const isDragging = widgetDragItem === i;
              const isDragOver = widgetDragOver === i && widgetDragItem !== i;

              return (
                <div key={id}
                  draggable={!isLocked}
                  onDragStart={() => !isLocked && setWidgetDragItem(i)}
                  onDragEnter={() => !isLocked && setWidgetDragOver(i)}
                  onDragOver={e => e.preventDefault()}
                  onDrop={() => {
                    if (widgetDragItem === null || widgetDragItem === i) { setWidgetDragOver(null); return; }
                    const newOrder = [...order];
                    const dragged = newOrder.splice(widgetDragItem, 1)[0];
                    newOrder.splice(i, 0, dragged);
                    setDraftOrder(newOrder);
                    setWidgetDragItem(null); setWidgetDragOver(null);
                  }}
                  onDragEnd={() => { setWidgetDragItem(null); setWidgetDragOver(null); }}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 20px", borderBottom: i < order.length - 1 ? "1px solid #F5F5F5" : "none", background: isDragOver ? "#F5F3FF" : isDragging ? "#FAFAFA" : "#FFF", opacity: isDragging ? 0.45 : 1, transition: "background 0.1s", cursor: isLocked ? "default" : "grab" }}>

                  {/* drag handle */}
                  <div style={{ color: isLocked ? "#E5E7EB" : "#C4C4C4", flexShrink: 0, display: "flex", alignItems: "center" }}>
                    <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                      <circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/>
                      <circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>
                      <circle cx="3" cy="12" r="1.2"/><circle cx="7" cy="12" r="1.2"/>
                    </svg>
                  </div>

                  {/* checkbox */}
                  <div
                    onClick={() => {
                      if (isLocked) return;
                      setDraftSelected(prev => {
                        const next = new Set(prev);
                        if (next.has(id)) next.delete(id); else next.add(id);
                        return next;
                      });
                    }}
                    style={{ width: 18, height: 18, borderRadius: 4, flexShrink: 0, border: isSelected ? "none" : "1.5px solid #D1D5DB", background: isSelected ? (isLocked ? "#E5E7EB" : aiGrad) : "#FFF", display: "flex", alignItems: "center", justifyContent: "center", cursor: isLocked ? "default" : "pointer", transition: "all 0.15s" }}>
                    {isSelected && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>}
                  </div>

                  {/* label */}
                  <div style={{ flex: 1 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: isLocked ? "#9CA3AF" : "#18181B" }}>{widget.label}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* footer */}
          <div style={{ padding: "12px 20px", borderTop: "1px solid #F0F0F0", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
            <Btn onClick={() => { setShowWidgetModal(false); document.body.style.overflow = ""; setDraftSelected(null); setDraftOrder(null); }}>Cancel</Btn>
            <Btn primary onClick={() => {
              if (draftSelected) setWidgetSelected(draftSelected);
              if (draftOrder) setWidgetOrder(draftOrder);
              setShowWidgetModal(false); document.body.style.overflow = ""; setDraftSelected(null); setDraftOrder(null);
            }} sx={{ padding: "6px 16px" }}>Save</Btn>
          </div>
        </div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
