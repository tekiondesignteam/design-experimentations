<style>
  :root {
    --primitive-color-ai-primary-start: #4A7CF7;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { -webkit-font-smoothing: antialiased; }

  /* ── Base interactions ── */
  button { transition: transform 0.12s ease, opacity 0.12s ease; }
  button:not(.filter-fab):active { transform: scale(0.96) !important; }

  /* ── Page load — clean top-to-bottom cascade ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .page-header { animation: fadeUp 0.25s ease both; }
  .logo-entrance { animation: fadeUp 0.25s ease 0.05s both; }
  .greeting-entrance { animation: fadeUp 0.25s ease 0.1s both; }
  .narrative-entrance { animation: fadeUp 0.25s ease 0.14s both; }
  .prompt-entrance { animation: fadeUp 0.25s ease 0.18s both; }
  .chip-entrance { animation: fadeUp 0.2s ease both; }

  /* ── Card hover lift ── */
  .card-hover {
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease !important;
  }
  .card-hover:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04) !important;
    border-color: #E0E0E0 !important;
  }

  /* ── Chip hover ── */
  .prompt-chip {
    transition: all 0.15s ease !important;
  }
  .prompt-chip:hover {
    border-color: #C0C0C0 !important;
    color: #18181B !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
    transform: translateY(-1px);
  }
  .prompt-chip:active { transform: translateY(0) scale(0.97) !important; }

  /* ── List item hover ── */
  .list-row {
    transition: background 0.15s ease;
    border-radius: 4px;
    margin: 0 -4px;
    padding-left: 4px !important;
    padding-right: 4px !important;
  }
  .list-row:hover { background: #FAFAFA; }

  /* ── Icon button hover ── */
  .icon-btn {
    transition: all 0.15s ease !important;
  }
  .icon-btn:hover {
    border-color: #C0C0C0 !important;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08) !important;
    transform: translateY(-1px);
  }

  .alert-entrance { animation: fadeUp 0.25s ease 0.28s both; }

  /* ── Existing ── */
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.8); opacity: 0; } }

  @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes glowPulse { 0%,100% { box-shadow: 0 0 16px rgba(74,124,247,0.06),0 0 32px rgba(168,85,247,0.03); } 50% { box-shadow: 0 0 24px rgba(74,124,247,0.1),0 0 48px rgba(168,85,247,0.06); } }

  /* ── glowPulse ── */
  @keyframes glowPulse { 0%,100% { box-shadow: 0 0 16px rgba(74,124,247,0.06),0 0 32px rgba(168,85,247,0.03); } 50% { box-shadow: 0 0 24px rgba(74,124,247,0.1),0 0 48px rgba(168,85,247,0.06); } }

  /* ── Responsive 2-col grids ── */
  @media (max-width: 600px) {
    .appt-grid,
    .two-col-grid { grid-template-columns: 1fr !important; }
  }

  /* mobile */
  @media (max-width: 767px) {
    .bento-glance { grid-template-columns: 1fr !important; }
    .bento-glance > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
    .alert-act { flex-wrap: wrap; }
    .alert-split {
      grid-template-columns: 1fr !important;
      height: auto !important;
      min-height: 0 !important;
    }
    .alert-split > div { border-right: none !important; }
    .main-wrap { padding: 20px 16px 40px !important; }
    .title-bar { padding-left: 24px !important; padding-right: 24px !important; }
    .new-suggestions-btn { margin-left: 0 !important; flex-basis: 100%; }
    .carryover-grid { grid-template-columns: 1fr !important; }
    .bucket-grid { grid-template-columns: 1fr 1fr !important; row-gap: 16px !important; }
    .bucket-item { padding: 0 8px !important; }
    .bucket-item-0 { padding-left: 0 !important; }
    .bucket-item-1 { border-right: none !important; }
    .bucket-item-2 { padding-left: 0 !important; border-right: 1px solid #F0F0F0 !important; }

  }

  @media (min-width: 768px) and (max-width: 1023px) {
    .main-wrap { padding: 28px 24px 44px !important; max-width: 960px !important; }
  }

  /* ── Feed layout responsive ── */
  .feed-layout { display: flex; gap: 32px; align-items: flex-start; }
  .feed-sidebar { width: 200px; flex-shrink: 0; position: sticky; top: 68px; }
  .feed-main { flex: 1; min-width: 0; }

  .filter-fab {
    display: none;
  }

  @media (max-width: 767px) {
    .feed-layout { display: block; }
    .feed-sidebar { display: none; position: fixed; inset: 0; width: 100%; z-index: 200;

    .feed-sidebar.open { display: flex; align-items: flex-end; }
    .feed-sidebar-inner { background: #FFF; border-radius: 16px 16px 0 0;
      width: 100%; max-height: 82vh; overflow-y: auto; padding-bottom: 24px; }
    .filter-fab {
      display: inline-flex; align-items: center; gap: 6px;
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 150;
      padding: 9px 20px; border-radius: 20px;
      background: #FFF; border: 1px solid #E5E7EB;
      box-shadow: 0 4px 16px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.06);
      cursor: pointer; font-family: 'Manrope', sans-serif; font-size: 13px; font-weight: 600; color: #374151;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .filter-fab:active { transform: translateX(-50%) scale(0.96) !important; }
  }

  .filter-mobile-header { display: none; }

  }

  @media (min-width: 768px) and (max-width: 1023px) {
    .feed-sidebar { width: 160px; }
    .feed-layout { gap: 20px; }

}

function Row({ children, sx = {}, className = "" }) { return <div className={className} style={{ display: "flex", alignItems: "center", ...sx }}>{children}</div>; }

          <div style={{ padding: "16px 20px", borderBottom: "1px solid #F0F0F0", display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, color: "#18181B" }}>Manage Widgets</div>
              <div style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF", marginTop: 2 }}>Select and reorder widgets on your dashboard</div>
            </div>
            <button onClick={() => { setShowWidgetModal(false); document.body.style.overflow = ""; }} style={{ width: 28, height: 28, borderRadius: 6, background: "#F3F4F6", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", color: "#6B7280", fontSize: 14, fontWeight: 600 }}>{"\u2715"}</button>
          </div>

          {/* list */}
          <div style={{ overflowY: "auto", flex: 1, padding: "8px 0" }}>
            {(draftOrder || widgetOrder).map((id, i) => {
              const order = draftOrder || widgetOrder;
              const widget = ALL_WIDGETS.find(w => w.id === id);
              const isSelected = (draftSelected || widgetSelected).has(id);
              const isLocked = widget.locked;
              const isDragging = widgetDragItem === i;
              const isDragOver = widgetDragOver === i && widgetDragItem !== i;

              return (
                <div key={id}
                  draggable={!isLocked}
                  onDragStart={() => !isLocked && setWidgetDragItem(i)}
                  onDragEnter={() => !isLocked && setWidgetDragOver(i)}
                  onDragOver={e => e.preventDefault()}
                  onDrop={() => {
                    if (widgetDragItem === null || widgetDragItem === i) { setWidgetDragOver(null); return; }
                    const newOrder = [...order];
                    const dragged = newOrder.splice(widgetDragItem, 1)[0];
                    newOrder.splice(i, 0, dragged);
                    setDraftOrder(newOrder);
                    setWidgetDragItem(null); setWidgetDragOver(null);
                  }}
                  onDragEnd={() => { setWidgetDragItem(null); setWidgetDragOver(null); }}
                  style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 20px", borderBottom: i < order.length - 1 ? "1px solid #F5F5F5" : "none", background: isDragOver ? "#F5F3FF" : isDragging ? "#FAFAFA" : "#FFF", opacity: isDragging ? 0.45 : 1, transition: "background 0.1s", cursor: isLocked ? "default" : "grab" }}>

                  {/* drag handle */}
                  <div style={{ color: isLocked ? "#E5E7EB" : "#C4C4C4", flexShrink: 0, display: "flex", alignItems: "center" }}>
                    <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                      <circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/>
                      <circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/>
                      <circle cx="3" cy="12" r="1.2"/><circle cx="7" cy="12" r="1.2"/>
                    </svg>
                  </div>

                  {/* checkbox */}
                  <div
                    onClick={() => {
                      if (isLocked) return;
                      setDraftSelected(prev => {
                        const next = new Set(prev);
                        if (next.has(id)) next.delete(id); else next.add(id);
                        return next;
                      });
                    }}
                    style={{ width: 18, height: 18, borderRadius: 4, flexShrink: 0, border: isSelected ? "none" : "1.5px solid #D1D5DB", background: isSelected ? (isLocked ? "#E5E7EB" : aiGrad) : "#FFF", display: "flex", alignItems: "center", justifyContent: "center", cursor: isLocked ? "default" : "pointer", transition: "all 0.15s" }}>
                    {isSelected && <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>}
                  </div>

                  {/* label */}
                  <div style={{ flex: 1 }}>
                    <span style={{ fontSize: 13, fontWeight: 600, color: isLocked ? "#9CA3AF" : "#18181B" }}>{widget.label}</span>
                  </div>
                </div>
              );
            })}
          </div>

          {/* footer */}
          <div style={{ padding: "12px 20px", borderTop: "1px solid #F0F0F0", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
            <Btn onClick={() => { setShowWidgetModal(false); document.body.style.overflow = ""; setDraftSelected(null); setDraftOrder(null); }}>Cancel</Btn>
            <Btn primary onClick={() => {
              if (draftSelected) setWidgetSelected(draftSelected);
              if (draftOrder) setWidgetOrder(draftOrder);
              setShowWidgetModal(false); document.body.style.overflow = ""; setDraftSelected(null); setDraftOrder(null);
            }} sx={{ padding: "6px 16px" }}>Save</Btn>
          </div>
        </div>
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
