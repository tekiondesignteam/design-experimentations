    :root {
      --primitive-color-ai-primary-start: #4A7CF7;
      --primitive-color-ai-primary-end: #A855F7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    /* ── Base interactions ── */
    button {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:not(.filter-fab):active {
      transform: scale(0.96) !important;
    }

    /* ── Page load — clean top-to-bottom cascade ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-header {
      animation: fadeUp 0.45s ease both;
    }

    .logo-entrance {
      animation: fadeUp 0.5s ease 0.1s both;
    }

    .greeting-entrance {
      animation: fadeUp 0.5s ease 0.25s both;
    }

    .narrative-entrance {
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .prompt-entrance {
      animation: fadeUp 0.5s ease 0.55s both;
    }

    .chip-entrance {
      animation: fadeUp 0.45s ease both;
    }

    .quick-actions-entrance {
      animation: fadeUp 0.45s ease 0.72s both;
    }

    .qa-desktop-entrance {
      animation: fadeUp 0.45s ease 0.45s both;
    }

    /* ── Card hover lift ── */
    .card-hover {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease !important;
    }

    .card-hover:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.10), 0 2px 6px rgba(0, 0, 0, 0.05) !important;
      border-color: #D0D5DD !important;
    }

    /* ── Recent-item card wrapper hover ── */
    .recent-card {
      border-radius: 8px;
      padding: 5px;
      background: #FFF;
      border: 1px solid #E5E7EB;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .recent-card:hover {
      background: #EFF6FF;
      border-color: #BFDBFE;
    }

    .recent-card .redirect-icon {
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .recent-card:hover .redirect-icon {
      opacity: 1;
    }

    /* ── Chip hover ── */
    .prompt-chip {
      transition: all 0.15s ease !important;
    }

    .prompt-chip:hover {
      border-color: #C0C0C0 !important;
      color: #18181B !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
      transform: translateY(-1px);
    }

    .prompt-chip:active {
      transform: translateY(0) scale(0.97) !important;
    }

    /* ── List item hover ── */
    .list-row {
      transition: background 0.15s ease;
      border-radius: 4px;
      margin: 0 -4px;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    .list-row:hover {
      background: #FAFAFA;
    }

    /* ── Icon button hover ── */
    .icon-btn {
      transition: all 0.15s ease !important;
    }

    .icon-btn:hover {
      border-color: #C0C0C0 !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08) !important;
      transform: translateY(-1px);
    }

    .alert-entrance {
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .briefs-entrance {
      animation: fadeUp 0.5s ease 0.65s both;
    }

    .divider-entrance {
      animation: fadeUp 0.5s ease 0.75s both;
    }

    .feed-entrance {
      animation: fadeUp 0.55s ease 0.9s both;
    }

    .section-entrance {
      animation: fadeUp 0.4s ease both;
    }

    .card-enter {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.45s ease forwards;
    }

    /* ── Existing ── */
    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.3;
      }

      50% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 16px rgba(74, 124, 247, 0.06), 0 0 32px rgba(168, 85, 247, 0.03);
      }

      50% {
        box-shadow: 0 0 24px rgba(74, 124, 247, 0.1), 0 0 48px rgba(168, 85, 247, 0.06);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 16px rgba(74, 124, 247, 0.06), 0 0 32px rgba(168, 85, 247, 0.03);
      }

      50% {
        box-shadow: 0 0 24px rgba(74, 124, 247, 0.1), 0 0 48px rgba(168, 85, 247, 0.06);
      }
    }

      0%   { transform: scaleY(1);   }
      100% { transform: scaleY(0.3); }

        grid-template-columns: 1fr !important;

        grid-row: auto !important;

        flex-wrap: wrap;
      }

        height: auto !important;
        min-height: 0 !important;

    .feed-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .feed-sidebar-desktop {
      width: 200px;
      flex-shrink: 0;
      position: sticky;
      top: 68px;
    }

    .feed-main {
      flex: 1;
      min-width: 0;
    }

    .mobile-filter-portal {
      display: none;
    }

    @media (max-width: 767px) {
      .feed-layout {
        display: block;
      }

      .feed-sidebar-desktop {
        display: none;

        padding: 0 0 32px;

        width: 160px;
      }

      .feed-layout {
        gap: 20px;
      }

      display: none;
    }

        display: block;

        width: 100% !important;

        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 16px 8px;
      }

                    style={{ padding: "4px 10px", borderRadius: 20, border: "1px solid #E5E7EB", background: "#F9FAFB", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = "#A5B4FC"; e.currentTarget.style.color = "#4F46E5"; e.currentTarget.style.background = "#EEF2FF"; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = "#E5E7EB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.background = "#F9FAFB"; }}
                  >{s}</button>
                ))}
              </div>
            )}
            {modifyApplied && (
              <Row sx={{ gap: 6, marginTop: 8 }}>
                <div style={{ width: 16, height: 16, borderRadius: 3, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg></div>
                <span style={{ fontSize: 12, fontWeight: 600, color: "#15803D" }}>Steps updated based on your instruction</span>
                <span onClick={() => { setModifyPrompt(""); setModifyApplied(false); }} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", marginLeft: 4, textDecoration: "underline", textUnderlineOffset: 2 }}>Undo</span>
              </Row>
            )}
          </div>

          {/* Steps */}
          <div style={{ padding: "14px 20px", overflowY: "auto", flex: 1 }}>
            <Row sx={{ justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <div style={{ fontSize: 12, fontWeight: 700, color: "#6B7280", textTransform: "uppercase", letterSpacing: "0.05em" }}>Steps</div>
              <span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF" }}>{modifySteps.length} steps</span>
            </Row>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {modifySteps.map((step, i) => {
                const isDragging = dragItem === i;
                const isDragOver = dragOverItem === i && dragItem !== i;
                return (
                  <div key={i}
                    draggable
                    onDragStart={() => setDragItem(i)}
                    onDragEnter={() => setDragOverItem(i)}
                    onDragOver={e => e.preventDefault()}
                    onDrop={() => { if (dragItem === null || dragItem === i) { setDragOverItem(null); return; } const s = [...modifySteps]; const dragged = s.splice(dragItem, 1)[0]; s.splice(i, 0, dragged); setModifySteps(s); setDragItem(null); setDragOverItem(null); }}
                    onDragEnd={() => { setDragItem(null); setDragOverItem(null); }}
                    style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 7, border: isDragOver ? "1.5px solid #4A7CF7" : "1px solid #F0F0F0", background: isDragOver ? "#EEF2FF" : isDragging ? "#F3F4F6" : "#FAFAFA", opacity: isDragging ? 0.45 : 1, cursor: "grab", transition: "border-color 0.12s, background 0.12s, opacity 0.12s" }}>
                    <div style={{ flexShrink: 0, color: "#C4C4C4", cursor: "grab", display: "flex", alignItems: "center", padding: "0 1px" }}>
                      <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                        <circle cx="3" cy="2" r="1.2" /><circle cx="7" cy="2" r="1.2" />
                        <circle cx="3" cy="7" r="1.2" /><circle cx="7" cy="7" r="1.2" />
                        <circle cx="3" cy="12" r="1.2" /><circle cx="7" cy="12" r="1.2" />
                      </svg>
                    </div>
                    <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB" }}>{i + 1}</div>
                    <span style={{ flex: 1, fontSize: 14, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{step}</span>
                    <button onClick={() => setModifySteps(modifySteps.filter((_, j) => j !== i))} style={{ width: 24, height: 24, borderRadius: 4, border: "1px solid #FECACA", background: "#FFF5F5", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }} onMouseEnter={e => e.currentTarget.style.background = "#FEE2E2"} onMouseLeave={e => e.currentTarget.style.background = "#FFF5F5"}>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#EF4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
                    </button>
                  </div>
                );
              })}
            </div>
            {addingStep ? (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, padding: "8px 10px", borderRadius: 7, border: "1.5px solid rgba(74,124,247,0.3)", background: "#FAFBFF" }}>
                <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: "#2563EB" }}>{modifySteps.length + 1}</div>
                <input autoFocus value={newStepText} onChange={e => setNewStepText(e.target.value)}
                  onKeyDown={e => { if (e.key === "Enter" && newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); setAddingStep(false); } if (e.key === "Escape") { setNewStepText(""); setAddingStep(false); } }}
                  placeholder="Describe the step..."
                  style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans }} />
                <button onClick={() => { if (newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); } setAddingStep(false); }} style={{ padding: "3px 10px", borderRadius: 4, border: "none", background: newStepText.trim() ? "#18181B" : "#F3F4F6", color: newStepText.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: sans }}>Add</button>
                <button onClick={() => { setNewStepText(""); setAddingStep(false); }} style={{ width: 22, height: 22, borderRadius: 4, border: "none", background: "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 12, color: "#9CA3AF" }}>{"\u2715"}</button>
              </div>
            ) : (
              <button onClick={() => setAddingStep(true)} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, padding: "7px 12px", borderRadius: 4, border: "1.5px dashed #D1D5DB", background: "transparent", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", width: "100%", fontFamily: sans }} onMouseEnter={e => { e.currentTarget.style.borderColor = "#9CA3AF"; e.currentTarget.style.color = "#374151"; }} onMouseLeave={e => { e.currentTarget.style.borderColor = "#D1D5DB"; e.currentTarget.style.color = "#6B7280"; }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                Add step
              </button>
            )}
          </div>

          {/* footer */}
          <div style={{ padding: "12px 20px 16px", borderTop: "1px solid #F5F5F5", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
            <Btn onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }}>Cancel</Btn>
            <Btn primary onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} sx={{ padding: "6px 16px" }}>Save</Btn>
          </div>
        </div>
      </>)
    }

    {/* Story Viewer — rendered at root to escape animation stacking contexts */}
    {activeStory && ReactDOM.createPortal(
      <div onClick={closeStory} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.82)", zIndex: 99999, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <div onClick={e => e.stopPropagation()} style={{ width: 360, maxWidth: "95vw", height: 580, borderRadius: 22, overflow: "hidden", position: "relative", boxShadow: "0 28px 70px rgba(0,0,0,0.55)", background: activeStory.gradient, display: "flex", flexDirection: "column" }}>
          {/* Progress bars */}
          <div style={{ position: "absolute", top: 14, left: 14, right: 14, display: "flex", gap: 4, zIndex: 10 }}>
            {activeStory.slides.map((_, i) => (
              <div key={i} style={{ flex: 1, height: 3, borderRadius: 2, background: i < storySlideIdx ? "rgba(255,255,255,0.95)" : i === storySlideIdx ? "rgba(255,255,255,0.7)" : "rgba(255,255,255,0.25)" }} />
            ))}
          </div>
          {/* Main content */}
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "56px 28px 16px", textAlign: "center" }}>
            <div style={{ fontSize: 66, marginBottom: 20, filter: "drop-shadow(0 4px 14px rgba(0,0,0,0.25))" }}>{activeStory.slides[storySlideIdx].emoji}</div>
            <div style={{ fontSize: 22, fontWeight: 800, color: "#FFF", fontFamily: sans, lineHeight: 1.3, marginBottom: 14, letterSpacing: "-0.02em", textAlign: "center" }}>{activeStory.slides[storySlideIdx].title}</div>
            <div style={{ fontSize: 14, fontWeight: 500, color: "rgba(255,255,255,0.9)", fontFamily: sans, lineHeight: 1.7, textAlign: "left", width: "100%", maxWidth: 300 }}>{activeStory.slides[storySlideIdx].body}</div>
          </div>
          {/* Links row — sits naturally above nav, inside gradient */}
          {activeStory.slides[storySlideIdx].links && activeStory.slides[storySlideIdx].links.length > 0 && (
            <div style={{ padding: "0 18px 14px", display: "flex", flexWrap: "wrap", gap: 7, justifyContent: "center", position: "relative", zIndex: 15 }}>
              {activeStory.slides[storySlideIdx].links.map((lnk, li) => (
                <span key={li} onClick={e => e.stopPropagation()} style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "7px 12px", borderRadius: 8, background: "rgba(0,0,0,0.22)", border: "1px solid rgba(255,255,255,0.18)", fontSize: 11, fontWeight: 600, color: "#FFF", cursor: "pointer", fontFamily: sans, letterSpacing: "0.01em" }}
                  onMouseEnter={e => e.currentTarget.style.background = "rgba(0,0,0,0.35)"}
                  onMouseLeave={e => e.currentTarget.style.background = "rgba(0,0,0,0.22)"}>
                  <span style={{ fontSize: 13 }}>{lnk.icon}</span>
                  {lnk.label}
                  <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg>
                </span>
              ))}
            </div>
          )}
          {/* Nav row — fixed at bottom, same height always */}
          <div style={{ padding: "10px 20px 22px", display: "flex", justifyContent: "space-between", position: "relative", zIndex: 15, flexShrink: 0 }}>
            <button onClick={prevStorySlide} style={{ background: storySlideIdx > 0 ? "rgba(255,255,255,0.22)" : "rgba(255,255,255,0.07)", border: "none", borderRadius: 99, padding: "8px 18px", fontSize: 11, fontWeight: 700, color: "#FFF", cursor: storySlideIdx > 0 ? "pointer" : "default", fontFamily: sans, opacity: storySlideIdx > 0 ? 1 : 0.3 }}>← Prev</button>
            <button onClick={nextStorySlide} style={{ background: "rgba(255,255,255,0.22)", border: "none", borderRadius: 99, padding: "8px 18px", fontSize: 11, fontWeight: 700, color: "#FFF", cursor: "pointer", fontFamily: sans }}>{storySlideIdx < activeStory.slides.length - 1 ? "Next →" : "Done ✓"}</button>
          </div>
          {/* Tap zones */}
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, bottom: 0, display: "flex", zIndex: 5, pointerEvents: "none" }}>
            <div onClick={prevStorySlide} style={{ flex: 1, cursor: storySlideIdx > 0 ? "pointer" : "default", pointerEvents: "auto" }} />
            <div onClick={nextStorySlide} style={{ flex: 1, cursor: "pointer", pointerEvents: "auto" }} />
          </div>
          {/* Audio player — single fill bar across entire story */}
          {(() => {
            const totalSlides = activeStory.slides.length;
            const slideProgress = audioDuration > 0 ? audioTime / audioDuration : 0;
            const overallPct = ((storySlideIdx + slideProgress) / totalSlides) * 100;
            return (
              <div onClick={e => e.stopPropagation()} style={{ position: "absolute", top: 30, left: 14, right: 64, zIndex: 20, background: "rgba(0,0,0,0.42)", backdropFilter: "blur(10px)", borderRadius: 99, height: 36, display: "flex", alignItems: "center", padding: "0 14px 0 5px", gap: 10 }}>
                {/* Play / Pause */}
                <button onClick={() => setVoiceEnabled(v => !v)} style={{ width: 28, height: 28, borderRadius: "50%", background: voiceEnabled ? "#F59E0B" : "rgba(255,255,255,0.18)", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "background 0.2s" }}>
                  {voiceEnabled
                    ? <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFF"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    : <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFF"><polygon points="5,3 19,12 5,21"/></svg>}
                </button>
                {/* Single progress bar across all slides */}
                <div style={{ flex: 1, height: 3, borderRadius: 2, background: "rgba(255,255,255,0.2)" }}>
                  <div style={{ height: "100%", borderRadius: 2, width: `${overallPct}%`, background: "#FFF", transition: "width 0.4s linear" }} />
                </div>
              </div>
            );
          })()}
          {/* Close */}
          <button onClick={closeStory} style={{ position: "absolute", top: 30, right: 14, zIndex: 20, background: "rgba(0,0,0,0.42)", backdropFilter: "blur(10px)", border: "none", borderRadius: "50%", width: 36, height: 36, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: "#FFF" }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
      </div>,
      document.body
    )}

    {/* Customize Modal */ }
    {
      showWidgetModal && <CustomizeModal
        draftOrder={draftOrder} setDraftOrder={setDraftOrder}
        draftSelected={draftSelected} setDraftSelected={setDraftSelected}
        widgetDragItem={widgetDragItem} setWidgetDragItem={setWidgetDragItem}
        widgetDragOver={widgetDragOver} setWidgetDragOver={setWidgetDragOver}
        visibleSections={visibleSections}
        sectionOrder={sectionOrder}
        onSave={(newVisible, newOrder) => { setVisibleSections(newVisible); setSectionOrder(newOrder); setShowWidgetModal(false); document.body.style.overflow = ""; document.body.style.paddingRight = ""; setDraftSelected(null); setDraftOrder(null); }}
        onClose={() => { setShowWidgetModal(false); document.body.style.overflow = ""; document.body.style.paddingRight = ""; setDraftSelected(null); setDraftOrder(null); }}
        sans={sans}
      />
    }
        </div >
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>

</html>
