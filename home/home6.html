                <div onClick={e => e.stopPropagation()} style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 500, maxWidth: "93vw", maxHeight: "90vh", background: "#FFF", borderRadius: 16, boxShadow: "0 28px 60px rgba(0,0,0,0.22), 0 6px 18px rgba(0,0,0,0.1)", zIndex: 50, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                  {/* Header */}
                  <div style={{ padding: "16px 20px 14px", borderBottom: "1px solid #F0F0F0", display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                    <div style={{ width: 34, height: 34, borderRadius: 9, background: accentBg, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={accentColor} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                        {isEmail ? <><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" /><polyline points="22,6 12,13 2,6" /></> : <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />}
                      </svg>
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 700, color: "#18181B" }}>Review &amp; {isEmail ? "send email" : "send message"}</div>
                      <div style={{ fontSize: 12, color: "#9CA3AF", marginTop: 2 }}>AI-drafted · all fields are editable</div>
                    </div>
                    <button onClick={skipStep} style={{ width: 28, height: 28, borderRadius: 6, border: "1px solid #E5E7EB", background: "#FAFAFA", color: "#6B7280", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 16, fontFamily: "inherit", lineHeight: 1 }}>×</button>
                  </div>
                  {/* Scrollable fields */}
                  <div style={{ padding: "16px 20px", overflowY: "auto", flex: 1 }}>
                    {/* To: dropdown */}
                    <div style={{ marginBottom: 14 }}>
                      <label style={{ fontSize: 12, fontWeight: 700, color: "#9CA3AF", letterSpacing: "0.06em", display: "block", marginBottom: 6 }}>{isEmail ? "To" : "Send to"}</label>
                      <div style={{ position: "relative" }}>
                        <select
                          value={selectedContact}
                          onChange={e => setSelectedContact(Number(e.target.value))}
                          style={{ width: "100%", padding: "9px 34px 9px 12px", borderRadius: 8, border: "1.5px solid #E5E7EB", fontSize: 14, fontWeight: 600, color: "#374151", background: "#FAFAFA", fontFamily: "inherit", outline: "none", cursor: "pointer", appearance: "none", WebkitAppearance: "none" }}
                        >
                          {contactOptions.map((opt, i) => (
                            <option key={i} value={i}>{opt.display}</option>
                          ))}
                        </select>
                        <svg style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", pointerEvents: "none" }} width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="6,9 12,15 18,9" /></svg>
                      </div>
                    </div>
                    {/* Subject — email only */}
                    {isEmail && (
                      <div style={{ marginBottom: 14 }}>
                        <label style={{ fontSize: 12, fontWeight: 700, color: "#9CA3AF", letterSpacing: "0.06em", display: "block", marginBottom: 6 }}>Subject</label>
                        <input
                          type="text"
                          value={currentSubject}
                          onChange={e => setDraftSubject(e.target.value)}
                          style={{ width: "100%", padding: "9px 12px", borderRadius: 8, border: "1.5px solid #E5E7EB", fontSize: 14, fontWeight: 500, color: "#374151", background: "#FFF", fontFamily: "inherit", outline: "none", boxSizing: "border-box" }}
                        />
                      </div>
                    )}
                    {/* Message body - always editable */}
                    <div>
                      <label style={{ fontSize: 12, fontWeight: 700, color: "#9CA3AF", letterSpacing: "0.06em", display: "block", marginBottom: 6 }}>Message</label>
                      <textarea
                        value={currentBody}
                        onChange={e => setDraftBody(e.target.value)}
                        autoFocus
                        style={{ width: "100%", fontSize: 14, color: "#374151", lineHeight: 1.65, background: "#FFF", border: "1.5px solid #E5E7EB", borderRadius: 8, padding: "10px 12px", resize: "vertical", minHeight: 130, fontFamily: "inherit", outline: "none", display: "block", boxSizing: "border-box" }}
                      />
                      {step.action.vehicle && (
                        <div style={{ marginTop: 8, display: "flex", alignItems: "center", gap: 6 }}>
                          <span style={{ fontSize: 12, color: "#9CA3AF", fontWeight: 500 }}>Linked:</span>
                          <span style={{ display: "inline-flex", alignItems: "center", gap: 4, padding: "3px 8px", borderRadius: 5, background: "#F0F7FF", border: "1px solid #BFDBFE", fontSize: 12, fontWeight: 600, color: "#2563EB", cursor: "pointer" }}>
                            🚗 {step.action.vehicle.name}
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#60A5FA" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6" /><polyline points="15,3 21,3 21,9" /><line x1="10" y1="14" x2="21" y2="3" /></svg>
                          </span>
                        </div>
                      )}
                    </div>
                  </div>
                  {/* Footer */}
                  <div style={{ padding: "12px 20px 18px", borderTop: "1px solid #F0F0F0", display: "flex", gap: 10, flexShrink: 0 }}>
                    <button onClick={confirmSend} style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 7, padding: "11px 0", borderRadius: 9, background: "linear-gradient(135deg,#4A7CF7,#A855F7)", color: "#FFF", border: "none", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "inherit" }}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
                      {isEmail ? "Send email" : "Send message"}
                    </button>
                    <button onClick={skipStep} style={{ padding: "11px 20px", borderRadius: 9, border: "1px solid #E5E7EB", background: "#FFF", color: "#6B7280", fontSize: 14, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>Skip</button>
                  </div>
                </div>
              </>);
            })()
          }
          {/* Modify Modal */}
          {
            showModifyModal && (<>
              <div onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.3)", zIndex: 49, backdropFilter: "blur(2px)" }} />
              <div style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 520, maxWidth: "92vw", maxHeight: "88vh", background: "#FFF", borderRadius: 12, boxShadow: "0 20px 48px rgba(0,0,0,0.18), 0 6px 16px rgba(0,0,0,0.08)", zIndex: 50, overflow: "hidden", display: "flex", flexDirection: "column" }}>
                {/* header */}
                <div style={{ padding: "16px 20px 14px", borderBottom: "1px solid #F0F0F0", flexShrink: 0 }}>
                  <Row sx={{ justifyContent: "space-between", alignItems: "center" }}>
                    <Row sx={{ gap: 8 }}>
                      <div style={{ width: 28, height: 28, borderRadius: 6, background: aiGrad, display: "flex", alignItems: "center", justifyContent: "center" }}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
                      </div>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 700, color: "#18181B" }}>Modify with AI</div>
                        <div style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF", marginTop: 1 }}>Describe what to change. AI will update the steps</div>
                      </div>
                    </Row>
                    <span onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} style={{ width: 28, height: 28, display: "flex", alignItems: "center", justifyContent: "center", borderRadius: 6, background: "#F3F4F6", cursor: "pointer", fontSize: 14, color: "#6B7280", fontWeight: 600 }}>{"\u2715"}</span>
                  </Row>
                </div>

                {/* AI prompt */}
                <div style={{ padding: "14px 20px 12px", borderBottom: "1px solid #F5F5F5", flexShrink: 0, background: modifyPromptFocused ? "#FAFBFF" : "#FFF", transition: "background 0.3s" }}>
                  <div style={{ borderRadius: 8, border: modifyPromptFocused ? "1.5px solid rgba(74,124,247,0.4)" : "1.5px solid #E5E7EB", boxShadow: modifyPromptFocused ? "0 0 0 3px rgba(74,124,247,0.08)" : "none", transition: "all 0.25s", background: "#FFF", padding: "10px 12px", display: "flex", alignItems: "flex-start", gap: 10 }}>
                    <textarea
                      value={modifyPrompt}
                      onChange={e => { setModifyPrompt(e.target.value); setModifyApplied(false); }}
                      onFocus={() => setModifyPromptFocused(true)}
                      onBlur={() => setModifyPromptFocused(false)}
                      rows={2}
                      placeholder="e.g. Skip notifying the customer, add a manager approval step first..."
                      style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans, resize: "none", lineHeight: 1.55, padding: 0 }}
                    />
                    <button
                      onClick={() => { if (!modifyPrompt.trim()) return; setModifyThinking(true); setTimeout(() => { setModifyThinking(false); setModifyApplied(true); }, 1600); }}
                      disabled={!modifyPrompt.trim() || modifyThinking}
                      style={{ flexShrink: 0, padding: "5px 12px", borderRadius: 5, border: "none", background: modifyPrompt.trim() ? aiGrad : "#F3F4F6", color: modifyPrompt.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: modifyPrompt.trim() ? "pointer" : "default", fontFamily: sans, display: "flex", alignItems: "center", gap: 5, transition: "all 0.2s", marginTop: 1 }}>
                      {modifyThinking ? (<><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ animation: "spin 1s linear infinite" }}><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83" /></svg>Thinking</>) : "Apply"}
                    </button>
                  </div>
                  {!modifyApplied && (
                    <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                      {["Remove customer notification", "Add manager approval first", "Simplify to 2 steps", "Add a loaner car step"].map((s, i) => (
                        <button key={i} onClick={() => { setModifyPrompt(s); setModifyApplied(false); }}
                          style={{ padding: "4px 10px", borderRadius: 20, border: "1px solid #E5E7EB", background: "#F9FAFB", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", fontFamily: sans }}
                          onMouseEnter={e => { e.currentTarget.style.borderColor = "#A5B4FC"; e.currentTarget.style.color = "#4F46E5"; e.currentTarget.style.background = "#EEF2FF"; }}
                          onMouseLeave={e => { e.currentTarget.style.borderColor = "#E5E7EB"; e.currentTarget.style.color = "#6B7280"; e.currentTarget.style.background = "#F9FAFB"; }}
                        >{s}</button>
                      ))}
                    </div>
                  )}
                  {modifyApplied && (
                    <Row sx={{ gap: 6, marginTop: 8 }}>
                      <div style={{ width: 16, height: 16, borderRadius: 3, background: "#D1FAE5", display: "flex", alignItems: "center", justifyContent: "center" }}><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#15803D" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg></div>
                      <span style={{ fontSize: 12, fontWeight: 600, color: "#15803D" }}>Steps updated based on your instruction</span>
                      <span onClick={() => { setModifyPrompt(""); setModifyApplied(false); }} style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", cursor: "pointer", marginLeft: 4, textDecoration: "underline", textUnderlineOffset: 2 }}>Undo</span>
                    </Row>
                  )}
                </div>

                {/* Steps */}
                <div style={{ padding: "14px 20px", overflowY: "auto", flex: 1 }}>
                  <Row sx={{ justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "#6B7280", letterSpacing: "0.05em" }}>Steps</div>
                    <span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF" }}>{modifySteps.length} steps</span>
                  </Row>
                  <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    {modifySteps.map((step, i) => {
                      const isDragging = dragItem === i;
                      const isDragOver = dragOverItem === i && dragItem !== i;
                      return (
                        <div key={i}
                          draggable
                          onDragStart={() => setDragItem(i)}
                          onDragEnter={() => setDragOverItem(i)}
                          onDragOver={e => e.preventDefault()}
                          onDrop={() => { if (dragItem === null || dragItem === i) { setDragOverItem(null); return; } const s = [...modifySteps]; const dragged = s.splice(dragItem, 1)[0]; s.splice(i, 0, dragged); setModifySteps(s); setDragItem(null); setDragOverItem(null); }}
                          onDragEnd={() => { setDragItem(null); setDragOverItem(null); }}
                          style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px", borderRadius: 7, border: isDragOver ? "1.5px solid #4A7CF7" : "1px solid #F0F0F0", background: isDragOver ? "#EEF2FF" : isDragging ? "#F3F4F6" : "#FAFAFA", opacity: isDragging ? 0.45 : 1, cursor: "grab", transition: "border-color 0.12s, background 0.12s, opacity 0.12s" }}>
                          <div style={{ flexShrink: 0, color: "#C4C4C4", cursor: "grab", display: "flex", alignItems: "center", padding: "0 1px" }}>
                            <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor">
                              <circle cx="3" cy="2" r="1.2" /><circle cx="7" cy="2" r="1.2" />
                              <circle cx="3" cy="7" r="1.2" /><circle cx="7" cy="7" r="1.2" />
                              <circle cx="3" cy="12" r="1.2" /><circle cx="7" cy="12" r="1.2" />
                            </svg>
                          </div>
                          <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: "#2563EB" }}>{i + 1}</div>
                          <span style={{ flex: 1, fontSize: 14, fontWeight: 500, color: "#374151", lineHeight: 1.45 }}>{typeof step === "object" ? step.text : step}</span>
                          <button onClick={() => setModifySteps(modifySteps.filter((_, j) => j !== i))} style={{ width: 24, height: 24, borderRadius: 4, border: "1px solid #FECACA", background: "#FFF5F5", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0 }} onMouseEnter={e => e.currentTarget.style.background = "#FEE2E2"} onMouseLeave={e => e.currentTarget.style.background = "#FFF5F5"}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#EF4444" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6L6 18M6 6l12 12" /></svg>
                          </button>
                        </div>
                      );
                    })}
                  </div>
                  {addingStep ? (
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, padding: "8px 10px", borderRadius: 7, border: "1.5px solid rgba(74,124,247,0.3)", background: "#FAFBFF" }}>
                      <div style={{ width: 20, height: 20, borderRadius: 4, flexShrink: 0, background: "#EFF6FF", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 800, color: "#2563EB" }}>{modifySteps.length + 1}</div>
                      <input autoFocus value={newStepText} onChange={e => setNewStepText(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter" && newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); setAddingStep(false); } if (e.key === "Escape") { setNewStepText(""); setAddingStep(false); } }}
                        placeholder="Describe the step..."
                        style={{ flex: 1, border: "none", outline: "none", background: "transparent", fontSize: 14, fontWeight: 500, color: "#18181B", fontFamily: sans }} />
                      <button onClick={() => { if (newStepText.trim()) { setModifySteps([...modifySteps, newStepText.trim()]); setNewStepText(""); } setAddingStep(false); }} style={{ padding: "3px 10px", borderRadius: 4, border: "none", background: newStepText.trim() ? "#18181B" : "#F3F4F6", color: newStepText.trim() ? "#FFF" : "#9CA3AF", fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: sans }}>Add</button>
                      <button onClick={() => { setNewStepText(""); setAddingStep(false); }} style={{ width: 22, height: 22, borderRadius: 4, border: "none", background: "#F3F4F6", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", fontSize: 12, color: "#9CA3AF" }}>{"\u2715"}</button>
                    </div>
                  ) : (
                    <button onClick={() => setAddingStep(true)} style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 8, padding: "7px 12px", borderRadius: 4, border: "1.5px dashed #D1D5DB", background: "transparent", fontSize: 12, fontWeight: 600, color: "#6B7280", cursor: "pointer", width: "100%", fontFamily: sans }} onMouseEnter={e => { e.currentTarget.style.borderColor = "#9CA3AF"; e.currentTarget.style.color = "#374151"; }} onMouseLeave={e => { e.currentTarget.style.borderColor = "#D1D5DB"; e.currentTarget.style.color = "#6B7280"; }}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14M5 12h14" /></svg>
                      Add step
                    </button>
                  )}
                </div>

                {/* footer */}
                <div style={{ padding: "12px 20px 16px", borderTop: "1px solid #F5F5F5", background: "#FAFAFA", display: "flex", gap: 8, justifyContent: "flex-end", flexShrink: 0 }}>
                  <Btn onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }}>Cancel</Btn>
                  <Btn primary onClick={() => { setShowModifyModal(false); setModifyPrompt(""); setModifyApplied(false); }} sx={{ padding: "6px 16px" }}>Save</Btn>
                </div>
              </div>
            </>)
          }

          {/* Story Viewer — rendered at root to escape animation stacking contexts */}
          {activeStory && ReactDOM.createPortal(
            <div style={{ position: "fixed", inset: 0, zIndex: 99999, background: "rgba(0,0,0,0.55)", backdropFilter: "blur(4px)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              {/* Phone-frame card */}
              <div style={{
                width: isMobile ? "100vw" : 390,
                height: isMobile ? "100dvh" : "min(820px, 96vh)",
                position: "relative", overflow: "hidden",
                background: activeStory.gradient,
                borderRadius: isMobile ? 0 : 32,
                boxShadow: "0 40px 100px rgba(0,0,0,0.8)",
                display: "flex", flexDirection: "column",
                transition: "background 0.5s ease",
              }}>

                {/* ── Top controls: [Play/Pause · Mute] LEFT · [Close] RIGHT ── */}
                <div onClick={e => e.stopPropagation()} style={{ position: "absolute", top: 32, left: 16, right: 16, display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 30 }}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button onClick={() => setVoiceEnabled(v => !v)} style={{ width: 36, height: 36, borderRadius: "50%", background: voiceEnabled ? "rgba(245,158,11,0.85)" : "rgba(255,255,255,0.18)", backdropFilter: "blur(12px)", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, transition: "background 0.2s" }}>
                      {voiceEnabled
                        ? <svg width="10" height="10" viewBox="0 0 24 24" fill="#FFF"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
                        : <svg width="11" height="11" viewBox="0 0 24 24" fill="#FFF"><polygon points="5,3 19,12 5,21" /></svg>}
                    </button>
                    <button onClick={() => setIsMuted(v => !v)} style={{ width: 36, height: 36, borderRadius: "50%", background: isMuted ? "rgba(255,255,255,0.35)" : "rgba(255,255,255,0.18)", backdropFilter: "blur(12px)", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", transition: "background 0.2s" }}>
                      {isMuted
                        ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
                        : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>}
                    </button>
                  </div>
                  <button onClick={closeStory} style={{ width: 36, height: 36, borderRadius: "50%", background: "rgba(255,255,255,0.18)", backdropFilter: "blur(12px)", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
                  </button>
                </div>

                {/* ── Progress bars: intro (bar 0) + N content slides = N+1 total ── */}
                <div style={{ position: "absolute", top: 14, left: 14, right: 14, display: "flex", gap: 3, zIndex: 30 }}>
                  {Array.from({ length: activeStory.slides.length + 1 }, (_, i) => {
                    const sp = audioDuration > 0 ? audioTime / audioDuration : 0;
                    let pct;
                    if (i === 0) {
                      // intro bar: fills during intro audio, full once past intro
                      pct = showIntroSlide ? sp * 100 : 100;
                    } else {
                      const si = i - 1;
                      pct = showIntroSlide ? 0 : si < storySlideIdx ? 100 : si === storySlideIdx ? sp * 100 : 0;
                    }
                    return (
                      <div key={i} style={{ flex: 1, height: 2.5, borderRadius: 2, background: "rgba(255,255,255,0.28)" }}>
                        <div style={{ height: "100%", borderRadius: 2, width: `${pct}%`, background: "#FFF", transition: "width 0.4s linear" }} />
                      </div>
                    );
                  })}
                </div>

                {/* ── INTRO SLIDE ── */}
                {showIntroSlide ? (
                  <div style={{ flex: 1, position: "relative", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "80px 36px 80px", textAlign: "center" }}>
                    <div style={{ fontSize: 84, marginBottom: 28, filter: "drop-shadow(0 8px 40px rgba(0,0,0,0.35))" }}>{activeStory.icon}</div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "rgba(255,255,255,0.6)", letterSpacing: "0.14em", marginBottom: 12, fontFamily: sans }}>Daily Brief</div>
                    <div style={{ fontSize: 26, fontWeight: 800, color: "#FFF", lineHeight: 1.15, letterSpacing: "-0.025em", marginBottom: 8, fontFamily: sans }}>{activeStory.label}</div>
                    <div style={{ fontSize: 14, color: "rgba(255,255,255,0.6)", fontWeight: 500, fontFamily: sans }}>{activeStory.slides.length} insights</div>
                    <div style={{ position: "absolute", bottom: 28, left: 0, right: 0, textAlign: "center", fontSize: 12, color: "rgba(255,255,255,0.45)", fontWeight: 500, fontFamily: sans }}>Generated at {activeStory.time}</div>
                  </div>
                ) : (
                  /* ── CONTENT SLIDE ── */
                  (() => {
                    const slide = activeStory.slides[storySlideIdx];
                    if (!slide) return null;
                    const hasLinks = slide.links?.length > 0;
                    return (
                      <div key={storySlideIdx} className="story-slide-card" style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "flex-start", padding: `108px 28px ${hasLinks ? 188 : 48}px` }}>
                        <div style={{ fontSize: 44, marginBottom: 24, filter: "drop-shadow(0 2px 12px rgba(0,0,0,0.3))" }}>{slide.emoji}</div>
                        <div style={{ fontSize: 20, fontWeight: 900, color: "#FFF", fontFamily: sans, lineHeight: 1.1, marginBottom: 16, letterSpacing: "-0.035em", textShadow: "0 2px 20px rgba(0,0,0,0.3)" }}>{slide.title}</div>
                        <div style={{ fontSize: 16, fontWeight: 500, color: "rgba(255,255,255,0.92)", fontFamily: sans, lineHeight: 1.75, textShadow: "0 1px 8px rgba(0,0,0,0.25)", whiteSpace: "pre-line" }}>{slide.body}</div>
                      </div>
                    );
                  })()
                )}

                {/* ── CTAs pinned to bottom (content slides only) ── */}
                {!showIntroSlide && activeStory.slides[storySlideIdx]?.links?.length > 0 && (
                  <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "48px 16px 48px", background: "linear-gradient(to bottom, transparent, rgba(0,0,0,0.32))", display: "flex", flexDirection: "column", gap: 8, zIndex: 15 }}>
                    {activeStory.slides[storySlideIdx]?.links.map((lnk, li) => (
                      <div key={li} onClick={e => e.stopPropagation()} style={{ display: "flex", alignItems: "center", gap: 10, padding: "13px 14px", borderRadius: 14, background: "rgba(255,255,255,0.14)", backdropFilter: "blur(16px)", border: "1px solid rgba(255,255,255,0.2)", cursor: "pointer", transition: "background 0.18s" }}
                        onMouseEnter={e => e.currentTarget.style.background = "rgba(255,255,255,0.26)"}
                        onMouseLeave={e => e.currentTarget.style.background = "rgba(255,255,255,0.14)"}>
                        <div style={{ width: 32, height: 32, borderRadius: 8, background: "rgba(255,255,255,0.15)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16, flexShrink: 0 }}>{lnk.icon}</div>
                        <span style={{ flex: 1, fontSize: 14, fontWeight: 600, color: "#FFF", fontFamily: sans, textAlign: "left" }}>{lnk.label}</span>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7,7 17,7 17,17" /></svg>
                      </div>
                    ))}
                  </div>
                )}

                {/* ── Hold-to-pause dim overlay ── */}
                {isHolding && (
                  <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,0.28)", zIndex: 6, pointerEvents: "none", display: "flex", alignItems: "center", justifyContent: "center" }}>
                    <svg width="36" height="36" viewBox="0 0 24 24" fill="rgba(255,255,255,0.7)"><rect x="6" y="4" width="4" height="16" rx="1" /><rect x="14" y="4" width="4" height="16" rx="1" /></svg>
                  </div>
                )}

                {/* ── Tap zones (behind all controls) ── */}
                <div onMouseDown={onStoryPointerDown} onMouseUp={onStoryPointerUp} onMouseLeave={onStoryPointerUp} onTouchStart={onStoryPointerDown} onTouchEnd={onStoryPointerUp} onTouchCancel={onStoryPointerUp} style={{ position: "absolute", inset: 0, display: "flex", zIndex: 5 }}>
                  <div onClick={() => { if (!isHoldingRef.current) prevStorySlide(); }} style={{ width: "25%", cursor: "pointer" }} />
                  <div style={{ flex: 1 }} />
                  <div onClick={() => { if (!isHoldingRef.current) nextStorySlide(); }} style={{ width: "25%", cursor: "pointer" }} />
                </div>
              </div>
            </div>,
            document.body
          )}

          {/* Customize Modal */}
          {
            showWidgetModal && <CustomizeModal
              draftOrder={draftOrder} setDraftOrder={setDraftOrder}
              draftSelected={draftSelected} setDraftSelected={setDraftSelected}
              widgetDragItem={widgetDragItem} setWidgetDragItem={setWidgetDragItem}
              widgetDragOver={widgetDragOver} setWidgetDragOver={setWidgetDragOver}
              visibleSections={visibleSections}
              sectionOrder={sectionOrder}
              onSave={(newVisible, newOrder) => { setVisibleSections(newVisible); setSectionOrder(newOrder); setShowWidgetModal(false); document.body.style.overflow = ""; document.body.style.paddingRight = ""; setDraftSelected(null); setDraftOrder(null); }}
              onClose={() => { setShowWidgetModal(false); document.body.style.overflow = ""; document.body.style.paddingRight = ""; setDraftSelected(null); setDraftOrder(null); }}
              sans={sans}
            />
          }
        </div >
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>

</html>
