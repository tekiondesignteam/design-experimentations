<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T1 Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script>
    (function () {
      var _w = console.warn;
      console.warn = function () {
        if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].indexOf('in-browser Babel') > -1) return;
        return _w.apply(console, arguments);
      };
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <style>
    :root {
      --primitive-color-ai-primary-start: #4A7CF7;
      --primitive-color-ai-primary-end: #A855F7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      -webkit-font-smoothing: antialiased;
    }

    /* ── Base interactions ── */
    button {
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:not(.filter-fab):active {
      transform: scale(0.96) !important;
    }

    /* ── Page load — clean top-to-bottom cascade ── */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-header {
      animation: fadeUp 0.45s ease both;
    }

    .logo-entrance {
      animation: fadeUp 0.5s ease 0.1s both;
    }

    .greeting-entrance {
      animation: fadeUp 0.5s ease 0.25s both;
    }

    .narrative-entrance {
      animation: fadeUp 0.5s ease 0.4s both;
    }

    .prompt-entrance {
      animation: fadeUp 0.5s ease 0.55s both;
    }

    .chip-entrance {
      animation: fadeUp 0.45s ease both;
    }

    .quick-actions-entrance {
      animation: fadeUp 0.45s ease 0.72s both;
    }

    .qa-desktop-entrance {
      animation: fadeUp 0.45s ease 0.45s both;
    }

    /* ── Card hover lift ── */
    .card-hover {
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease !important;
    }

    .card-hover:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07) !important;
      border-color: #D0D5DD !important;
    }

    /* ── Recent-item card wrapper hover ── */
    .recent-card {
      border-radius: 8px;
      padding: 5px;
      background: #FFF;
      border: 1px solid #E5E7EB;
      transition: border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .recent-card:hover {
      background: #EFF6FF;
      border-color: #BFDBFE;
    }

    .recent-card .redirect-icon {
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .recent-card:hover .redirect-icon {
      opacity: 1;
    }

    /* ── Chip hover ── */
    .prompt-chip {
      transition: all 0.15s ease !important;
    }

    .prompt-chip:hover {
      border-color: #C0C0C0 !important;
      color: #18181B !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
      transform: translateY(-1px);
    }

    .prompt-chip:active {
      transform: translateY(0) scale(0.97) !important;
    }

    /* ── List item hover ── */
    .list-row {
      transition: background 0.15s ease;
      border-radius: 4px;
      margin: 0 -4px;
      padding-left: 4px !important;
      padding-right: 4px !important;
    }

    .list-row:hover {
      background: #FAFAFA;
    }

    /* ── Icon button hover ── */
    .icon-btn {
      transition: all 0.15s ease !important;
    }

    .icon-btn:hover {
      border-color: #C0C0C0 !important;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08) !important;
      transform: translateY(-1px);
    }

    .alert-entrance {
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .briefs-entrance {
      animation: fadeUp 0.5s ease 0.65s both;
    }

    .brief-tooltip {
      position: relative;
    }
    .brief-tooltip::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 2px);
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-top: 5px solid #18181B;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 1000;
    }
    .brief-tooltip::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: #18181B;
      color: #FFF;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
      padding: 5px 9px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 999;
    }
    .brief-tooltip:hover::before,
    .brief-tooltip:hover::after {
      opacity: 1;
    }

    @keyframes slideCardIn {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .story-slide-card {
      animation: slideCardIn 0.38s cubic-bezier(0.22,1,0.36,1) both;
    }

    .divider-entrance {
      animation: fadeUp 0.5s ease 0.75s both;
    }

    .feed-entrance {
      animation: fadeUp 0.55s ease 0.9s both;
    }

    .section-entrance {
      animation: fadeUp 0.4s ease both;
    }

    .card-enter {
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.45s ease forwards;
    }

    /* ── Existing ── */
    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.3;
      }

      50% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    @keyframes audioPulse {
      from {
        transform: scaleY(0.2);
      }

      to {
        transform: scaleY(1);
      }
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes gradientShift {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -400px 0;
      }

      100% {
        background-position: 400px 0;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 16px rgba(74, 124, 247, 0.06), 0 0 32px rgba(168, 85, 247, 0.03);
      }

      50% {
        box-shadow: 0 0 24px rgba(74, 124, 247, 0.1), 0 0 48px rgba(168, 85, 247, 0.06);
      }
    }

    /* ── glowPulse ── */
    @keyframes glowPulse {

      0%,
      100% {
        box-shadow: 0 0 16px rgba(74, 124, 247, 0.06), 0 0 32px rgba(168, 85, 247, 0.03);
      }

      50% {
        box-shadow: 0 0 24px rgba(74, 124, 247, 0.1), 0 0 48px rgba(168, 85, 247, 0.06);
      }
    }

    @keyframes audioBar {
      0% {
        transform: scaleY(1);
      }

      100% {
        transform: scaleY(0.3);
      }
    }

    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-track {
      display: flex;
      width: max-content;
      animation: ticker-scroll 28s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }

    /* ── Responsive 2-col grids ── */
    @media (max-width: 600px) {

      .appt-grid,
      .two-col-grid {
        grid-template-columns: 1fr !important;
      }
    }

    /* mobile */
    @media (max-width: 767px) {
      .bento-glance {
        grid-template-columns: 1fr !important;
      }

      .bento-glance>* {
        grid-column: 1 / -1 !important;
        grid-row: auto !important;
      }

      .alert-act {
        flex-wrap: wrap;
      }

      .alert-split {
        grid-template-columns: 1fr !important;
        height: auto !important;
        min-height: 0 !important;
      }

      .alert-split>div {
        border-right: none !important;
      }

      .main-wrap {
        padding: 0px 16px 48px !important;
      }

      .section-entrance {
        margin-bottom: 28px;
      }

      .new-suggestions-btn {
        margin-left: 0 !important;
        flex-basis: 100%;
      }

      .carryover-grid {
        grid-template-columns: 1fr !important;
      }

      .bucket-grid {
        grid-template-columns: 1fr 1fr !important;
        row-gap: 16px !important;
      }

      .bucket-item {
        padding: 0 8px !important;
      }

      .bucket-item-0 {
        padding-left: 0 !important;
      }

      .bucket-item-1 {
        border-right: none !important;
      }

      .bucket-item-2 {
        padding-left: 0 !important;
        border-right: 1px solid #F0F0F0 !important;
      }

      .bucket-item-3 {
        border-right: none !important;
      }
    }

    /* tablet */
    @media (min-width: 768px) and (max-width: 1023px) {
      .main-wrap {
        padding: 28px 24px 44px !important;
        max-width: 960px !important;
      }
    }

    /* ── Feed layout ── */
    .feed-layout {
      display: flex;
      gap: 32px;
      align-items: flex-start;
    }

    .feed-sidebar-desktop {
      width: 200px;
      flex-shrink: 0;
      position: sticky;
      top: 68px;
    }

    .feed-main {
      flex: 1;
      min-width: 0;
    }

    /* Mobile filter portal */
    .mobile-filter-portal {
      display: none;
    }

    @media (max-width: 767px) {
      .feed-layout {
        display: block;
      }

      .feed-sidebar-desktop {
        display: none;
      }

      .mobile-filter-portal {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(3px);
      }

      .mobile-filter-sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: #FFF;
        border-radius: 20px 20px 0 0;
        max-height: 85vh;
        overflow-y: auto;
        padding: 0 0 32px;
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.12);
      }
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .feed-sidebar-desktop {
        width: 160px;
      }

      .feed-layout {
        gap: 20px;
      }
    }

    /* FAB filter button — hidden on desktop */
    .filter-fab {
      display: none;
    }

    /* Mobile: stack layout, hide sidebar, show FAB */
    @media (max-width: 767px) {
      .feed-layout {
        display: block;
      }

      .feed-sidebar {
        position: fixed !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 9999 !important;
        background: rgba(0, 0, 0, 0.4) !important;
        backdrop-filter: blur(3px) !important;
        display: none !important;
        align-items: flex-end !important;
        justify-content: center !important;
        top: 0 !important;
        left: 0 !important;
      }

      .feed-sidebar.open {
        display: flex !important;
      }

      .feed-sidebar-inner {
        display: flex !important;
        flex-direction: column !important;
        background: #FFF !important;
        border-radius: 20px 20px 0 0 !important;
        width: 100% !important;
        max-height: 85vh !important;
        overflow-y: auto !important;
        padding: 0 0 32px !important;
        box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.12) !important;
      }

      .drag-handle-bar {
        display: flex !important;
      }

      .desktop-card {
        background: transparent !important;
        border: none !important;
        border-radius: 0 !important;
        padding: 0 !important;
      }

      /* filter-fab removed on mobile */
    }

    .filter-mobile-header {
      display: none;
    }

    .huddle-cta-row {
      display: none;
    }

    @media (max-width: 767px) {
      .huddle-cta-row {
        display: block;
        padding: 0 16px 14px;
      }

      .huddle-cta-inline {
        display: none !important;
      }
    }

    @media (max-width: 767px) {
      .filter-mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 16px 8px;
      }
    }
  </style>

  <!-- ── Nav-top & Nav-left styles (from lead-details) ── -->
  <style>
    :root {
      --bg-dark: #3F4757;
      --bg-dark-border: #152532;
      --primary-teal: #00BFA5;
      --text-white: #FFFFFF;
      --text-gray: #969AA3;
      --sidebar-width: 64px;
      --header-height: 56px;
      --left-panel-width: 240px;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: 'Proxima Nova', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* ── Nav-top (Header) ── */
    .tk-header {
      height: var(--header-height);
      background-color: var(--bg-dark);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--bg-dark-border);
      justify-content: space-between;
      flex-shrink: 0;
    }

    .tk-header-left {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-left: 4px;
    }

    .tk-app-launcher {
      cursor: pointer;
      width: 24px;
      height: 24px;
    }

    .tk-logo {
      height: 16px;
      color: var(--primary-teal);
    }

    .tk-search-container {
      flex: 0 1 480px;
      margin: 0 24px;
      position: relative;
    }

    .tk-search-input-wrapper {
      background: white;
      border-radius: 4px;
      height: 32px;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }

    .tk-search-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
    }

    .tk-search-icon path {
      fill: #969AA3;
    }

    .tk-search-input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 13px;
      color: #333;
    }

    .tk-search-input::placeholder {
      color: #999;
    }

    .tk-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-white);
    }

    .tk-get-help {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .tk-icon-btn {
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .tk-icon-btn:hover {
      opacity: 1;
    }

    .tk-user-profile {
      display: flex;
      align-items: center;
      background: #5E6C7C;
      border-radius: 4px;
      height: 40px;
      cursor: pointer;
    }

    .tk-profile-initials-box {
      background: #798696;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border-radius: 4px 0 0 4px;
      color: white;
      font-size: 13px;
    }

    .tk-profile-info {
      padding: 0 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
    }

    .tk-profile-name {
      font-size: 13px;
      font-weight: 600;
    }

    .tk-profile-sub {
      font-size: 11px;
      opacity: 0.7;
    }

    .tk-profile-arrow {
      margin-right: 8px;
    }

    /* ── Workspace (sidebar + content) ── */
    .tk-workspace {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Nav-left (Sidebar) ── */
    .tk-sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      border-right: 1px solid var(--bg-dark-border);
      flex-shrink: 0;
    }

    .tk-nav-item {
      width: 40px;
      height: 40px;
      display: flex;
      flex-direction: column;
      margin-bottom: 24px;
      cursor: pointer;
      position: relative;
    }

    .tk-nav-tile {
      width: 40px;
      height: 36px;
      background-color: #6F7884;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      border-radius: 2px 2px 0 0;
      transition: background-color 0.2s;
    }

    .tk-nav-item:hover .tk-nav-tile {
      background-color: #7B8694;
    }

    .tk-nav-indicator {
      width: 40px;
      height: 4px;
      border-radius: 0 0 2px 2px;
    }

    .tk-ind-pink {
      background-color: #FEEAE6;
    }

    .tk-ind-teal {
      background-color: #E6F9F6;
    }

    .tk-ind-green {
      background-color: #EFFAEE;
    }

    .tk-ind-purple {
      background-color: #F3E8FD;
    }

    .tk-ind-yellow {
      background-color: #FFF8E6;
    }

    .tk-sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 12px;
      width: 100%;
    }

    .tk-clock-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      font-size: 10px;
      opacity: 0.9;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .tk-clock-tile {
      width: 40px;
      height: 36px;
      background-color: #6F7884;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px 2px 0 0;
    }

    .tk-clock-indicator {
      width: 40px;
      height: 4px;
      background-color: #FEEAE6;
      border-radius: 0 0 2px 2px;
      margin-bottom: 4px;
    }

    .tk-user-circle {
      width: 32px;
      height: 32px;
      background-color: #fff;
      color: #3F4757;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .tk-time-display {
      font-size: 10px;
      color: white;
      margin-top: 4px;
    }

    /* ── Hide nav-top and nav-left on mobile ── */
    @media (max-width: 767px) {
      .tk-header {
        display: none !important;
      }

      .tk-sidebar {
        display: none !important;
      }
    }

    /* ── React root fills remaining space and scrolls ── */
    #root {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- ══════════════ NAV-TOP (header from lead-details) ══════════════ -->

    <div class="tk-header-left">
      <!-- App Launcher (9 dots) -->
      <div class="tk-app-launcher">

            fill="white" />
        </svg>
      </div>
      <!-- Tekion Logo -->
      <div class="tk-logo">
        <img src="assets/tekion-logo.gif" alt="Tekion" style="height: 16px; width: auto; display: block;" />
      </div>
    </div>

    <div class="tk-search-container">
      <div class="tk-search-input-wrapper">
        <div class="tk-search-icon">

    function updateTkTime() {
      const el = document.getElementById('tk-time');
      if (!el) return;
      const now = new Date();
      let h = now.getHours(), m = now.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      el.textContent = h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
    }

              const sec = CUSTOMIZE_SECTIONS.find(s => s.id === id);
              if (!sec) return null;
              const isOn = visible.has(id);
              const isDragging = widgetDragItem === i;
              const isDragOver = widgetDragOver === i && widgetDragItem !== i;
              return (
                <div key={id}
                  draggable
                  onDragStart={() => setWidgetDragItem(i)}
                  onDragEnter={() => setWidgetDragOver(i)}
                  onDragOver={e => e.preventDefault()}
                  onDrop={() => {
                    if (widgetDragItem === null || widgetDragItem === i) { setWidgetDragOver(null); return; }
                    const next = [...order];
                    const dragged = next.splice(widgetDragItem, 1)[0];
                    next.splice(i, 0, dragged);
                    setDraftOrder(next);
                    setWidgetDragItem(null); setWidgetDragOver(null);

                                const slidesLeft = partial != null ? totalSlides - 1 - partial : 0;
                                // Locked card (today's upcoming briefs — not ready yet)
                                if (!ready) return (
                                  <div key={s.id}
                                    className="brief-tooltip"
                                    data-tooltip={`Brief will be generated by ${s.time}`}
                                    style={{ cursor: "default", display: "flex", flexDirection: "column", gap: 0, borderRadius: 8, border: "1px solid #EFEFEF", background: "#FFF", padding: 5, minWidth: 0 }}>
                                    <div style={{ width: "100%", height: 72, borderRadius: 7, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>
                                      <div style={{ position: "absolute", inset: 0, background: s.gradient, opacity: 0.18 }} />
                                      <div style={{ position: "absolute", inset: 0, background: "rgba(250,250,250,0.58)" }} />
                                      <span style={{ fontSize: 24, position: "relative", zIndex: 1, opacity: 0.52, filter: "grayscale(15%)" }}>{s.icon}</span>
                                      <div style={{ position: "absolute", top: 6, right: 6, zIndex: 2, width: 18, height: 18, borderRadius: 4, background: "rgba(0,0,0,0.10)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                                      </div>
                                    </div>
                                    <div style={{ padding: "6px 4px 2px", display: "flex", flexDirection: "column", gap: 1, minWidth: 0, overflow: "hidden" }}>
                                      <span style={{ fontSize: 12, fontWeight: 600, color: "#9CA3AF", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontFamily: sans }}>{s.label}</span>
                                      <span style={{ fontSize: 12, fontWeight: 500, color: "#C4C4C4", fontFamily: sans }}>{s.time}</span>
                                    </div>
                                  </div>
                                );
                                // Ready card (today's morning brief OR any past story shown as seen)
                                return (
                                  <div key={s.id}
                                    onClick={() => !isPast && openStory(s)}
                                    className="recent-card"
                                    style={{ cursor: isPast ? "default" : "pointer", display: "flex", flexDirection: "column", gap: 0, minWidth: 0 }}>
                                    <div style={{ width: "100%", height: 72, borderRadius: 7, background: s.gradient, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", filter: seen ? "grayscale(40%) brightness(0.88)" : "none" }}>
                                      <span style={{ fontSize: 32, filter: "drop-shadow(0 2px 8px rgba(0,0,0,0.25))" }}>{s.icon}</span>
                                      {seen && (
                                        <div style={{ position: "absolute", top: 6, left: 6, background: "rgba(0,0,0,0.38)", borderRadius: 4, padding: "1px 5px", fontSize: 10, fontWeight: 700, color: "#FFF", letterSpacing: "0.03em", display: "flex", alignItems: "center", gap: 3 }}>
                                          <svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="#FFF" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Seen
                                        </div>
                                      )}
                                      {!seen && partial != null && slidesLeft > 0 && (
                                        <div style={{ position: "absolute", top: 6, left: 6, background: "rgba(0,0,0,0.38)", borderRadius: 4, padding: "1px 5px", fontSize: 10, fontWeight: 700, color: "#FFF" }}>{slidesLeft} left</div>
                                      )}
                                      {!seen && partial == null && totalSlides > 0 && (
                                        <div style={{ position: "absolute", top: 6, left: 6, background: "rgba(0,0,0,0.28)", borderRadius: 4, padding: "1px 5px", fontSize: 10, fontWeight: 700, color: "#FFF" }}>{totalSlides}</div>
                                      )}
                                    </div>
                                    <div style={{ padding: "6px 4px 2px", display: "flex", flexDirection: "column", gap: 1, minWidth: 0, overflow: "hidden" }}>
                                      <div style={{ display: "flex", alignItems: "center", gap: 3, minWidth: 0 }}>
                                        <span style={{ fontSize: 12, fontWeight: 700, color: seen ? "#9CA3AF" : "#18181B", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", flex: 1, minWidth: 0, fontFamily: sans }}>{s.label}</span>
                                        {!seen && !isPast && <svg className="redirect-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ flexShrink: 0 }}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg>}
                                      </div>
                                      <span style={{ fontSize: 12, fontWeight: 500, color: "#9CA3AF", fontFamily: sans }}>{s.time}</span>
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          );
                        })()}

                        {/* Cards — hidden when "briefs" filter is active */}
                        {feedFilter !== "briefs" && <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
                          {group.items.map((item, i) => {
                            const isExpired = item.expired;
                            const actionTaken = item.actionTaken || null;
                            const hasImage = !!item.img;
                            const hasMilestone = !!item.milestoneGrad;
                            const hasPattern = !!item.patternGraphic;
                            const hasStatStrip = !!item.statStrip;
                            const hasHeatmap = !!item.heatmapChart;
                            const hasFunnel = !!item.funnelChart;
                            const isUnread = isToday && !isExpired && !readCards.has(item.title);
                            const isSaved = savedCards.has(item.title);

                            return (
                              <div key={i} data-cardid={item.title} className={isExpired ? "" : "card-hover"}
                                ref={el => {
                                  if (!el || !isUnread) return;
                                  const obs = new IntersectionObserver(([entry]) => {
                                    if (entry.isIntersecting) { markRead(item.title); obs.disconnect(); }
                                  }, { rootMargin: "0px 0px -90% 0px", threshold: 0 });
                                  obs.observe(el);
                                }}
                                onClick={() => { if (isUnread) markRead(item.title); }}
                                style={{
                                background: isExpired ? "#FAFAFA" : "#FFF",
                                borderRadius: 8,
                                border: isUnread ? "1px solid #C4C9D4" : "1px solid #EBEBEB",
                                overflow: "hidden",
                                transition: "box-shadow 0.15s, transform 0.15s, border-color 0.3s",
                                position: "relative",
                              }}>

                                {/* ── Title row (title left, timestamp right) ── */}
                                <div style={{ padding: "14px 16px 12px" }}>
                                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 10, marginBottom: 6 }}>
                                    <div style={{ fontSize: 17, fontWeight: 800, color: isExpired ? "#6B7280" : "#18181B", letterSpacing: "-0.025em", lineHeight: 1.3, flex: 1, minWidth: 0 }}>
                                      {item.title}
                                    </div>
                                    {!isExpired && (
                                      <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                                        {item.isLive && (
                                          <span style={{ display: "flex", alignItems: "center", gap: 4, background: "#FEF2F2", borderRadius: 4, padding: "2px 7px 2px 5px" }}>
                                            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "#EF4444", animation: "pulse 1.5s infinite", display: "inline-block", flexShrink: 0 }} />
                                            <span style={{ fontSize: 10, fontWeight: 700, color: "#EF4444", letterSpacing: "0.04em" }}>LIVE</span>
                                          </span>
                                        )}
                                        <span style={{ fontSize: 11, fontWeight: 500, color: "#6B7280", whiteSpace: "nowrap", paddingTop: 1 }}>{item.postedAt}</span>
                                      </div>
                                    )}
                                  </div>
                                  {/* Meta pills row */}
                                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                                    {/* Tag pill moved here from header */}
                                    <span style={{ fontSize: 10, fontWeight: 700, color: isExpired ? "#9CA3AF" : item.tagColor, background: isExpired ? "#F3F4F6" : item.tagBg, padding: "3px 9px", borderRadius: 20, letterSpacing: "0.03em", whiteSpace: "nowrap" }}>
                                      {isExpired ? "Expired" : item.tag}
                                    </span>
                                    <span style={{ fontSize: 11, fontWeight: 500, color: "#6B7280", background: "#F3F4F6", padding: "3px 9px", borderRadius: 20 }}>{item.subtitle.split("·")[0].trim()}</span>
                                    {isExpired && (
                                      <span style={{ fontSize: 10, fontWeight: 700, color: "#9CA3AF", background: "#F3F4F6", padding: "3px 9px", borderRadius: 20, display: "flex", alignItems: "center", gap: 4 }}>
                                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2.5"/></svg>
                                        Not valid
                                      </span>
                                    )}
                                  </div>
                                </div>

                                {/* ── Media grid — hero left, stacked thumbs right ── */}
                                {hasImage && (
                                  <>
                                    {/* Image grid — full width when only 1 image, two-col when extras */}
                                    {item.imgs && item.imgs.length > 0 ? (
                                      <div style={{ margin: "0 16px 0", display: "grid", gridTemplateColumns: "1fr 36%", gap: 4, height: 180, borderRadius: 10, overflow: "hidden" }}>
                                        {/* Left: clean hero image */}
                                        <div style={{ position: "relative", overflow: "hidden", background: "#F3F4F6" }}>
                                          <img src={item.img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} onError={e => e.target.style.display = "none"} />
                                          {isExpired && <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.3)" }} />}
                                        </div>
                                        {/* Right: stacked thumbnails */}
                                        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                                          {item.imgs.map((src, si) => (
                                            <div key={si} style={{ flex: 1, overflow: "hidden", background: "#F3F4F6", position: "relative" }}>
                                              <img src={src} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} onError={e => e.target.style.display = "none"} />
                                              {isExpired && <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.3)" }} />}
                                            </div>
                                          ))}
                                        </div>
                                      </div>
                                    ) : (
                                      /* Single image — full width */
                                      <div style={{ margin: "0 16px 0", height: 180, borderRadius: 10, overflow: "hidden", position: "relative", background: "#F3F4F6" }}>
                                        <img src={item.img} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} onError={e => e.target.style.display = "none"} />
                                        {isExpired && <div style={{ position: "absolute", inset: 0, background: "rgba(255,255,255,0.3)" }} />}
                                      </div>
                                    )}
                                    {/* Stat strip — separated below image with its own border */}
                                    <div style={{ margin: "8px 16px 14px", display: "flex", borderRadius: 8, overflow: "hidden", border: "1px solid #EBEBEB" }}>
                                      {item.metrics.map((m, mi) => (
                                        <div key={mi} style={{
                                          flex: 1, padding: "10px 14px",
                                          background: "#FAFAFA",
                                          borderLeft: mi > 0 ? "1px solid #EBEBEB" : "none",
                                          display: "flex", flexDirection: "column", gap: 3,
                                        }}>
                                          <span style={{ fontSize: 15, fontWeight: 700, color: isExpired ? "#9CA3AF" : "#18181B", letterSpacing: "-0.02em", lineHeight: 1 }}>{m.value}</span>
                                          <span style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", textTransform: "uppercase", letterSpacing: "0.06em" }}>{m.label}</span>
                                        </div>
                                      ))}
                                    </div>
                                  </>
                                )}

                                {/* ── Milestone banner ── */}
                                {hasMilestone && (
                                  <div style={{ margin: "0 16px 14px", borderRadius: 10, overflow: "hidden", background: isExpired ? "#F3F4F6" : item.milestoneGrad, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 0, height: 100 }}>
                                    {/* Left: emoji + label */}
                                    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, borderRight: "1px solid rgba(255,255,255,0.1)" }}>
                                      <span style={{ fontSize: 34, lineHeight: 1 }}>{item.milestoneEmoji}</span>
                                      <span style={{ fontSize: 9, fontWeight: 700, color: isExpired ? "#9CA3AF" : "rgba(255,255,255,0.7)", letterSpacing: "0.07em", textTransform: "uppercase" }}>{item.milestoneLabel}</span>
                                    </div>
                                    {/* Right: metrics */}
                                    <div style={{ display: "flex", flexDirection: "column", gap: 5, padding: "14px 16px" }}>
                                      {item.metrics.map((m, mi) => (
                                        <div key={mi} style={{ display: "flex", flexDirection: "column" }}>
                                          <span style={{ fontSize: 18, fontWeight: 800, color: isExpired ? "#9CA3AF" : "#FFF", letterSpacing: "-0.02em", lineHeight: 1 }}>{m.value}</span>
                                          <span style={{ fontSize: 9, fontWeight: 600, color: isExpired ? "#C0C0C0" : "rgba(255,255,255,0.5)", textTransform: "uppercase", letterSpacing: "0.05em", marginTop: 1 }}>{m.label}</span>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {/* ── Pattern banner ── */}
                                {hasPattern && (
                                  <div style={{ margin: "0 16px 14px", borderRadius: 10, overflow: "hidden", background: isExpired ? "#F3F4F6" : "linear-gradient(135deg,#0f0c29,#302b63,#1e1b4b)", display: "grid", gridTemplateColumns: "1fr 90px", height: 100 }}>
                                    {/* Chart area */}
                                    <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "0 10px" }}>
                                      <svg width="100%" height="56" viewBox="0 0 180 56" preserveAspectRatio="none" fill="none">
                                        <polyline points="0,44 30,40 55,38 80,46 110,22 135,15 158,28 180,14" stroke={isExpired ? "#9CA3AF" : item.accent} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                                        <polyline points="0,44 30,40 55,38 80,46 110,22 135,15 158,28 180,14 180,56 0,56" fill={isExpired ? "#9CA3AF" : item.accent} fillOpacity="0.12"/>
                                      </svg>
                                    </div>
                                    {/* Metrics */}
                                    <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "14px 14px 14px 6px", justifyContent: "center" }}>
                                      {item.metrics.map((m, mi) => (
                                        <div key={mi} style={{ display: "flex", flexDirection: "column" }}>
                                          <span style={{ fontSize: 16, fontWeight: 800, color: isExpired ? "#9CA3AF" : (mi === 0 ? item.accent : "rgba(255,255,255,0.55)"), letterSpacing: "-0.02em", lineHeight: 1 }}>{m.value}</span>
                                          <span style={{ fontSize: 8.5, fontWeight: 600, color: isExpired ? "#C0C0C0" : "rgba(255,255,255,0.4)", textTransform: "uppercase", letterSpacing: "0.05em", marginTop: 1 }}>{m.label}</span>
                                        </div>
                                      ))}
                                    </div>
                                  </div>
                                )}

                                {/* ── Stat strip ── */}
                                {hasStatStrip && (
                                  <div style={{ display: "flex", margin: "0 16px 14px", borderRadius: 8, overflow: "hidden", border: "1px solid #EBEBEB" }}>
                                    {item.metrics.map((m, mi) => (
                                      <div key={mi} style={{
                                        flex: 1, padding: "10px 14px",
                                        background: "#FAFAFA",
                                        borderLeft: mi > 0 ? "1px solid #EBEBEB" : "none",
                                        display: "flex", flexDirection: "column", gap: 3,
                                      }}>
                                        <div style={{ fontSize: 15, fontWeight: 700, letterSpacing: "-0.02em", lineHeight: 1, color: isExpired ? "#9CA3AF" : "#18181B" }}>{m.value}</div>
                                        <div style={{ fontSize: 10, fontWeight: 500, textTransform: "uppercase", letterSpacing: "0.06em", color: "#9CA3AF" }}>{m.label}</div>
                                      </div>
                                    ))}
                                  </div>
                                )}

                                {/* ── Heatmap chart ── */}
                                {hasHeatmap && (() => {
                                  const hm = item.heatmap;
                                  const cellColor = (v) => isExpired ? ["#E5E7EB","#D1D5DB","#9CA3AF"][v] : ["#BBDEFB","#4CAF50","#1B5E20"][v];
                                  return (
                                    <div style={{ margin: "0 16px 14px", borderRadius: 10, background: "#FAFAF7", border: "1px solid #EBEBEB", padding: "14px 14px 10px" }}>
                                      {/* Best/Avoid boxes */}
                                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
                                        <div style={{ background: isExpired ? "#F3F4F6" : "#F0FDF4", border: `1px solid ${isExpired ? "#E5E7EB" : "#BBF7D0"}`, borderRadius: 8, padding: "10px 12px" }}>
                                          <div style={{ fontSize: 9, fontWeight: 700, color: isExpired ? "#9CA3AF" : "#166534", letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 4 }}>Best Window</div>
                                          <div style={{ fontSize: 20, fontWeight: 800, color: isExpired ? "#9CA3AF" : "#14532D", letterSpacing: "-0.03em", lineHeight: 1.1 }}>{hm.best}</div>
                                          <div style={{ fontSize: 11, color: isExpired ? "#9CA3AF" : "#16A34A", fontWeight: 500, marginTop: 3 }}>{hm.bestSub}</div>
                                        </div>
                                        <div style={{ background: isExpired ? "#F3F4F6" : "#FFF5F5", border: `1px solid ${isExpired ? "#E5E7EB" : "#FECACA"}`, borderRadius: 8, padding: "10px 12px" }}>
                                          <div style={{ fontSize: 9, fontWeight: 700, color: isExpired ? "#9CA3AF" : "#991B1B", letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 4 }}>Avoid</div>
                                          <div style={{ fontSize: 20, fontWeight: 800, color: isExpired ? "#9CA3AF" : "#7F1D1D", letterSpacing: "-0.03em", lineHeight: 1.1 }}>{hm.avoid}</div>
                                          <div style={{ fontSize: 11, color: isExpired ? "#9CA3AF" : "#DC2626", fontWeight: 500, marginTop: 3 }}>{hm.avoidSub}</div>
                                        </div>
                                      </div>
                                      {/* Grid */}
                                      <div style={{ display: "grid", gridTemplateColumns: `40px repeat(${hm.days.length}, 1fr)`, gap: 3, alignItems: "center" }}>
                                        {/* Header row */}
                                        <div />
                                        {hm.days.map(d => (
                                          <div key={d} style={{ fontSize: 10, fontWeight: 600, color: "#9CA3AF", textAlign: "center", paddingBottom: 3 }}>{d}</div>
                                        ))}
                                        {/* Data rows */}
                                        {hm.times.map((t, ri) => (
                                          <>
                                            <div key={"t"+ri} style={{ fontSize: 10, fontWeight: 500, color: "#9CA3AF", textAlign: "right", paddingRight: 6 }}>{t}</div>
                                            {hm.values[ri].map((v, ci) => (
                                              <div key={ci} style={{ height: 22, borderRadius: 4, background: cellColor(v) }} />
                                            ))}
                                          </>
                                        ))}
                                      </div>
                                      {/* Legend */}
                                      <div style={{ display: "flex", gap: 12, marginTop: 10, alignItems: "center" }}>
                                        {["Low","Mid","High"].map((l, i) => (
                                          <div key={l} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                                            <div style={{ width: 12, height: 12, borderRadius: 3, background: cellColor(i) }} />
                                            <span style={{ fontSize: 10, color: "#6B7280", fontWeight: 500 }}>{l}</span>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  );
                                })()}

                                {/* ── Funnel chart ── */}
                                {hasFunnel && (() => {
                                  const fn = item.funnel;
                                  return (
                                    <div style={{ margin: "0 16px 14px", borderRadius: 10, background: "#FAFAF7", border: "1px solid #EBEBEB", padding: "14px 14px 12px" }}>
                                      {/* Stat boxes */}
                                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 14 }}>
                                        <div style={{ background: isExpired ? "#F3F4F6" : "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 8, padding: "10px 12px" }}>
                                          <div style={{ fontSize: 9, fontWeight: 700, color: "#9CA3AF", letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 4 }}>Close Rate</div>
                                          <div style={{ fontSize: 26, fontWeight: 800, color: isExpired ? "#9CA3AF" : "#18181B", letterSpacing: "-0.03em", lineHeight: 1 }}>{fn.closeRate}</div>
                                          <div style={{ fontSize: 11, color: isExpired ? "#9CA3AF" : "#16A34A", fontWeight: 600, marginTop: 3 }}>{fn.closeRateSub}</div>
                                        </div>
                                        <div style={{ background: isExpired ? "#F3F4F6" : "#F9FAFB", border: "1px solid #E5E7EB", borderRadius: 8, padding: "10px 12px" }}>
                                          <div style={{ fontSize: 9, fontWeight: 700, color: "#9CA3AF", letterSpacing: "0.07em", textTransform: "uppercase", marginBottom: 4 }}>Sweet Spot</div>
                                          <div style={{ fontSize: 22, fontWeight: 800, color: isExpired ? "#9CA3AF" : "#18181B", letterSpacing: "-0.03em", lineHeight: 1.1 }}>{fn.sweetSpot}</div>
                                          <div style={{ fontSize: 11, color: isExpired ? "#9CA3AF" : "#6B7280", fontWeight: 500, marginTop: 3 }}>{fn.sweetSpotSub}</div>
                                        </div>
                                      </div>
                                      {/* Pipeline drop-off bars */}
                                      <div style={{ fontSize: 11, fontWeight: 600, color: "#6B7280", marginBottom: 8 }}>Where deals drop off in your pipeline</div>
                                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                                        {fn.stages.map((s, si) => (
                                          <div key={si} style={{ display: "grid", gridTemplateColumns: "110px 1fr 36px", alignItems: "center", gap: 8 }}>
                                            <div style={{ fontSize: 11, fontWeight: 500, color: isExpired ? "#9CA3AF" : "#374151", textAlign: "right", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{s.label}</div>
                                            <div style={{ height: 14, borderRadius: 4, background: "#E5E7EB", overflow: "hidden" }}>
                                              <div style={{ height: "100%", width: `${s.pct}%`, background: isExpired ? "#D1D5DB" : s.color, borderRadius: 4, transition: "width 0.4s" }} />
                                            </div>
                                            <div style={{ fontSize: 11, fontWeight: 700, color: isExpired ? "#9CA3AF" : "#18181B", textAlign: "right" }}>{s.value}</div>
                                          </div>
                                        ))}
                                      </div>
                                    </div>
                                  );
                                })()}

                                {/* ── Body text ── */}
                                {(() => {
                                  const isExpanded = expandedCards.has(item.title);
                                  const bodyStyle = { fontSize: 13.5, fontWeight: 400, color: isExpired ? "#9CA3AF" : "#4B5563", lineHeight: 1.65, margin: 0 };
                                  const clampStyle = isExpanded ? {} : { display: "-webkit-box", WebkitLineClamp: 6, WebkitBoxOrient: "vertical", overflow: "hidden" };
                                  // Estimate if text is long enough to need clamping (~80 chars per line × 6 lines)
                                  const needsClamp = item.body && item.body.length > 480;
                                  return (
                                    <div style={{ padding: "0 16px 14px" }}>
                                      <p style={{ ...bodyStyle, ...clampStyle }}>{item.body}</p>
                                      {needsClamp && (
                                        <button onClick={() => toggleCardExpand(item.title)} style={{ marginTop: 4, fontSize: 12.5, fontWeight: 600, color: "#2563EB", background: "none", border: "none", padding: 0, cursor: "pointer", fontFamily: "inherit" }}>
                                          {isExpanded ? "View less" : "View more"}
                                        </button>
                                      )}
                                    </div>
                                  );
                                })()}
