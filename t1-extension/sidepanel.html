<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T1 Extension Side Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #333;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .status {
            margin-top: 16px;
            padding: 12px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 13px;
            color: #495057;
        }
        
        /* Placeholder for your pre-built UI */
        #ui-container {
            margin-top: 24px;
            padding: 16px;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            text-align: center;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>T1 Extension</h1>
        <p>Side panel is active and ready.</p>
        
        <!-- Demo controls for testing -->
        <div class="controls">
            <button id="testToast">Test Toast Message</button>
            <button id="showOverlay">Show Overlay</button>
            <button id="hideOverlay">Hide Overlay</button>
        </div>
        
        <div class="status" id="status">
            Ready. Click buttons to test functionality.
        </div>
        
        <!-- Placeholder for your pre-built UI -->
        <div id="ui-container">
            <p>📦 Your pre-built UI will be loaded here</p>
            <p style="font-size: 12px; margin-top: 8px;">
                Replace this with your ui.html, ui.css, and ui.js files
            </p>
        </div>
    </div>
    
    <!-- Load the side panel bridge logic -->
    <script src="sidepanel.js"></script>
</body>
</html>
